{"id":128,"statement":"DBG_CLOSE_ALL_AREAS (F4) is a map-zone / brush-model cull toggle, NOT a fire or win trivializer. Poll @0x0043dcf2 inside TE_BModel::Think (undefined fn 0x0043dc60, vtable 0x004e0df0); the poll is NOT g_devMode-gated. On press it calls TE_BModel::UpdateMapZones(this, 0) (0x0043c1a0) which loops the entity's MapZone-id list calling geWorld_OpenModel(world, model, 0), forcing every ticking moving brush-model (area/region-divider brushes) into its CLOSED BSP state and re-registering MapZone occupancy. It does NOT extinguish fire, open exit volumes, or satisfy the win check. Practical use: collapse the streamed areas so only the current room renders/collides.","confidence":"high","status":"supported","subsystem":"sharedents","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 22:45:21"},
{"id":127,"statement":"g_devMode has 17 readers. bind-only (poll runs unconditionally, only the keybind is gated): the GameControls::Construct BindKey block @0x0043a009, and thereby DBG_CLOSE_ALL_AREAS (F4, poll in TE_BModel::Think), DBG_TOGGLE_SPECT (F7) and DBG_WIN_LEVEL (F8, polls in PlayerRescueEnt::Think) -- so a binary patch that bound those keys would make them work without devMode. poll-time (feature dead without devMode): GenErr::Dispatch sev-2 console routing, Console::Print/WatchPrint, Dev_PollStatsToggles (F2/F3) via PumpPendingState, the WinMain intro AVIs, RescueBot F6, the RescueHud <15fps sprite, PlayerHose F6, ROCRender F11 crash, the dev-console object creation in roc_CreateEngineSubsystems @0x00499361, F12 quit in MainWindow::WndProc, geEngine_EnableAppLog and both video-mode-dialog branches in MainWindow::Init. The DEV CONSOLE is object-gated: without devMode roc_CreateEngineSubsystems never allocates it and both key dispatchers bail on the null pointer, so a retail player cannot open the console by any key or cfg switch. devMode does NOT alter assert severity / the MessageBox fatal path / int3.","confidence":"high","status":"supported","subsystem":"main","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 22:45:21"},
{"id":126,"statement":"g_devMode (0x00502a78, cvar \"ImADeveloper\") is set exactly once by Config::Load (0x00426650) from FDNYFirefighter.cfg [DEBUG] section, accepting ONLY the literal strings \"true\"/\"false\" (byte store @0x00426c9a / @0x00426cbb); absent key -> .bss default 0. NOT re-read, and there is NO other writer -- no `set` verb, no console, no DBG_* key, no menu widget, no registry, no environment var, no command-line parse (verified by xref + pointer byte-scan: 17 reads, 0 other writes). Config::Save round-trips it as true/false but never re-loads. Rand_Seed(timeGetTime()) in WinMain runs before Config::Load so devMode never affects RNG seeding.","confidence":"high","status":"supported","subsystem":"main","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 22:45:21"},
{"id":125,"statement":"SPEEDRUN cluster 4 -- split-relevant RNG. FIRE SPREAD IS FULLY DETERMINISTIC: FireRescueEnt::Think (0x00449fe0) + AdvanceSpread (0x00449340) advance `progress += g_frameDeltaTime*speed` along authored PathPoints with NO Rand_* call anywhere in the spread path (verified by full disassembly); child-fire spawn/keyframe times are __ftol of deterministic expressions. Fire blocking a route/exit is a pure function of dt + authored geometry + authored speed. Only fire RNG = a 1-of-3 ambient sound pick and a `>0.4` gate on a one-shot flare VISUAL (cosmetic). RESCUEBOT TIMING IS RNG (ArmRescueAttemptTimer 0x004541a0 = base + Rand_Below(30000|60000); BeginRescue 0x00454750 dropoff = g_gameTimeMs + 4000 + Rand_Below(4000)) and a bot rescue removes a required victim + calls the same UpdateZonesAndWin gate -- so it CAN flip the win/finalexit condition. BUT the bot is opt-in: only runs after the `runrescuebot` verb or the dev-only DBG_ACTIVATE_RESCUEBOT key; default missions never enable it, and TryStartRescue picks victims in list order (deterministic). Everything else drawing from the MT19937 stream is cosmetic. Net: the only split-relevant RNG a runner faces is the victim spawn-spot pick (one draw, seed = timeGetTime() at WinMain, never reset), plus RescueBot timing only when explicitly enabled.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 21:55:10"},
{"id":124,"statement":"SPEEDRUN cluster 4 -- cutscene/movie skip. PlayFullscreenMovie (0x00485650) runs a bare PeekMessage/DispatchMessage pump (no WaitForSingleObject, no input poll in the loop). Exit: MainWindow::WndProc WM_KEYDOWN -> Movie_RequestStop (0x004851c0) sets g_moviePlaying=0 -- ANY keyboard key-down aborts. Mouse messages route with no skip check -> clicks do NOT skip. Natural end via the 0x8001 notify -> Movie_DrainCompletionEvents (EC_COMPLETE / EC_USERABORT). The two intro AVIs (ActiValue, Mekada) play in WinMain gated ONLY by `if (g_devMode == 0)`; End.avi (campaign end) also via PlayFullscreenMovie. All key-skippable. g_dbg_skipMenus (0x00502a79) is MISNAMED -- it only gates GenErr log-file writes; there is no skip-menus feature and no unskippable screen between the main menu and gameplay.","confidence":"high","status":"supported","subsystem":"main","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 21:55:10"},
{"id":123,"statement":"SPEEDRUN cluster 4 -- timing. g_gameClock (0x00502ab8) has SubTimer[0] \"game time\" (pausable, feeds g_gameTimeMs-delta cooldowns) and SubTimer[1] \"real\" (free-running); GameClock::Tick publishes only the active one's dt -> g_frameDeltaTime and ms -> g_gameTimeMs. MenuManager::Activate (0x0042d480) calls SetTimeSource(1) on menu-open (switch to real timer, PAUSE SubTimer[0]); TeardownToLoading calls SetTimeSource(0). The mission countdown is PlayerRescueEnt+0x32fc (float sec), decremented `-= g_frameDeltaTime` once per Think frame (<0 -> +0x32f8=2 lose); +0x343c in that body is activeToolIndex, NOT the timer. RESULT: the in-game ESC menu does NOT pause the mission countdown -- TickSubsystems/PumpPendingState have no pause gate, so Think keeps decrementing it in real time behind the menu (SubTimer[0] pause only rebases g_gameTimeMs cooldowns). Alt-tab and fullscreen movies DO freeze it (whole frame loop halts). An in-game level load costs <= 0.1 s of mission/game time (the ComputeFrameDelta dt clamp). settimescale / settime / addtimecmd are ScriptedBModelEnt::ExecCommand verbs acting only on that one entity's sequence playhead (+0x1b4) / rate (+0x1b8) / timed-command list (+0x148) -- ZERO effect on the global clock or the countdown. There is NO global time-scale verb or console command.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 21:55:10"},

{"id":121,"statement":"SPEEDRUN cluster 3 -- tool recoil is NOT a movement boost. UpdateLocomotionAndTools (0x0044f340) reads the active tool vecs +0x1e4/+0x1f0 into player+0x3488 = the ViewRhythm view-sway offset (camera weapon sway), NOT body velocity (the carried-tools \"adds into player locomotion\" note was imprecise). Separately, Think calls the active tool's vtable slot +0x34 (\"reaction velocity\") and, while grounded, writes it to player+0xfc (overwrite if no move input, add if moving): Tool_Axe and Tool_Extinguisher return Tool::GetReactionVelocity_ZeroStub (0x0045f7c0, zero vec); only Tool_Hose::GetReactionVelocity (0x004633d0) returns non-zero -- a UNIT horizontal aim-steerable vector while the stream is active (hose+0xc3c), i.e. ~1 unit/s vs the 400 u/s run cap (~0.25%), recomputed every frame with no accumulation. The axe-hit recoil (g_axeHitRegistered / DAT_00502e04, set only by AxeSwing::ResolveHit on a real breakable hit) only binds an XFormAnimMover view animation onto player+0x34a4 -- no body impulse, and swinging at air never triggers it. VERDICT: ABSENT (hose MARGINAL), STABLE.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 21:36:42"},
{"id":120,"statement":"The victim-counter race is DEFENDED: VictimRescueEnt::SpawnAtSpot (0x0045d5b0) writes PlayerRescueEnt+0x3528 = -1 on EVERY victim spawn, forcing a fresh EndMission tally the next frame; FlushSpawnQueue completes synchronously during load so a same-frame script finalexit still sees the post-flush count. Verb_FinalExit's gate is strict `outstanding == 0` (not <=0), so over-delivery (delivered > total, e.g. from a bookkeeping desync) makes outstanding negative -> gate FAILS -> softlock, not a skip. +0x3530 (lost) is dead code -- victims have no death state, nothing writes it, so outstanding = total - delivered. finalexitloadmap blocks a nonexistent .bsp (FindFirstFileA) but does NO campaign-order/identity check.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 21:21:12"},

{"id":118,"statement":"SEQUENCE BREAK -- climb-verb fly. Verb_Climb (0x0044c0b0) sets locomotion state 5 and zeroes velocity; its guard is `state != 5 && +0x3300 == 0` where +0x3300 is the CARRIED/THROWN OBJECT pointer, NOT a ladder flag -- the game has NO ladder subsystem (zero \"ladder\" strings, Verb_Climb is the only climb code). In state 5: gravity 0; wish vector rotated by the full yaw+pitch basis (Xform_ComposeYawPitch) so look-up + MOVE_FORWARD gives a +Y wish; vel.Y NOT saved/restored around the blend (unlike states 3/4) so the vertical wish drives vel.Y; speed cap 400; blend 0.2. DepenetrateFromWorld STILL runs (only spectator skips it) so you fly through open space and hard-stop on solids. No leash/anchor/max-height/timeout/recheck. Exits: unclimb verb, reset, or JUMP (state->3, vel.Y=400 SET, ~73u bounce). EXISTS, STABLE. Same verb-access requirement as escape.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 21:21:12"},
{"id":117,"statement":"SEQUENCE BREAK -- escape-verb delivery skip. Verb_Escape (0x004513a0) unconditionally tail-calls DeliverCarriedSurvivor (0x00451160, Ghidra-misnamed TeleportToCheckpoint); that helper's ONLY gate is +0x3534 != 0 (\"carrying a victim\") -> +0x352c(delivered) += 1, PlayerStats \"Rescues\" += 1, WarpToRescuerAndFade, clear carry, UpdateZonesAndWin. NO zone/ground/distance check. The onGround && +0x3450 > 0.5 test inside Verb_Escape gates only the checkpoint pos snapshot (+0x3434 there is the saved yaw, not a gate). Pickup (msg 0x7532 / BeginCarrySurvivor) is automatic on AABB overlap. So: walk over each victim, escape from anywhere, repeat to delivered==total, then one finalexit (Verb_FinalExit has ZERO positional check, strict outstanding==0 gate) ends the level from any position. EXISTS, STABLE. Requires verb access (any level script, or the dev console when g_devMode is on).","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 21:21:12"},
{"id":116,"statement":"Player collision: the ONLY per-frame world collision is BModelEnt::DepenetrateFromWorld (0x0043f6d0), run on the pre-move position; Think then does a RAW pos += disp with no clamp to the swept contact point. The swept geWorld_Collision box (TraceToFloor 0x00492ce0) yields a binary response via ClipVelocitySimple: normal.Y>=0.5 (floor/<=60deg) -> disp UNCHANGED (full move applies, no surface clamp); normal.Y<0.5 (wall/ceiling) -> disp AND velocity zeroed (dead stop, no slide). The iterative push-out virtual [vtbl+0x38] is 0x0043f670 = RET 4, an empty stub in every entity vtable, so depenetration can NEVER eject the player. Consequences: (a) clean high-speed wall clips are ABSENT -- the swept test catches even a ~40u dt=0.1 step, producing a hard stop; (b) falling through a thin floor / off a thin ledge EXISTS and is FPS-dependent -- the walkable branch does not shorten disp, so one large-dt frame plants the whole AABB past a thin brush over a void; (c) start-solid ooze-through EXISTS but is NON-DETERMINISTIC (engine start-solid plane choice: >=0.5 -> drift out at <=400*dt/frame, <0.5 -> frozen); (d) moving TE_BModel brushes impart NOTHING (no push/crush/carry -- TE_BModel::Think never touches player pos/vel); (e) SnapToFloor miss teleports the player to world origin (0,1,0), non-fatal, respawn-path only; (f) the player has NO auto-step (+0x138 clearance probe is BModelEnt::Think only, never invoked on the player).","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 21:01:59"},
{"id":115,"statement":"Player MOVEMENT vs frame rate: ground TOP SPEED is FPS-independent (the t=frac^(27*dt) blend fixed point = wishspeed regardless of dt), but JUMP APEX and AIR TIME are FPS-dependent because IntegrateVelocity does disp = v*dt + 0.5*a*dt^2 after v += a*dt (effective y(T) = 400T - 500T^2 - 1000*T*dt): apex 80.0u ideal / 73.3u at the stock 60 cap / 66.7 / 60.0 / 40.0u at 10 FPS; air time 0.800/0.767/.../0.600s; time-to-apex fixed ~0.40s; horizontal jump distance scales with air time (320/307/.../240u @ 400u/s). Coyote window = exactly one frame = dt s. Removing the Sleep(1) 60 FPS cap in GameClock::ComputeFrameDelta (0x0042bf70) is a STABLE deterministic speedrun lever: ~9% higher, ~4% longer jumps, asymptoting at dt->0; ground speed/rotation unchanged. Lowering FPS has no advantage. No low-FPS double jump.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 21:01:59"},
{"id":114,"statement":"Player view rotation is frame-rate INDEPENDENT by design: Think does yaw/pitch += GetAxis(\"STEER_YAW\"/\"STEER_PITCH\") with no dt; GetSteerAxis (0x00439310) = -g_cvar_mouseSens * (float)accumulator, linear (no accel/exponent/clamp); DrainMouseBuffer (0x00437ab0) SUMS every buffered DIMOFS_X/Y delta per frame, so total rotation for a fixed hand motion is identical at 60/30/20/10 FPS. HOWEVER the mouse buffer is DIPROP_BUFFERSIZE=10 and the drain accepts hr==0 only -> on DI_BUFFEROVERFLOW (S_FALSE) it drops the ENTIRE frame's motion (\"Lost sync with mouse\"), with no GetDeviceState fallback. A high-poll (500-1000Hz) mouse overflows in 5-10ms and drops rotation frames even at the 60 cap; low FPS makes it chronic -> human-nondeterministic under-rotation. Synthetic <=1 event/axis/frame never overflows -> perfectly deterministic FPS-independent aiming. MouseExc cvar (0x004ff484) is dead (zero readers).","confidence":"high","status":"supported","subsystem":"main","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 21:01:59"},
{"id":113,"statement":"Survivor spawn placement is fully deterministic-pinnable by memory modification; nothing is computed in a way a memory write cannot catch. The RNG is one global MT19937 (g_mtState 0x00501a28) seeded once by WinMain(timeGetTime()) and never re-seeded (sole Rand_Seed xref = WinMain; RequestLevelChange does not touch it), so the UNPATCHED spot index is unpredictable run-to-run and retry-to-retry -- but: (a) patching the spot SArray at victim+0x200 before pass-2 pins position regardless of the RNG index; (b) a one-time overwrite of victim+0x4c plus setting FSM state +0x120=4 disables the only self-motion (state-7 roam) permanently -- ValidateSpawn is the sole state-7 writer and runs once, nothing re-runs placement or snaps back to a spot; (c) leash radius +0x224=0 with anchor +0x218=+0x4c halts a roaming victim within ~6u. State-7 roam itself is a bounded leash (per-frame move toward an RNG/chase waypoint clamped to +0x224 around fixed anchor +0x218), never unbounded. g_debugVictims (DAT_00502aac+0x6a9) only draws roam-target tubes.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 15:47:26"},
{"id":112,"statement":"The per-level survivor set is one entity per editor-placed RCS_VictimRescue PLUS runtime \"herodown\" survivors from PlayerRescueEnt::Verb_Reset (difficulty==2 only, hard reset, <3 firefighters already down), each placed deterministically at the player reset origin (angle 0, no RNG). These are the only two runtime survivor creators. No \"spawn K of N\", no pooling, no count randomization anywhere; EndMission (0x0044fba0) tallies total-rescuable as a live count of kind==2 entities. VictimRegistry / victims.srf hold type data only (model id, beckon delays, speech names, Rescue: anims) -- no positions.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 15:47:26"},
{"id":111,"statement":"Survivor spawn POSITIONS are entirely authored, never generated. Each RCS_VictimRescue entity in the level .bsp contributes its editor origin as \"spawn-spot #0\" (VictimRescueEnt::Construct copies the geEntity user-data struct at entity+0x150 -> entity+0x4c and RegisterSpawnSpot); each RCS_VictimAltSpot marker referencing that survivor appends one more {vec3,angle} spot (VictimAltSpotEnt::Spawn 0x00459840 -> RegisterSpawnSpot). Then the two-phase entity bring-up (EntityManager::FlushSpawnQueue 0x0049c670: pass 1 Spawn vtbl+0x20 on all, pass 2 SpawnAtSpot vtbl+0x24 on all -- pass 2 UNCONDITIONAL) has SpawnAtSpot (0x0045d5b0) pick ONE spot uniformly at random: idx = Ftol(Rand_FloatRange(0, count-0.01)), copy spot[idx] -> entity+0x4c/+0x16c, SnapToFloor, plus a random skin/material variant. One draw at spawn, never re-rolled. With no alt spots the draw is forced to 0 (spawn on the editor origin). Type 0xE (\"random civilian\") additionally rolls the MODEL id (Rand_Below(3)+0xB); skin variant and idle anim are also RNG -- none of these is ever a position.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 15:47:26"},
{"id":110,"statement":"Airborne per-axis drag is (0,0,0), selected by a grounded-flag gate in PlayerRescueEnt::Think (grounded -> (1000,0,1000); airborne -> (0,0,0); climb/spectator -> (1000,1000,1000)). This is what gives the jump its floaty momentum-preserving arc and what makes bunnyhopping *feel* real even though no acceleration primitive exists to make speed compound. Corrects the earlier note that recorded a flat (1000,0,1000) drag vector.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 12:07:17"},
{"id":109,"statement":"No player speed/momentum exploit compounds in this movement model. Diagonal-speed bug: ABSENT -- the \"if (mag>1) normalize\" is conditional and pre-scale; forward(1.0)+strafe(0.75) always has mag>=1.25 and is normalized to unit, so diagonal == pure-forward == 400; pure strafe (mag 0.75) is NOT normalized so it is 0.75x = 300 (slower). Strafe-jump / air-accel by turning: ABSENT -- the blend is a convex LERP toward a pre-normalized wishvel<=wishspeed with no dot(vel,wishdir) projection term, so |vel| is bounded by max(takeoff, wishspeed) for the whole airborne period. Bunnyhop speed-build: ABSENT -- jump adds only vertical; airborne drag is (0,0,0) so horizontal speed is carried between hops (feels like a bhop) but each ground contact bleeds overspeed to <=wishspeed within 2-3 frames, far inside the mandatory 500 ms cooldown. Pitch/view momentum: ABSENT -- move vector is rotated by a yaw-only basis and vel.y is saved/restored around the blend. Wall-strafe / air-surf: MARGINAL -- ClipVelocityToPlanes preserves 100% tangential speed (no restitution/friction) and steep faces keep you airborne with zero drag, but no accel is added and the maps lack >60deg ramp geometry. Down-ramp boost: ABSENT -- the ground clamp removes the downward component, does not rotate it into horizontal. Scripted-freeze slide: EXISTS by design -- the input-move-freeze flag +0x345c blanks only the wish vector, so gravity/drag/integration keep running and a freeze during motion preserves (does not gain) momentum.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 12:07:17"},
{"id":108,"statement":"Player jump height is deterministic in the common case (flat ground, 60 FPS cap, no tool constraint, no script push): vy is driven to ~0 by the prior frame ground-clip, Verb_Jump adds exactly +400 (ADDITIVE on the ground path; SET on the ladder path), gravity is -1000, dt is pinned near 1/60 s, apex ~= 80 units, cadence fixed by the 500 ms cooldown. Bounded deviations come from: (1) dt clamp range [1/60, 0.1] + single-Euler-step integration (apex drifts a few units with frame rate); (2) taking off from a walkable slope (<=60deg) where ClipVelocityToPlanes retains the tangential velocity component so residual +-vy folds into the +400 (uphill higher, downhill lower) -- the largest real source; (3) the script-only push channel +0x5b8 (Verb_Push / \"push x y z\") applied on the takeoff frame; (4) an equipped-tool constraint plane clipping vy the same frame; (5) ladder-jump transition timing (gravity briefly 0). Moving platforms do NOT contribute -- riders track by positional depenetration only, no velocity inheritance. Crouch does NOT contribute -- it only shrinks AABB max.Y, cannot be done mid-air, and JUMP-while-crouched just stands up. No accidental double-jump: the 500 ms cooldown is a wall-clock ms stamp checked before a single Verb_Jump per frame and stamped before return.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 12:07:17"},
{"id":107,"statement":"Confirmed gameplay tuning constants (from the actual code this pass): wish fwd +-1.0 / strafe +-0.75; speed caps 400 default / 260 state-4 / 800 spectator; gravity accel.Y = -1000 (0 while climbing/spectator); jump dv +400, 500ms cooldown; pitch clamp +-20/40/70 by difficulty idx 0/1/2 (+45 floor while climbing/spectator); yaw/pitch wrap +-360; landing impact at fall vel < -200, magnitude = -vel/24, 500ms SoundCue gate. O2: drains -0.05 per 3000ms (~60s full->empty, difficulty-independent); boosted refill += dt*0.1 (~10s); low-air flag at O2 < 0.8; O2 <= 0 -> PassOut(0). Burn: += dt * 1.2 * severity into +0x3538; > 1.0 -> PassOut(1); Pain radio cooldown Rand_FloatRange(1000,2500)ms + \"Serious Burns\" stat. Mission timer: base = TLevelInfo+0x10 or 600s default, x difficulty {1.5, 1.5, 1.0}; hits 0 -> +0x3438=2 (only true level loss). Axe reach probe: 20 fwd / 10 lateral / 60 up / 100 fwd endpoint, +-6 trace box; follow-through ~1.0s, swing impulse dirs {25,-100,0} and {12.5,-7.5,10}. RescueBot: eligible victim distance >= 600.0; dropoff timer = now + 4000 + Rand_Below(4000) ms.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 11:01:11"},
{"id":106,"statement":"CORRECTIONS to earlier movement/mission notes, confirmed from PlayerRescueEnt::Think (0x00452570) / Crouch / UnCrouch / the mission-timer setup: (a) the velocity-blend fraction is INVERTED from the old note -- it is 0.2 when grounded / climbing / spectator and 0.95 when AIRBORNE (smaller fraction = snappier; airborne keeps momentum = little air control), fed to Damp_RateFromFraction(frac, 27.0). (b) The crouch/stand AABB heights were SWAPPED: standing box max.Y is 85.0 (set by \"Crouch\" @0x0044bce0 after a roc_SegmentInSolid headroom test, state->3) and crouched is 25.0 (set by \"UnCrouch\" @0x0044bcb0, state->4) -- the two function names are swapped; standing height ~85, crouched ~25. Stand AABB = min(-30,-30,-30) max(30,85,30), scalar 45.0. (c) RC_ResTimeWarn fires at 30 s remaining (WarnTimer::Check(_, timer, 0x1e)), NOT 120 s (120.0 is the DBG-spectator timer clamp, unrelated).","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 11:01:11"},
{"id":105,"statement":"The player has NO animation-selection layer -- no motion-name table, no index table, no state->anim dispatch switch. PlayerRescueEnt is first-person; its visible motion is the first-person tool/view model, driven by hard-coded string literals in each tool's own update code (only the hose does this: \"sprint\"/\"spraylr\"). PlayerRescueEnt::Init subscribes an INBOUND event table (g_playerAnimEventNames @0x004e18ec: Jump/LandingImpact/Breathe/OxyRelease/PassOut_O2/PassOut_Fire/GrabItem/ValveHookUp/ThrowObject/ActionFailed + FootStep1-4) -- these are anim/game EVENT -> sound/gameplay bindings, not state -> anim. PlayerRescueEnt::PassOut plays only a SoundCue + RC_PassOut and sets state +0x18c=6 -- no body animation. PlayerRescueEnt+0x34a4 is an XFormAnimMover (view smoothing / swing kick), not an anim table. VictimRescueEnt motion choice is ordinal-only (Rand_Below(count); the \"herodown\" model is discriminated by motionCount == 6, giving idle slots 0-2 / walk slots 3-5); the victim `playanim` script verb (VictimRescueEnt::Script_PlayAnim_UNIMPL 0x0045b3b0) is a hard \"IS UNIMPLEMENTED\" stub. The RescueBot and \"firefighter\" have no actor -- the POFighter/\"herodown\" VICTIM model is the only firefighter skeletal actor in the game.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 11:01:11"},
{"id":104,"statement":"There are TWO parallel motion-playback mechanisms and NEITHER is a per-entity state->name table. (1) AnimSeqPlayer / ActorAnimator (basic\\ActorAnimator.cpp) addresses motions by INTEGER INDEX into the model's own geMotion list -- AnimSeqPlayer::PlayMotionByIndex (0x00480ea0, Ghidra-misnamed \"PlayRandom\"): idx<0 keeps the current, else geActor_GetMotionByIndex; time is derived (ApplyPose: t = ((now-startMs) % durMs) * rate * 0.001 + startOffset -> geActor_SetPose). No blend, no crossfade, no event track; the +0x34 second slot is dead. (2) A string/NAME-addressed path: RenderInstance::SetMotionByName (0x004927d0) <- EntityCam::SetMotionByName (0x004982c0), name resolved by geActor_GetMotionByName_wrap (0x00491930). Only 4 call sites in the whole binary: PlayerHose::UpdateSprayAnim (\"sprint\" while hose state==3 else \"spraylr\"), the PropModelEnt `setmotion <name>` verb, and the scripted camera entities. NO blending code exists anywhere in the game.","confidence":"high","status":"supported","subsystem":"basic","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 11:01:11"},
{"id":103,"statement":"The dev Console (`` ` ``/~ toggle, gated on g_devMode / EnableDebugLogging) is NOT its own command system -- it is a teletype over the level script engine. Log side: Console::Print -> Console::AddLine -> a 300-line SArray<String> scrollback ring (RemoveOldestLine trims the front). Input side: Console::OnChar/OnKeyDown -- half/full state, line editing, Up/Down command history; opening it sets the pause byte *g_gameCtx+0x330. On Enter it echoes \"--> \"+line and calls ScriptEngine::ExecLine(line) -> ScriptTrigger::AddScriptLine. There is NO Console::RegisterCommand / command table. Every \"console command\" is a script verb (set/inc/if*/print/tell/hint/playsnd/loadmap/setlighttable/quake/difficulty/runrescuebot/debugvictims/help/exec/equip/select/...); \"cvars\" typed at the console = script-engine variables in g_scriptVars (set writes, listvars dumps).","confidence":"high","status":"supported","subsystem":"main","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 10:46:38"},
{"id":102,"statement":"victims.srf (VictimRegistry::Load, rescue\\VictimRegistry.cpp) is a line/token text file. A record (\"Victim:\" ...) is a 0x48-byte VictimTypeRecord: type name String @+0x00; Model: int @+0x04 (init -1) -- this int is BOTH the ROC_MODEL def id and the FindTypeIndex \"type\" value; MinBeckonDelay 2.0 / MaxBeckonDelay 4.0 @+0x08/+0x0c; a Beckon:/SpeechNames: comma-list String pool @+0x14 (GetTypeRecord returns a RANDOM element as the victim's spoken identity, fallback \"someone\"); a Rescue: comma-list of rescue-animation names @+0x2c. VictimRescueEnt::Spawn: if the resolved type index == 0xE the model is replaced with Rand_Below(3)+0xB -- type 0xE is a \"random generic civilian\" alias over models 0xB/0xC/0xD. Unknown type name -> default type + GenErr warning; unknown model # -> victim not created.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 10:46:38"},
{"id":101,"statement":"The 19 \"light tables\" (setlighttable <1..19> \"<string>\") are Genesis3D ANIMATED LIGHT-STYLE strings, applied via geWorld_SetLTypeTable(world, lightType, string). Range-checked 1..19 (\"LightType must be between 1 and 19\"), string truncated to 60 chars. A light table is a Quake-style per-light-type brightness-over-time animation sequence (letters a=black .. m=normal .. z=2x, cycled) -- NOT a palette or colour LUT. Light colour/position/radius come from BSP light entities via geWorld_AddLight. The verb honours the main-vs-hosemap world selector.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 10:46:38"},
{"id":100,"statement":"A .rrf is a PRECOMP'd, C-tokenized RESOURCE MANIFEST (ROC\\Parsing\\resparse.cpp), distinct from the thegame.lev line format. It declares ONLY FIVE resource kinds, each keyed by an integer id (or a name for sounds): ROC_MODEL <id> \"<path>\" (a geActorDef), ROC_BITMAP <id> \"<path>\" (a geBitmap), ROC_ALPHA_TEXTURE <id> \"<color>\" [\"<alpha>\"] (bitmap + separate alpha image), ROC_SOUND_BUFFER2D <name> \"<path>\", ROC_SOUND_BUFFER3D <name> <min> <max> \"<path>\". NO entity / light / sky / fog / spawn / path directives exist. GameSession::LoadLevel parses the .rrf FIRST (shared render+sound resources), THEN World_LoadBSP(<name>.bsp) which carries the level GEOMETRY, the LIGHT entities (geWorld_AddLight), and the ENTITY SET with keyvalues -- those entities are enqueued during BSP load and spawned through the EntClassRegistry / RegisterClass factories when LoadLevel flushes the spawn queue. So: .rrf = a numbered lookup table; .bsp = the actual level. A victim's Model: 11 resolves to the actor from ROC_MODEL 11. Resources go into the main set (ctx+0x08) or the hose-map set (ctx+0xb4) per a +0x160 selector.","confidence":"high","status":"supported","subsystem":"ROC","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 10:46:38"},

{"id":98,"statement":"Settings persist to FDNYFirefighter.cfg, an INI-style text file: [%s] section headers, `;` comments, `key = value` lines (floats as %4.2f). A 10-entry cvar registry g_cvarTable (0x004ff4c0) maps {sectionId, name, storage ptr, typeId} across 4 sections (g_cvarSectionTable @0x004ff494): VIDEO { Driver, Mode, Gamma }, SOUND { SfxVolume, MusicVolume }, INPUTSCALE { MouseSens, MouseExc }, DEBUG { ImADeveloper (= g_devMode), SkipMenus, EnableDebugLogging }. Config::Save writes it on leaving the Options menu; it is loaded at startup. Gamma is pushed live to geEngine_SetGamma; SfxVolume/MusicVolume route through GameSession::SetSfx/MusicVolume(g_session). Default resolution 640x480. CONFIRMS the earlier finding that key bindings are NOT persisted -- there is no [CONTROLS]/[KEYS] section and no binding entries in the cvar table.","confidence":"high","status":"supported","subsystem":"main","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 10:44:25"},
{"id":97,"statement":"Path is a Catmull-Rom spline with an arc-length-parameterised resample table, shared by PlayerHose (HosePathPoint), FireRescueEnt path-crawl, and truck/camera rails. Struct: +0x00 finalized byte, +0x01 building byte, +0x04 control-point array (0x20 B/record: pos.xyz, +0x0c cumulative arc length filled by Finalize, +0x10 scalar param, +0x14 aux.xyz = a SECONDARY interpolation channel -- look-dir / up / speed at that node), +0x08 count, +0x0c target count, +0x10 sample table (0x10 B/record = {x,y,z, cumArcLen}), +0x14 sample count, +0x18 f32 totalLength, +0x1c last-hit segment cache (edge detect), +0x20 closed/loop byte. Flow: Begin(nPoints, samplesPerSeg, closed) -> AddPoint(pos, aux, scalar) x N (auto-Finalize on the last) -> Finalize (cubic Hermite, wrap indices when closed). Query: Path::SamplePos(t) binary-searches by t*totalLength; Path::EvalAt(t) also arc-length-lerps the +0x14 aux channel and returns a \"segment changed\" edge flag. The wave-18 recon mis-guessed AddPoint/Finalize (0x00490d00 / 0x004905a0) as a debug-vertex batch buffer.","confidence":"high","status":"supported","subsystem":"ROC","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 04:41:30"},

{"id":93,"statement":"RESOLVES the cycle-9 \"anim-event fire site\" question: THERE IS NO PUB/SUB BROADCASTER. Every gameplay/anim \"notify\" sound is played DIRECTLY BY POINTER from the owning object's own per-frame state machine -- SoundCue::Play(this + <fixed cue offset>). MessageSink::Subscribe @0x004a12f0 (the /OPT:ICF fold) only binds a SoundCue's FMOD sample-bank key (stored at cue+0x20, resolved lazily by ROCSoundSystem::Play -> FindSample) and parks the cue in the ROCSoundSystem active-cue array for 3D/lifetime housekeeping -- it is NOT a topic registry, and no function ever hands an event literal to a dispatcher. Proof: all four axe event literals (\"AxeSwing\"/\"AxeHitWood\"/\"AxeHitOther\"/\"WoodDoorBreak\") have exactly ONE code xref each, all inside AxeSwing::OnEquip as the Subscribe arg. The axe hit sound is a COLLISION RESULT: AxeSwing::ResolveHit (0x00460b90, undefined region) runs an 8-unit sphere overlap vs breakable world entities (tag [ent+0x18]==4) and a per-entity material classifier BreakableEnt::GetMaterialFlags (0x0043e2a0) whose bitflags select WoodDoorBreak / AxeHitWood / AxeHitOther. XFormAnimMover has no keyframe-notify table so an anim-time table is ruled out. Same pattern for extinguisher/hose (spray-start/stop play embedded cues by offset, state-flag gated) and footsteps (PlayerRescueEnt+0x198 byte flag -> DoFootstep -> random cue from the +0x540 array, 100ms debounce).","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 04:25:39"},
{"id":92,"statement":"ItemAnimSeq is PURELY a 3-spline transform mover for the held tool -- 3 Path splines (position / rotation / a third channel), keyframes are fixed 0x24-byte records = 3 vec3, indexed by ordinal. THERE IS NO name / tag / flag / event field on a keyframe. So the \"playhead crosses a tagged keyframe -> publish a MessageSink event\" fire site (the cycle-9 open question) is DEFINITIVELY NOT in ItemAnimSeq or the tool classes. The tool classes are pure SUBSCRIBERS: their OnEquip calls SoundCue::Subscribe(cue, \"<EventName>\", 0, 2) (COMDAT-folded with MessageSink::Subscribe @0x004a12f0) which registers the cue into a global name-keyed sink registry SArrayPtr at *(g_gameCtx+8). The matching BROADCAST walk over *(g_gameCtx+8) -- calling each sink whose name String (sink+0x20) matches -- is the real fire site and lives in the character-anim / action-slot layer (AxeSwing action class, PlayerRescueEnt locomotion). geActor/geMotion has no native notify track so the dispatch is custom. Footsteps are the visible analogue: byte flag PlayerRescueEnt+0x198 set by the anim update -> polled in Think -> PlayerRescueEnt::DoFootstep (0x0044ea90).","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 04:17:26"},
{"id":91,"statement":"The five carried tools derive from ItemAnimSeq/Tool (base vtable 0x004e2790, ctor Tool::Construct 0x0045f7e0). Base vtable slot map: +0x08 OnEquip(owner) [builds the HUD/FX \"view\"], +0x0c GetSelectBindName, +0x10 GetToolName, +0x14/+0x18/+0x1c OnActionPress/Hold/Release, +0x20 Tick, +0x24 Tool::PostTick (advances the tool anim: if +0x158 deployed -> XFormAnimMover::Tick(this+0x15c)), +0x38 IsBusy/CanDeactivate, +0x3c Tool::SetActive(bool), +0x40 deleting dtor. Tools live in an SArray at PlayerRescueEnt+0x3564 (count +0x3568, valid indices 1..4; active-tool index at +0x357c, 0 = none). ToolNameToIndex: axe 1 (ctor 0xa94) / extinguisher 2 (0x8d0) / goggles 3 (0x600) / hose 4 (0xd54, on-demand via Verb_TouchHose). Verb_Equip news + Constructs the class, calls OnEquip, RescueHud::OnEvent(6, idx); Verb_Select / SetActiveTool (0x0044c2a0) just toggle the active index via the two SetActive calls. Bind-name getters (vtbl+0x0c/+0x10) are MOV EAX,imm32;RET stubs returning \"SELECT_AXE\"/\"axe\" etc.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 04:17:26"},
{"id":90,"statement":"FUN_00480900 (File_LoadObfuscatedU32Blob) is COPY PROTECTION, not asset loading. It resolves a path relative to the EXE's own directory, opens read-only, requires size >= 4 and a multiple of 4, reads the whole file, stores the u32 count at buf[0], and XOR-decrypts the remainder with a 400-byte repeating key at DAT_004ff948. Its ONLY caller is an undefined function at ~0x00445520 (CheckGameCD) which does OutputDebugStringA(\"Don't blame Mekada\"), loads \"texture.dat\", checks two payload bytes ('V', '.'), and returns a 2-bit-masked bool -- a disc/CD presence check. \"texture.dat\" is a mis-named protection token file, not a texture.","confidence":"high","status":"supported","subsystem":"main","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 04:02:00"},
{"id":89,"statement":"The end-of-mission debrief has NO medal / grade / rating system. PlayerStats is an AVL tree keyed by stat name (node: +0x00 balance, +0x04 L, +0x08 R, payload from +0x0c, inline name key +0x2c; payload: +0x10 type, +0x14 updateRule/\"betterIf\" 0 overwrite / 1 keep-min / 2 keep-max, +0x1c label String, +0x20 displayIndex, +0x24 value, +0x28 idealValue). PlayerStats::BuildStatSheetText (0x00487440) walks the tree in-order, reorders by displayIndex, and emits one PlayerStats::FormatStatRow per node (\"<label>:\" padded to column 0x20, value, + \" / <ideal>\" when idealValue != 0), injecting blank lines at the separator thresholds recorded by AddSeparatorRow. Time stats format via Str_FormatTimeHMS, integers via Str_FormatIntGrouped (comma thousands). \"betterIf\" is consumed ONLY as the SubmitStat keep-min/keep-max rule, never as a score. MenuScreen_LevelResults::Construct animates a count-up tally (\"MenuCountBeep\" / \"Explodesmall\" SoundCues) but the number shown is the raw stat value.","confidence":"high","status":"supported","subsystem":"basic","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 04:02:00"},
{"id":88,"statement":"The RescueBot / victim REACHABILITY probe (VictimRescueEnt.cpp, calling into the basic\\ primitive kit): VictimRescueEnt::CanReachOffset (0x0045ab40) accepts an offset from the victim anchor iff -- len^2 >= 0.001; within (leash radius +0x224)^2 of home +0x218; ROCRender::TraceToFloor along the offset is clear; the offset is not inside any obstacle sphere in the list at +0x1c4 (stride 0x10: centre +0x14, radius^2 +0x20); and two +-15u lateral probes both land on ground within 6u of expected height (World::TraceGroundHeight). VictimRescueEnt::BuildObstacleList (0x0045c4d0) walks world entities, keeps type tag == 6, reads a bounding radius (clamp 24..1200), and for those within radius + leash pushes an INFLATED bounding sphere { centre, (radius+48)^2 } (cap 10). So obstacle avoidance = \"is this point inside an inflated bounding sphere of a nearby class-6 volume\".","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 04:02:00"},
{"id":87,"statement":"Player/hose collision uses the ENGINE, not custom code. The \"player capsule vs world\" test is Genesis3D geWorld_Collision (contents mask 1, collide flags 2), wrapped by World::TraceGroundHeight (0x0048ff30) for the vertical ground probe -- only the impact Y is read back; normal/fraction/hit-entity/surface-flags are not exercised in the rescue code. ModelEntity::DepenetrateFromWorld and ROCRender::TraceToFloor (a 7-arg LOS/walk trace) are the other entry points. The 0x00483xxx range is only a GENERIC primitive kit (sphere/sphere, swept segment/sphere, ray/sphere, segment/AABB slab, Vec3 helpers, Float_ApproxEqualUlp) -- it belongs under basic\\, and is shared by rescue\\ and hose\\. PlayerRescueEnt::UpdateCheckpoint (0x00441e90) is a trivial 3-float store that tests nothing (a decompiler mis-binding).","confidence":"high","status":"supported","subsystem":"basic","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 04:02:00"},
{"id":86,"statement":"RescueHud's widget-BUILDER layer (Construct @0x004576b0, Update @0x00458400, OnEvent @0x004571a0, Reset @0x00456f70 + the PopIcon/DirCue/TriIcon/DamagePanels/SlideSprite/HudGauge builders) was already named. The shared widget-PRIMITIVE layer underneath: Sprite (SetBitmap @0x0047ef60 stores a bitmap id at +0x108, visible flag +0x10, rect-anim flag +0x101; SetColorRGB, GetClippedScreenRect vs g_screenViewport); FloatTrack (keyframed rect animator: parallel time[]+rect[4][] SArrays, InsertKey to add, EvalRect @0x00484940 to sample with lerp + end-clamp); SlideSprite = Sprite+FloatTrack; HudAnimQuad (multi-frame quad, PlayFrom @0x0047d300 sets a 2-frame range); RichTextLabel (SetTextLayout @0x0048c2a0 stores geometry +0xd0..+0xe4 and splits on \\\\n into a per-line String array); HudGauge (the O2 bar); ScreenFade (the +0x824 win/lose fade-wipe Sprite: Construct/Start(animId 0x47 win / 0x48 lose)/IsActive @0x0048d390/180/1a0).","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 03:46:44"},
{"id":85,"statement":"The .rb save-file schema is confirmed end to end: root -> Player{ Name:string, LevelIndex:int, DifficultyLevel:byte, Score:{ LevelName:string, stats:{ stat{ name, value, idealValue, internalName, updateRule, betterIf, displayIndex } ... } } }. Reader entry = TPlayerInfo::LoadFromFile (0x00424190): Win32File(open, read) -> RichBinaryReader_Stream::Open -> while IterateNode() { name==\"Player\" ? ReadObject(this) : SeekToNode() } -> RichBinaryVerifier::CheckBalance. Writer entry = TPlayerInfo::Save (0x0041a350), the mirror. PlayerStats is serialized INSIDE the .rb under Score/stats and is also registered as a reusable RichBinary custom-type handler, so the same node-walk (not a separate .rrf parser) reads it. Nothing at these sites points at .rrf/.srf sharing this reader.","confidence":"high","status":"supported","subsystem":"main","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 03:46:44"},

{"id":82,"statement":"Music has no separate stream manager -- it is an ordinary TSoundSample under Data\\snd\\music\\ (the only sound path literal in the binary), streaming only if its name ends .mp3. GameSession owns two slots: +0x690 game/level music (backing TSoundSample* @+0x694, re-allocated per level) and +0x698 menu music (embedded, name @+0x6ac). GameSession::SetAudioState(state) is a 7-state music/mute machine: 0 enter menu (pause game music, unpause menu, mute cats 1&2); 1 resume gameplay; 2 start level (load Data\\snd\\music\\<name> -> +0x694, play looped, ResumeAllChannels, unmute, SetSfxVolume, FlushDeferredPlays); 3 leave level (stop+free game music, StopAllChannels); 4 enter interior (set muffled flag +0x6a8, cat 2 x0.3); 5 exit interior; 6 start menu music. SetMusicVolume pauses/unpauses the active slot as volume crosses 0.1. Menu music is wired in MenuManager::Init via g_musicManager.","confidence":"high","status":"supported","subsystem":"sound","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 01:56:25"},
{"id":81,"statement":"SoundCue (0x24 bytes; its first dword IS the SoundWrap = an FMOD channel number). +0x04 per-cue volume 0..1, +0x10 float* emitter world position (NULL => 2D), +0x14 category/owner-type id, +0x18 play mode (0 one-shot / 1 loop-or-start-if-idle / 2 loop + 3D listener-relative), +0x1c is-3D flag (copied from TSoundSample+0x09), +0x20 name String. SoundCue::Play(mode) -> ROCSoundSystem::Play: FindSample by name (miss -> \"ERROR: Sound Play() failed on sound\"), copy the 3D byte, TSoundSample::Play started PAUSED, set volume + 3D attrs + optional random seek, then Unpause. Final channel volume = perCueVolume * categoryVolume, x255 into FSOUND_SetVolume. 4 category buses: SetSfxVolume drives cats 0/1/2 (cat 1 x0.3 when the interior/muffled flag GameSession+0x6a8 is set); cat 3 is untouched by the sfx/music setters -- the likely voice/RadioChatter bus. Mode-2 3D sounds are projected a clamped distance out along the listener forward axis (\"fixed-bearing\" distant sirens).","confidence":"high","status":"supported","subsystem":"sound","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 01:56:25"},
{"id":80,"statement":"Audio = FMOD 3.x behind a wrapper: ROCSoundSystem (0x98 bytes, at *(g_gameCtx+8) == session+0x3b0) owns a name->TSoundSample dict (+0x08), an active-SoundCue SArrayPtr (+0x00/+0x04), 4 category-volume floats (+0x18) with a mute backup (+0x28), a deferred-play list (+0x3c, used during level load), and a listener/camera-follow helper (+0x54) whose world pos lands in +0x7c..+0x84. FMOD init is LAZY -- there is no ROCSoundSystem::Init; the first ROCSoundSystem::LoadSound calls TSoundEngine::Open -> FSOUND_SetHWND(GetForegroundWindow()) + FSOUND_Init(mixrate,512,0). The sample bank is parsed from data\\resdefs\\sound.rrf (and menu.rrf) by ROCResourceParser::ParseSoundBuffer: `SoundBuffer \"name\" [min max] = \"file\"`. Per frame GameSession::TickSubsystems -> ROCSoundSystem::Frame updates the 3D listener (velocity always 0), repositions every 3D cue, then FSOUND_3D_Update. A sample streams (FSOUND_Stream_*) iff its filename ends .mp3, else it is a static (optionally looped) sample.","confidence":"high","status":"supported","subsystem":"sound","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 01:56:25"},
{"id":79,"statement":"GenErr (main\\GenErr-Everblaze.cpp) is the assert/log mechanism. EVERY failed assert in the binary builds a GenErr record and lands in GenErr::Dispatch @0x00422060 (Ghidra shows this stuck as \"SArray::OobFail\" from a prior mislabel; rename_symbol cannot re-target a Namespace::Name). GenErr object: +0x00 vtable, +0x04 file ptr, +0x08 line, +0x0c committed-guard byte, +0x10 ostream pipeline ptr, +0x1c embedded ostringstream. Dispatch record = 6 dwords: [0] severity (1 fatal / 2 console), [1] msg, [2] file, [3] line, [5] to-console flag. Fatal -> optional log-to-file (\"FATAL ERROR <file>: <msg>\" + \"[file#line]\") + MessageBoxA + abort/int3 or MainWindow::ShutdownDriverOnly; severity 2 -> Console::Print. GenErr::Commit (0x00401360) copies <=0x400 chars of the accumulated stream, maps its param 1..5 to severity/console flags, calls Dispatch.","confidence":"high","status":"supported","subsystem":"main","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 01:51:09"},
{"id":78,"statement":"RichBinary is BluelAPI's named-node tree format (root -> child nodes; backs .rb save files and .rrf/.srf resource defs). Field-type enum: 1 CUSTOM, 2 BOOL, 3 BYTE, 4 UBYTE, 5 SHORT, 6 USHORT, 7 INT, 8 UINT, 9 FLOAT, 10 DOUBLE, 11 STRING, 12 CONTAINER; tag stored at RBField+0x08, and 0xC (CONTAINER) locks the tag. RBField (in-memory node/variant): +0x04 String name, +0x08 typeTag, +0x0c parent, +0x14 SArrayPtr children (for CONTAINER; overlaps the scalar value slot at +0x18 for non-containers), +0x24 refcounted \"custom\" blob ptr. The field-array container is copy-on-write (SArrayRB::DetachCOW @0x0048ad20). ByteStream vtable: +0x04 Write, +0x08 Read, +0x10 Tell, +0x1c GetSize; Win32File adds path String @+0x08, mode DWORD @+0x0c, HANDLE @+0x10, size @+0x14, pos @+0x18. NameTree is a name-keyed balanced BST at NameTree+0x08 (node-pool base +0x04, root offset +0x14, case-fold flag +0x18; node: +0x04 left, +0x08 right, +0x0c value, +0x10 inline key).","confidence":"high","status":"supported","subsystem":"BluelAPI","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 01:51:09"},
{"id":77,"statement":"String is a 1-pointer COW HANDLE (no rope, no SSO). The object = { RatStr* rep; }. RatStr block: +0x00 int refCount, +0x04 int length (excl NUL), +0x08 uint bufSize (always n|0x0f; data region bufSize+4), +0x0c char data[]. Empty = the shared singleton g_emptyString (0x00501908, refCount seeded 2). Copy = shallow + ++refCount; release = --refCount then FreeRep at <1; every mutator calls String::Detach when refCount>1 (fresh malloc, refCount=1). So every non-empty String value is heap-allocated. The 5-store inline init of g_emptyString guarded by DAT_00501918 is a reliable \"a String local is constructed here\" marker. Scan helpers: String::ScanInt (0x0040cd50, \"%i\"/\"%x\"), ScanUInt (0x0040ccd0), ScanFloat (0x0040cc50), ScanBool (0x0040cfc0).","confidence":"high","status":"supported","subsystem":"BluelAPI","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 01:51:09"},
{"id":76,"statement":"The RescueBot has NO PATHFINDING and NO physical movement -- it is a pure timer abstraction at GameLevel+0x340C. No nav mesh, no waypoint graph, no PathPoint follow, no bot entity, no position update, no unstick. RescueBot::Think: if it holds a currentVictim and its dropoffTimer elapsed -> UpdateZonesAndWin + log \"Victim dropped off\" + clear (that 4-8s wall-clock wait IS the entire \"carry the victim out\"); else when attemptTimer elapses and the in-progress count is under cap -> TryStartRescue. TryStartRescue (0x00455230): iterate the player child-entity list, take the FIRST victim that is state 4/7 AND has norescuebot unset (+0x1fd==0) AND has clear LOS AND is >= 600 units away (near victims left for the player) -- not nearest, not lowest-O2. BeginRescue (0x00454750): set currentVictim, ++in-progress, dropoffTimer = now + 4000 + rand(0..4000), VictimRescueEnt::OnBotRescueBegin sets victim+0x120 = 6 (it fades out via the flicker timer and drops from every list). The rescue is credited by omission when the timer expires. Activated by the `runrescuebot` verb or (dev) the DBG_ACTIVATE_RESCUEBOT key.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 01:40:12"},
{"id":75,"statement":"Pickup/carry/deliver: VictimRescueEnt::TestPlayerPickupProximity (primary vtbl +0x48) runs each frame -- player AABB vs victim pos inflated by pickup radius (victim-def +0x1c, clamped >= 60u). On overlap it sends message 0x7532 to the player. NO KEY PRESS, NO FACING CHECK -- automatic on contact. PlayerRescueEnt::BeginCarrySurvivor (0x00450440) stores player+0x3534 = victim, flips victim to state 5, BroadcastCarryState(1) (camera-rig + exits), timestamps player+0x5c4 for the Rescue Time stat. THE CARRY IS ABSTRACT: the victim is not reparented to a bone/offset -- it is frozen where picked up, invisible to zone/claim logic, until delivery. NO carry penalty: UpdateO2 drains a flat 0.05/3000ms regardless of carrying, and the Think speed caps are state-based only. Deliver = `escape` verb -> DeliverCarriedSurvivor: +0x352c += 1, PlayerStats \"Rescues\" +1 + rescue time, WarpToRescuerAndFade (state 6, teleport ~120u ahead of rescuer, fire \"rescue\"), UpdateZonesAndWin. Die while carrying -> DropAtPlayer (state 4, no credit).","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 01:40:12"},
{"id":74,"statement":"VictimRescueEnt (RCS_VictimRescue, kind 2, size 0x22c) is a 4-state FSM on entity+0x120 driven by VictimRescueEnt::Think (0x0045bea0 via ScriptActor::Tick(entity+0xd4)): 4 = idle/unvalidated/dropped (random idle anim, pickable -- the DEFAULT; a victim leaves state 4 only if a script issues `roam`); 5 = player-carried (Think returns immediately, entity FROZEN where picked up, fires \"pickup\"); 6 = bot-claimed OR delivered-to-safety (UpdateFadeFlicker blinks it out over ~30 frames, excluded from every list); 7 = validated/roaming (UpdateRoamMovement: free wander within leash radius +0x224 of the spawn point, obstacle-aware). There is NO dead / knocked-out / panic state. Victims have NO fire response AT ALL -- nothing ever writes victim+0x128 (burn) and the message handler is a no-op stub; victims cannot be incapacitated or killed by fire in this build. \"herodown\" downed-firefighter victims run the identical FSM (only anim-set id +0x180==6 differs). Spawn: RegisterSpawnSpot appends {x,y,z,angle} to a flat pool; RCS_VictimAltSpot markers add spots; SpawnAtSpot picks a UNIFORM RANDOM spot with no reachability check.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 01:40:12"},
{"id":73,"statement":"The first-person <-> cinematic view switch is a Camera \"enabled\" byte, not a script verb. ROCRender::RenderFrame walks the RenderManager render-instance list; a Camera renders iff Camera::ShouldRender (@0x00491cf0) returns alive(+0x64) && enabled(+0x08). First-person = EntityCam at PlayerRescueEnt+0x3460; cinematic = the EntityCam embedded in CamRescueEnt+0x24. geEngine_RenderWorld renders from whichever camera instance is alive && enabled -- normal play has exactly one. So the switch is toggling Camera+0x08. Camera::SetActive @0x004953f0 (only caller CamRescueEnt::Init) sets a secondary fullscreen byte +0x44. NOT byte-pinned: the exact runtime site that flips Camera+0x08 on the cinematic cam -- there is no camera script verb and CamRescueEnt has no custom message handler, so it arrives via the generic `tell <camname> <cmd>` / SendMsg path or a mission-sequence step. Both cameras follow PlayerRescueEnt+0x34a4 (an XFormAnimMover republishing a smoothed first-person pose; also followed by the carried tools).","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 01:40:12"},
{"id":72,"statement":"Input is GameControls (g_gameCtx+0x00, 0x368 bytes, main\\IO\\GameControls.cpp), a multiple-inheritance object. Gameplay talks only to the ActionMap sub-object at +0x334. Layers: +0x00 vtable = steering axis source (GetSteerAxis(idx) = -(rawAnalog(idx) * g_mouseLookSensitivity @0x004ff480)); +0x08 vtable = DirectInputProvider facade (IsHeld / WasPressed edge / WasReleased / GetAnalog keyed by an int input code; Poll reads kbd+mouse via buffered GetDeviceData); +0x10 / +0x328 = two DirectInput8 device wrappers (SysKeyboard + c_dfDIKeyboard; SysMouse + c_dfDIMouse2 buffered 10). NO joystick enumeration anywhere. Input codes: 1..0xFF DIK, 0x101 ANY_KEY, 0x102 ANY_MOUSE_BUTTON, 0x103/4/5 mouse L/M/R; analog 0/1/2 = mouse dX/dY/wheel. The ~30 named actions (SELECT_AXE/EXT/GOGGLES/HOSE, MOVE_FORWARD/BACKWARD/LEFT/RIGHT, ACTION, USE, JUMP, CROUCH, STEER_YAW/PITCH, MOUSE_*, plus DBG_* on F2-F11 dev-only) are registered with hard-coded default bindings in GameControls::Construct. THERE IS NO REBIND PATH -- no config/registry/.cfg is read (the Construct 2nd arg is dead), and the Options menu has no controls screen. Tool select works via the tool advertising its own bind-name.","confidence":"high","status":"supported","subsystem":"main","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-29 01:40:12"},
{"id":71,"statement":"RescueHud (RescueHud::Update @0x00458400) is a flat widget bag on a 640x480 screen: a per-frame draw list (+0x2880) of Sprites and an update list (+0x2898) of RichTextLabels/HudAnimQuads. Key widgets: +0x24 status/objective text (from PlayerRescueEnt::BuildStatusText), +0x6d8 transient mission banner (ShowMissionText), +0x28d0 air/O2 bar (a shared HudGauge widget, fed a SMOOTHED O2 that lerps 25%/frame toward ent+0x3450; visible only when O2<=0.99), +0x29f0 low-O2 red flash (<0.25), +0x10bc burn vignette Panel group (fed ent+0x3538), compass backing/needle +0x964/+0xa94 (needle visible when ent+0x3440 != 0), TriIcon/DirCue/PopIcon objective markers (ent+0x352c), 4 edge damage-hit sprites, +0x277c hose GPM readout. There is NO objective LIST widget -- the single status line + the radio narration carry objective state. The HudGauge widget (0x00482400/430/480/4b0) is shared with the Tool_Extinguisher/Hose charge gauges.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 23:33:47"},
{"id":70,"statement":"The particle system has 3 classes (0x0047d000-0x00480600): ParticlePool (ctor 0x00480260, vtable 0x4e354c -- SArray of particles + RenderManager hookup) <- ParticleSystem (ctor 0x004804f0, 0x84 bytes, adds the emitter param block +0x34..+0x80); and separately ParticleNode (ctor 0x0047d370, scene node + colour/alpha ramp) <- ParticleEmitter (ctor 0x0047f850, 0x168 bytes = the individual particle: pos +0x5c, vel +0x7c, accel +0x88, damping +0x94, alive byte +0x30, GE_LVertex quad buffer +0xd8). Particles draw as engine polys (geWorld_AddPolyOnce), BSP-culled (geWorld_GetLeaf/MightSeeLeaf). Per-frame update = the RenderManager calling ParticlePool vtbl slot 1 (TickAndRenderParticles @0x0047fea0) which both integrates (semi-implicit Euler + per-axis damping) and draws each particle. There is NO separate TickSubsystems path and NO decal pool -- \"decals\" (foam/scorch/wet marks) are ONE persistent ParticleNode per tool repositioned onto the collision hit surface each frame. Direct spawners bypassing ParticleSystem::Emit: HoseGfx::RebuildGeometry (water spray on stream collision), Fire::EmitEmbers (rising sparks), and a fire/smoke sub-emitter ~0x00462311. flags&8 on a particle = one-shot (freed on ramp wrap).","confidence":"high","status":"supported","subsystem":"basic","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 23:33:47"},
{"id":69,"statement":"The hose-mini-game douse mechanic is a FIXED TIMED SCHEDULE, not skill-based (medium-high conf). PlayerHose::Think_AtHotspot calls Hotspot::AdvanceActiveFire unconditionally every frame; it round-robins the hotspot child RCS_WindowFire list, each step -> WindowFire::BeginDouse (its ONLY caller) -> WindowFire::Think counts that fire down by g_frameDeltaTime / block+0x08 sec; index wrap decrements Hotspot+0x20 (passes remaining; IsCleared <=> <=1). So a hotspot always extinguishes after (#fires x passes) steps regardless of input. The player only has to survive the per-hotspot countdown this+0x1A7C (budget this+0x1A84 = HosePathPoint.def+0x28 sec x difficulty mult {1.8 easy, 1.3, 1.0 hard} keyed on *(session+0x6e4)+0x2c). Timer<0 -> PlayerHose::LoseLevel (entity+0x198=2); last hotspot (next==0) cleared -> PlayerHose::WinLevel (entity+0x198=1). Aiming (STEER_PITCH/YAW) + MOUSE_LB drive ONLY the HoseGfx visible stream, splash particles, spray-loop sound and the \"spraylr\" anim -- HoseGfx::RebuildGeometry traces the stream vs world but the impact point feeds splash VFX only, not douse progress. The hose result lives on the entity at +0x198 (NOT session+0x6ec which is the PlayerRescueEnt path); RCS_DouseHose polls owner+0x198 for the win/lose banner (HudAnimQuad anim 0x47/0x48) + GameSession::SetAudioState. Progress HUD = standard objectives panel fed by per-hotspot \"Hotspot N\" PlayerStats (RegisterStat on arrive, SubmitStat on clear).","confidence":"high","status":"supported","subsystem":"hose","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 23:31:10"},
{"id":68,"statement":"The on-rails hose mini-game (RCS_PlayerHose, hose\\PlayerHoseEnt.cpp, entity 0x1a88, base ModelEntity, embedded ScriptActor \"Player\" at +0x140) was already substantially labeled by an earlier cycle. Boot: `loadhosemap` world verb -> GameSession::RequestLevelChange(...,\"data\\resdefs\\hose.rrf\"). State machine on this+0x18C: 3 Think_Advance (truck auto-drives a closed-loop Catmull spline at a constant 500 u/s, freezing at each hotspot anchor), 5 Think_PrimeStream (wait for HoseGfx to prime), 4 Think_AtHotspot (the douse fight), 6 GameOver. CamHoseEnt (RCS_CamHose) is the active chase view; it is spawned by PlayerHose::OnSpawn along with RCS_DouseHose (HoseDouseFX). Map exit is the generic `tell player finalexit[loadmap]` path -- the hose code never triggers the transition.","confidence":"high","status":"supported","subsystem":"hose","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 23:31:10"},
{"id":67,"statement":"ROC entity handles are {slot, generation} pairs. EntityHandleTable (GameCtx+0x10): a running generation counter, a record array (each record 0xc: slot/gen/entity-ptr), a freelist, an SArray of weak-refs. EntityHandleTable::Deref returns the entity ptr only if the stored generation still matches -> stale handles resolve to null. roc_ResolveEntityHandle wraps this; EntityHandleTable::Free releases a slot and zeroes entity+0x08. GameCtx (0x40, global g_gameCtx): +0x00 GameControls*, +0x04 ROCRender*, +0x10 EntityHandleTable*, +0x14 entity-class registry, +0x1c ROCMessageMapper*, +0x24 spawn factory (roc_SpawnEntity calls its vtbl[1]). ROCMessageMapper (mmap.cpp, GameCtx+0x1c): a 0x40-entry table (stride 0x14: msgId/p2/p3/ctx/active) mapping a game message id to a handler; script message tables register via ScriptMsgTable::AddHandler with class base 0x7530 (so fire-touch 0x7531 etc.). NOTE: ROCMessageMapper::Construct @0x0042b1f0 builds a DIFFERENT object (a deferred-message queue with a FrameThrottle) -- likely mislabeled.","confidence":"high","status":"supported","subsystem":"ROC","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 23:15:36"},
{"id":66,"statement":"ROC entity class hierarchy: Entity (root, vtbl 0x004e4288, ~0x24) <- WorldEntity (0x004e4338, adds embedded xform sub-object at +0x24 with secondary vptr 0x004dfc30, world position vec3 at +0x4c, collision AABB cache +0x68, frame displacement +0x90, WorldEntityBinder* at +0xd0) <- ModelEntity (0x004e43f0, adds physics: +0xf0 prev vel, +0xfc vel, +0x108 ground plane, +0x114 accel, +0x120 push/slide, +0x12c/+0x12d grounded now/last). ROCWorldEntity (0x004e4458, geWorld wrapper, size 0x30) is a SEPARATE branch off Entity. Entity fields: +0x04 handle slot, +0x08 handle generation (0=unregistered), +0x0c world ctx, +0x14 flags (init 0xffeb), +0x18 KIND TAG (1 player/2 victim/5 camera/6 fire/8 final-exit). The per-frame Think/draw dispatch is NOT on the 0x004e42xx vtables -- it runs from ROCRender::RenderFrame over TWorldResources.worldList via a renderable interface (slot4 think / slot0xc cull / slot0x10 draw / slot2 pending-add). \"Entity::IntegrateVelocity\" @0x0049dbc0 is actually ModelEntity's last vtable slot; \"ModelEntity::GetCollisionBlock\" @0x0049d790 is actually WorldEntity's slot 3.","confidence":"high","status":"supported","subsystem":"ROC","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 23:15:36"},
{"id":65,"statement":"PlayerStats (basic\\PlayerStats.cpp, size 0x24, vtable 0x004e3814) is a case-insensitive string-keyed BST of stat nodes, NOT a fixed struct. Schema is CODE-registered by TPlayerInfo::ResetRunStatsSchema (13 keys). Stat node: +0x10 type (0 int / 1 time mm:ss / 2 volume), +0x14 submit rule (SubmitStat: 0 overwrite / 1 keep-min / 2 keep-max), +0x18 merge rule (MergeFrom: 0 min / 1 max / 2 overwrite), +0x1c name String, +0x20 displayIndex, +0x24 value (AddStat +=), +0x28 secondary counter (IncStat ++). Gameplay mutates session+0x6e4->+0x30 (live run) via AddStat/IncStat/SubmitStat/SetStat. On win, RecordLevelComplete MergeFroms the run map into the per-level TLevelScore+0x08 (best-ever), marks it dirty, advances furthest-unlocked, and Saves.","confidence":"high","status":"supported","subsystem":"basic","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 23:12:22"},
{"id":64,"statement":"LevelManager (SArrayPtr<TLevelInfo*> @session+0x6ac) builds the campaign list from the PLAIN-TEXT directive file data\\resdefs\\thegame.lev (NOT a .rrf) at GameSession::Init. TLevelInfo (0x28): +0x00 level id = <id>.bsp world-file base (GameSession::LoadLevel does String(+0x00)+\".bsp\"), +0x04 title, +0x08 \"data\\resdefs\\<name>\" per-level ROC resource-def (the rrf), +0x0c music, +0x10 par time in SECONDS (directive is minutes, x60; default 1200), +0x14 playable flag, +0x18 sequential level index (FindByIndex key), +0x20/+0x24 campaign-map pin coords, +0x1c unidentified (-1). There is NO per-level difficulty-scale field -- the earlier \"idx 0/1 x1.5, idx 2 x1.0\" note is unconfirmed. Level unlock gating is menu-side: compare a level index against TPlayerInfo+0x04.","confidence":"high","status":"supported","subsystem":"main","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 23:12:22"},
{"id":63,"statement":"Campaign save/load: PlayerManager (SArrayPtr<TPlayerInfo*> @session+0x6cc) has 6 FIXED slots saved as saves\\playerN.rb (BluelAPI RichBinary node tree, root \"root\" -> \"Player\"). LoadAllProfiles chdir's to <cwd>\\Saves\\ ; a missing slot file spawns a default profile (6 colour-coded default names) and immediately Saves it. SelectSlot copies only the POINTER into the active-profile slot (session+0x6e4). TPlayerInfo (0x54, vtable 0x004df3b4): +0x04 furthest level index (serialized \"LevelIndex\", advanced by RecordLevelComplete), +0x08 last level played (not serialized), +0x0c Name String, +0x10 save path, +0x14 SArrayPtr<TLevelScore*>, +0x2c difficulty byte (serialized \"DifficultyLevel\", init 1), +0x30 live-run PlayerStats. TLevelScore (0x34, vtable 0x004df380): +0x08 PlayerStats best-for-this-level, +0x2c LevelName String, +0x30 dirty flag (only dirty records are written).","confidence":"high","status":"supported","subsystem":"main","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 23:12:22"},
{"id":62,"statement":"RadioChatter (basic\\RadioChatter.cpp) is the game's primary objective/status narration channel (no HUD text exists). A cue name maps to a TChatterSet whose clips are sound-bank entries \"<cue>0\",\"<cue>1\",... enumerated at load (TChatterSet::Build \"%s%i\" until ROCSoundSystem::SoundExists fails). RadioChatter::Play(cue, immediate) is the sole entry (15 sites): FindSet then PlayNext (sequential) or PlayRandom (RNG + single-step anti-repeat). NO priority, NO interrupt arbitration, NO global cooldown -- lines just stack. Two instances: PlayerRescueEnt+0x3540, PlayerHose+0x208, both from the same 13-name roster. BUG: \"RC_HoseTimeWarn\" (HoseDouseFX warn timer) is not in that roster so FindSet returns null -> silent no-op. The \"?\"/\"@\" bytes before some RC_ strings in a raw dump are adjacent float constants, not priority markers.","confidence":"high","status":"supported","subsystem":"sound","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 22:59:28"},
{"id":61,"statement":"RCS_CamRescue and RCS_CamHose are ordinary ROC entities (entity-kind +0x18==5), NOT script-verb driven -- there is no camon/cutto/camlookat/campath verb anywhere (verified against all 60 ScriptTrigger::Verb_* and all ~21 PlayerRescueEnt::OnScriptCommand verbs). Each is AUTO-SPAWNED by its owning player entity: PlayerRescueEnt::Init spawns RCS_CamRescue, PlayerHose::OnSpawn spawns RCS_CamHose. CamHoseEnt is the on-rails chase camera (follows a named target at fixed standoff ~200u + vertical ~100u). CamRescueEnt has no bespoke motion -- its FrameUpdate only runs Camera::UpdateShake + Camera::UpdateTimedMove (a scripted 2-point lerp over a duration with fog/far-clip animated). Both hold a pointer to PlayerRescueEnt+0x34a4, a GameControls-derived \"view-director\"; the switch of the RENDERED view to an EntityCam is presumably a mode on that director object (not pinned). The only scripted interaction is generic `tell <camname> <cmd>`.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 22:59:28"},
{"id":60,"statement":"A MapZone is a NAMED SET of BoundsTrigger AABBs, not a brush/BSP/single-AABB. MapZoneSet is an arena-backed case-insensitive string-keyed balanced BST (node = nameLen+0x48 bytes: {balance @0, left @4, right @8} then MapZone payload @+0x0c then inline name @+0x44; child links are arena-relative offsets rebased through set+0x04). MapZone payload: +0x00 String zoneName, +0x04 summed member-box volume (overlap tiebreak, smallest wins), +0x08 member-BoundsTrigger SArrayPtr, +0x0c member count, +0x20 occupant SArrayPtr (rebuilt each frame), +0x24 occupant count. The manager is PlayerRescueEnt+0x5d8. Membership built at load by BoundsTrigger::MakeZone -> AddTriggerToNamedZone. Occupants = VICTIMS ONLY (RebuildZoneOccupants filters ent[6]==2, state not 5/6); fire entities are never zone members. MapZoneTracker keeps current+previous snapshots of {zone,entity} pairs; producers Add/Remove, consumers GetNthEntered/GetNthLeft, CommitFrame flips current->previous -- this is the enter/leave diff behind BoundsTrigger::DispatchTouchEvents / PathPointEnt::Think / TE_BModel::UpdateMapZones.","confidence":"high","status":"supported","subsystem":"basic","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 22:56:24"},
{"id":59,"statement":"ActorAnimator / AnimSeqPlayer (basic\\ActorAnimator.cpp, ~0x50-byte value embedded in an entity, e.g. VictimRescueEnt) is a thin time-derived wrapper over geActor_SetPose -- NO per-frame clock, NO blending, NO event track. ApplyPose (0x00480d50) each frame: t = ((now - startMs +0x28) % periodMs +0x2c) * rate +0x24 * 0.001 + startExtent +0x1c, then geActor_SetPose(actor, &xform, t). PlayMotionLooped/PlayRandom (0x00480ea0) is the only play entry: looks the motion up BY INDEX (name->index resolution is in the caller, via the wielder+0x34a4 anim tables), stamps +0x14..+0x2c and +0x28=now, +0x30=1. Stop clears +0x30 -> ApplyPose calls geActor_ClearPose. Fields +0x34/+0x38(-1)/+0x3c/+0x40/+0x44(1.0)/+0x48/+0x4c are init but never read -- a removed/stubbed blend path. The separate XFormAnimMover class (0x00483720/a20/b00) is the tool \"+0x15c deploy anim\" easing mover, unrelated.","confidence":"high","status":"supported","subsystem":"basic","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 22:56:24"},
{"id":58,"statement":"The designer-placed sharedents level entities all share one registrar mechanism (EntClassRegistrar::BaseConstruct + SetNameAndPriority(\"RCS_<name>\",100)) and a common entity vtable slot map: [0] scalar-deleting dtor, [5] Think (usually an adjustor thunk ADD ECX,subobjOff; JMP ScriptActor::Tick), [6] GetTransform, [8] Spawn, [18] per-frame visit/Render. RCS_BoundsTrigger = the level-trigger volume (embeds a ScriptTrigger at ent+0x24, fires touch/touching/untouch on any entity via DispatchTouchEvents, non-latching). RCS_MiscEmitter = ambient particles/sound, keyvalue TYPE 1..6 selects one of 4 impl classes at ent+0x78 (types 5/6 = sound), distance^2+PVS culled, verbs turnon/turnoff/setstrength/setsize/setrot/setpitch. RCS_BlinkLight = a scripted dynamic light whose blink pattern IS its own script (wait-loop toggling SetLightParams), not C++. RCS_PathPoint = a path node that is also a proximity trigger (DispatchTouchEvents on its own zone). RCS_PropModel is implemented by ScriptedBModelEnt = a placed mesh prop with optional rotation, optional `use` interaction, and a full touch/use script.","confidence":"high","status":"supported","subsystem":"sharedents","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 18:27:51"},
{"id":57,"statement":"The three per-class verb overrides that chain to ScriptTrigger::HandleVerb are ScriptedBModelEnt::ExecCommand (0x0043e680, adds loop/open/close/settime/addtimecmd -- a scripted timed mover/breakable), PropModelEnt::ExecCommand (0x004444b0, adds setscale/show/hide/makevalve/setmotion -- a scripted prop that can become a use-activated valve objective), VictimRescueEnt::ExecCommand (0x0045cdb0, adds playanim/forcespawnspot/roam/norescuebot). NONE of them is a player-entry volume. The genuine trigger volume is BoundsTriggerEnt / RCS_BoundsTrigger; its per-frame BoundsTrigger::DispatchTouchEvents (0x00470840) pulls entered/inside/left entity lists from its MapZone and calls ScriptActor::FireEvent on the embedded actor with \"touch\"/\"touching\"/\"untouch\"; it re-fires on every transition (scripts use the `once` verb for fire-once). BoundsTriggerEnt does NOT override the verb table.","confidence":"high","status":"supported","subsystem":"sharedents","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 18:21:12"},
{"id":56,"statement":"Level win/lose is entirely on PlayerRescueEnt. +0x3438 = mission result (0 active / 1 win / 2 lose); FrameUpdate ticks gameplay only while it is 0; RescueHud::Update consumes it (win -> SetAudioState(3), \"RC_ResLvlWin\", score handoff FUN_004295b0; lose -> \"RC_ResLvlLose\", failure panel). WIN is set by: (a) `tell player finalexit` (Verb_FinalExit) when outstanding victims == 0; (b) UpdateZonesAndWin automatically when all victims delivered AND every final-exit BoundsTrigger volume (entity type tag +0x18==8) is clear of fire. Victim math: outstanding = +0x3528(total, counted by EndMission) - +0x3530(lost/dead, inferred) - +0x352c(delivered, bumped in DeliverCarriedSurvivor). MAP TRANSITION only via `tell player finalexitloadmap <map>` -> GameSession::RequestLevelChange(...,\"data\\resdefs\\rescue.rrf\"). LOSE (+0x3438=2) is set on the timeout/death path, not by any verb. ScriptTrigger `quit` shuts the whole game down; it is not end-level.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 18:21:12"},

{"id":54,"statement":"The level \"script VM\" is a line-oriented STRING interpreter (ScriptActor::ExecCommand, script\\scriptactor.cpp), NOT bytecode: no program counter, no goto/labels, no else. ScriptTrigger extends ScriptActor. Per-frame ScriptActor::Tick: if waiting (this+0x4c) wait until global clock DAT_00502afc >= wake-time this+0x48, else run subclass think (vtable slot 0) + pop one queued command string off this+0x30 -> ExecCommand. `wait N` is the ONLY time model (sets +0x48/+0x4c). Conditionals (if/ifnot/if</<=/>/>=/iffacing/ifclear...) take a quoted command string and execute it inline immediately via recursive ExecCommand. Verb dispatch: HandleBaseVerb (que/flush/wait/idle/cmd/loopinque/onmsg/onmsgappend/printmsgs) then ScriptTrigger::HandleVerb (a hand-written stricmp if-chain, ~40 verbs, one Verb_* worker each). Cross-actor control via `tell <actor> <cmd>` and `sendmsg <actor> <event>` (ScriptActor::FireEvent runs the actor's onmsg-bound command list). Subroutines via `exec <file>`. There is NO spawn/camera/endlevel verb in ScriptTrigger -- those are Verb_* methods on PlayerRescueEnt and other actors, reached with `tell`.","confidence":"high","status":"supported","subsystem":"script","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 18:10:01"},
{"id":53,"statement":"The carried-tool class family layout (struct Tool, size 0x1fc, subclass fields from 0x1fc): Tool_Axe (0xa94) embeds TWO AxeSwing objects at +0x200 (primary, gated by use_primary byte +0x1fc) and +0x648 (secondary, always ticked), wind-up deadline @0xa90. AxeSwing (extends Tool, size 0x448): swing_state @0x368 (0 ready / 1 swinging / 2 impact-check / 3 recoil), cooldown base+dur @0x36c/0x370, impact point vec3 @0x39c, breakables array/count @0x324/0x328, 4 SoundCues @0x3b8/0x3dc/0x400/0x424. Tool_Extinguisher: 3 SoundCues @0x1fc/0x220/0x244, 2 spray particle-systems @0x2a0/0x324, 16x0x20 per-target spray records @0x400, spraying byte @0x600, ramp angle @0x604, phase timers @0x608/0x60c, muzzle pos/dir vec3 @0x64c/0x658, HUD LabelPair @0x664, charge float @0x8c8, drain rate @0x8cc. Tool_Goggles: sprite-template SArrayPtrs @0x1fc/0x218, activation ms @0x250, tint overlay ptr @0x358 (+0x1c intensity), active byte @0x364, live Sprite* array @0x5c0 (cap @0x5c4, used @0x5d8), activate SoundCue @0x5dc; per highlight-sprite obj is operator_new(300): +0 entity ptr, +4 Sprite, +0x108 render-state (+0x1c intensity), +0x128 distance. Tool_Hose: sub-iface vtable @0x1fc (0x004e2988, thunks via this-0x1fc), 3 SoundCues @0x204/0x228/0x24c, 2 jet particle-systems @0x2a8/0x32c, spin-up deadline @0x3b0, 16x0x20 per-target records @0x408, HoseGfx line obj @0x608 (0x440), stream-state block @0xa48 (0xf0), spraying byte @0xc58, on-target byte @0xc59, ray result @0xc5c, on-target accumulator @0xc60, hydrant mode @0xc68, target cache @0xc70, deployed mirror @0xd08.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 18:05:05"},

{"id":42,"statement":"Fire extinguish loop: a Hotspot (0x30, +0x20 = fires_remaining from ROC def+0x34) owns up to 8 child RCS_WindowFire. In PlayerHose::Think_AtHotspot each frame: per-hotspot timer hose+0x69f -= dt (< 0 -> LoseLevel -> RC_HoseLvlLose); Hotspot::AdvanceActiveFire round-robins the cursor, calling WindowFire::BeginDouse (state+0xd=1, +0x258=0) + ~40% Flare on the new target; WindowFire::Think drives douseProgress +0x258 -= dt / state+0x08 (per-fire duration), <=0 clears the latch; cursor wrap -> fires_remaining--; Hotspot::IsCleared (+0x20 < 1) -> next hotspot or PlayerHose::WinLevel -> RC_HoseLvlWin. Whether dousing is gated on the reticle being on-target is unconfirmed (UpdateAimAndSpray looked cosmetic).","confidence":"medium","status":"open","subsystem":"hose","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 13:07:27"},
{"id":41,"statement":"Fail/pass-out model: (1) MISSION TIME +0x343c = base (TLevelInfo+0x10 or 600s) x difficulty (idx0/1 -> 1.5, idx2 -> 1.0), drains by dt each frame; hitting 0 sets outcome +0x3438=2 -> RC_ResLvlLose -- the ONLY true level loss. (2) O2 +0x3450 drains -0.05 per 3000ms (~60s, difficulty- and smoke-independent); 0 -> PassOut(0). (3) burn +0x3538 += dt*1.2*severity from fire msg 0x7531; >1 -> PassOut(1). PassOut -> state 6 -> ~4s fade -> Verb_Reset: respawn at the rolling checkpoint PlayerRescueEnt+0x3400 (written continuously by UpdateCheckpoint), O2 refilled, carried victim dropped -- NOT a level loss. No health/HP scalar exists. On Hard, an unforced pass-out spawns a rescuable \"herodown\" clone (cap 3), inflating the quota.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 13:07:27"},
