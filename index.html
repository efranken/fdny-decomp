{"id":42,"statement":"Fire extinguish loop: a Hotspot (0x30, +0x20 = fires_remaining from ROC def+0x34) owns up to 8 child RCS_WindowFire. In PlayerHose::Think_AtHotspot each frame: per-hotspot timer hose+0x69f -= dt (< 0 -> LoseLevel -> RC_HoseLvlLose); Hotspot::AdvanceActiveFire round-robins the cursor, calling WindowFire::BeginDouse (state+0xd=1, +0x258=0) + ~40% Flare on the new target; WindowFire::Think drives douseProgress +0x258 -= dt / state+0x08 (per-fire duration), <=0 clears the latch; cursor wrap -> fires_remaining--; Hotspot::IsCleared (+0x20 < 1) -> next hotspot or PlayerHose::WinLevel -> RC_HoseLvlWin. Whether dousing is gated on the reticle being on-target is unconfirmed (UpdateAimAndSpray looked cosmetic).","confidence":"medium","status":"open","subsystem":"hose","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 13:07:27"},
{"id":41,"statement":"Fail/pass-out model: (1) MISSION TIME +0x343c = base (TLevelInfo+0x10 or 600s) x difficulty (idx0/1 -> 1.5, idx2 -> 1.0), drains by dt each frame; hitting 0 sets outcome +0x3438=2 -> RC_ResLvlLose -- the ONLY true level loss. (2) O2 +0x3450 drains -0.05 per 3000ms (~60s, difficulty- and smoke-independent); 0 -> PassOut(0). (3) burn +0x3538 += dt*1.2*severity from fire msg 0x7531; >1 -> PassOut(1). PassOut -> state 6 -> ~4s fade -> Verb_Reset: respawn at the rolling checkpoint PlayerRescueEnt+0x3400 (written continuously by UpdateCheckpoint), O2 refilled, carried victim dropped -- NOT a level loss. No health/HP scalar exists. On Hard, an unforced pass-out spawns a rescuable \"herodown\" clone (cap 3), inflating the quota.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 13:07:27"},

{"id":39,"statement":"Animation events are game-side (Genesis3D geMotion event API is not imported). The event-name table at 0x004e18ec (FootStep1-4, ActionFailed, ThrowObject, ValveHookUp, GrabItem, PassOut_Fire, PassOut_O2, OxyRelease, Breathe, LandingImpact) is consumed by a setup routine ~0x0044d4xx-0x0044dfxx that, per name, builds a per-event object on PlayerRescueEnt (stride 0x48, e.g. +0x3c4 Breathe, +0x40c OxyRelease) and calls MessageSink::Subscribe (handler + ctx + name -> a list on *(g_gameCtx+8), the same singleton that owns SoundCues + the FMOD listener). AnimSeqPlayer::Advance (undefined code ~0x00480f00) posts the event name when motion playback crosses a keyframe; subscribed MessageSinks fire their callbacks (footstep SFX, oxygen hiss, breathing loop, landing impact).","confidence":"medium","status":"open","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 12:46:35"},
{"id":38,"statement":"A SoundWrap (= what a SoundCue is) is one playing-sound handle: +0x00 FMOD channel, +0x10 world pos*, +0x14 category id (0..3, matched by SetCategoryVolume/MuteCategory/DetachSoundWraps), +0x18 3D-mode/owner, +0x1c 3D-enable, +0x20 name String. ROCSoundSystem keeps a SoundWrap list (+0x00/+0x04), a category-volume table (+0x18), and a deferred-play queue (+0x3c). Play: FindSample (SoundSampleDict binary tree keyed by name, from sound.rrf) -> TSoundSample::Play -> FMOD channel -> wrap; then ApplyVolume + (if 3D) Update3DPosition. Per frame: Update pauses finished one-shots; UpdateListener pushes the camera transform as the FMOD 3D listener.","confidence":"high","status":"supported","subsystem":"sound","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 12:46:35"},
{"id":37,"statement":"The particle system: ParticlePool (0x30, SArrayPtr subclass) holds ParticleEmitter* (each 0x168, derives ParticleNode, MI vtables 0x004e3548 primary / 0x004e3560 IRenderable). Free slot = byte +0x30 == 0. Per frame: ParticleNode::IntegrateMotion (semi-implicit Euler pos/vel/accel + per-axis linear damping), ParticleNode::AdvanceSpawn (keyframe cursors + lifetime cull), ParticleNode::Render (geWorld_AddPolyOnce billboard, poly mode +0xb0, visibility via geWorld_GetLeaf/MightSeeLeaf). Fields: pos +0x5c, vel +0x7c, accel +0x88, damping +0x94, colour rgb +0xb4, vertex buffer +0xd8, 0.99 fade rates +0x108/+0x12c/+0x130/+0x154. HoseGfx droplets route through ParticlePool::SpawnParticle.","confidence":"high","status":"supported","subsystem":"ROC","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 12:46:35"},
{"id":36,"statement":"Entity actors are drawn by RenderInstance (derived vtable PTR_FUN_004e3bd4). The ModelEntity world transform reaches geActor NOT via geActor_Render but via geActor_SetPose's 4th arg: each frame ROCRender::RenderFrame calls each renderable's PrepareForRender (vtbl[1]) which composes the owner transform (geXForm3d_Multiply of pos FUN_00447830 + orientation FUN_0049e770) and calls RenderInstance::SetXForm -> ApplyPoseAndScale -> geActor_SetScale + geActor_SetPose(actor, motion=+0x64, time=+0x6c, &xform=+0x10). Then vtbl[4] Render calls geActor_Render(actor, world=subobj+0x78, camera=mgr+0x170). Confirms *(g_gameCtx+4) = RenderManager (via ActorAnimator::SetEnabled world lookup).","confidence":"high","status":"supported","subsystem":"ROC","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 12:46:35"},
{"id":35,"statement":"Oxygen/air: budget PlayerRescueEnt+0x343c from TLevelInfo+0x10 (def 600) x difficulty (index at *(g_session+0x6e4)+0x2c: 0/1/2 -> x1.5/x1.5/x1.0). Normalized fraction +0x3450 (0..1); mission clock remaining +0x3538. RescueHud::Update: displayed O2 lerps toward +0x3450; below 0.25 the low-air icon pulses and RC_OxygenLow fires once (re-armed at >= 0.5). `oxyon` sets regulator next-breath +0x3458 = now+700ms; `oxyoff` sets it to INT_MAX + stops the loop sound. Pass-out SoundCues PassOut_O2 (air) / PassOut_Fire (burns); `reset` verb = checkpoint respawn + RC_PassOut. The per-tick decrement lives in the g_session+0x6e4 mission-controller tick.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 12:37:27"},
{"id":34,"statement":"RescueHud (PlayerRescueEnt+0x5f4, ~0x2a94 B, ctor 0x004576b0) is the mission HUD. OnEvent(evId,arg) handles VictPick(1)/VictDrop(2)/carry(3,4)/tool-select(5)/tool-acquired(6)/bonus(7). Update() drives O2 gauge + timer + compass from PlayerRescueEnt+0x34xx and fires RC_ResLvlWin/Lose + RC_OxygenLow. Carried tools live in the SArray at PlayerRescueEnt+0x3564 (active idx +0x357c): 1 axe, 2 extinguisher, 3 IR goggles, 4 hose (touchhose only). `equip` creates the tool object; `select` only switches; `toolcmd` forwards a sub-command to the tool actor. ACTION control edges route to the active tool via vtbl+0x14/+0x18/+0x1c in PlayerRescueEnt::UpdateLocomotionAndTools.","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 12:37:27"},
{"id":33,"statement":"The front-end is a MenuManager embedded at GameSession+0x3c8 (ctor from GameSession::Init, parses menu.rrf). It owns an SArrayPtr of 10 MenuScreen objects (base ctor 0x00436630, vtbl 0x004e0840, slots [0] OnActivate(bool) / [1] OnButtonActivate(id)) + a 10-deep nav stack. Screens: 0 Main, 1 slot/new-game list, 2 Title, 3 Options, 4 level-select list, 7 Credits, 9 Splash (initial). Input via named message sinks MenuMouseDown/Click/Up. MenuManager::GotoScreen is the only screen-switch primitive. Menu selects a TLevelInfo (populating GameSession+0x688); actual level start is driven off the pending flag GameSession+0x68c in the session tick. In-level transitions go through the `loadmap`/`loadhosemap` script verbs -> GameSession::RequestLevelChange.","confidence":"high","status":"supported","subsystem":"main","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 12:37:27"},

{"id":31,"statement":"The dev console has no command parser. Console::OnKeyDown on Enter pipes the raw line to ScriptEngine::ExecLine -> ScriptTrigger::AddScriptLine, so every console command is a script verb. \"cvars\" are script-engine variables in the global map DAT_00503044; `set` writes, `listvars` dumps. Console enabled only when the cfg [DEBUG] flag DAT_00502a78 is set; the same [DEBUG] section flips the GenErr log/console routing flags (DAT_00502a79 etc).","confidence":"high","status":"supported","subsystem":"main","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 02:44:34"},
{"id":30,"statement":"Level transitions: `listmaps`/`loadmap`/`loadhosemap` are ScriptTrigger verbs; `finalexit`/`finalexitloadmap` are PlayerRescueEnt verbs. All map switches funnel through GameSession::RequestLevelChange (0x0042a260), which sets a pending byte (g_session+0x68c) + stores map name + rrf path (rescue.rrf or hose.rrf); the actual BSP/resource load runs later in the frame loop. LevelManager.cpp itself is just the thegame.lev parser + the TLevelInfo list + FindByIndex.","confidence":"high","status":"supported","subsystem":"main","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 02:44:34"},
{"id":29,"statement":"RichBinary is a block-structured serialization format (player saves saves\\player%i.rb, editor data). File header 0x17 bytes (\"RICHBINARY\" + version 1 + payload-start u32 + total-file-size). Each block = one LE u32 header: bits 0..28 payload size, 29..30 type, 31 has-name; nesting via a runtime offset stack; writer reserves the header and back-patches size in EndContainer. Block names are numeric tag ids via a global registry (FindByTag/FindByName). Strings = [u16 len][bytes], each byte through ScrambleChar. Text variants are std::iostream-based over the same tag stream.","confidence":"high","status":"supported","subsystem":"BluelAPI","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 02:44:34"},
{"id":28,"statement":"BluelAPI String is a 1-pointer COW handle. rep -> g_emptyString (0x00501908, refCount starts at 2) or a heap RatStr block {refCount+0, length+4, bufSize+8 (always n|0xf), data+0xc}. Copy addrefs; release (inlined everywhere) frees at refCount 0 via String::FreeRep; mutators call String::Detach when refCount>1. No small-string buffer. The 5-store inline init of g_emptyString (guard DAT_00501918) marks a String local being constructed.","confidence":"high","status":"supported","subsystem":"BluelAPI","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 02:44:34"},

{"id":22,"statement":"Victim lifecycle: Construct parses the level def and registers spawn-spot #0; VictimAltSpotEnt marker entities add more spots by name. Spawn resolves the victim type against VictimRegistry (victims.srf), builds the model, sets state=4 / claimed=0. SpawnAtSpot places it; ValidateSpawn runs an obstacle+reachability pass (state -> 7 or stays 4). Claimed by bot (state=6, \"botrescue\" event) or by player proximity ~60u (msg 0x7532 -> claimed=1, state=5). Delivered -> RescueBot dropoff timer -> UpdateZonesAndWin: when rescues(+0x3528) - inprogress(+0x3530) >= quota(+0x352c), enable Entity+0x18==8 exits (\"All of the survivors have been rescued! Exit through: ...\").","confidence":"high","status":"supported","subsystem":"rescue","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 02:11:47"},

};
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const conf = c => `<span class="c-${esc(c)}">${esc(c||'')}</span>`;
const tabs = ['Overview','Symbols','Hypotheses','Tasks','Events'];

document.getElementById('counts').innerHTML = [
  ['symbols',DATA.symbols.length],
  ['high conf', DATA.symbols.filter(s=>s.confidence==='high').length],
  ['hypotheses',DATA.hypotheses.length],
  ['evidence',DATA.evidence.length],
  ['tasks open',DATA.tasks.filter(t=>t.status!=='done').length],
  ['events',DATA.events.length],
].map(([k,v])=>`<div class="count"><b>${v}</b><span>${k}</span></div>`).join('');

const nav = document.getElementById('nav');
tabs.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;
  b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');document.getElementById('p-'+t).classList.add('active');};
  nav.appendChild(b); if(i===0)b.click();});

function sortable(table){
  table.querySelectorAll('th').forEach((th,idx)=>{th.onclick=()=>{
    const tb=table.tBodies[0], rows=[...tb.rows];
    const asc=!(th.dataset.asc==='1'); th.dataset.asc=asc?'1':'0';
    rows.sort((a,b)=>a.cells[idx].innerText.localeCompare(b.cells[idx].innerText,undefined,{numeric:true})*(asc?1:-1));
    rows.forEach(r=>tb.appendChild(r));
  };});
}

// ---- Overview ----
(function(){
  const p=document.getElementById('p-Overview');
  let h='<h3>Symbols by subsystem</h3><div class="wrap"><table><thead><tr><th>subsystem</th><th>total</th><th>high</th><th>med</th><th>low</th><th>documented</th><th>mix</th></tr></thead><tbody>';
  DATA.bySub.forEach(r=>{const t=r.total||1;
    h+=`<tr><td>${esc(r.subsystem)}</td><td>${r.total}</td><td>${r.high||0}</td><td>${r.medium||0}</td><td>${r.low||0}</td><td>${r.documented||0}</td>`+
    `<td><span class="bar"><i class="h" style="width:${120*(r.high||0)/t}px"></i><i class="m" style="width:${120*(r.medium||0)/t}px"></i><i class="l" style="width:${120*(r.low||0)/t}px"></i></span></td></tr>`;});
  h+='</tbody></table></div><h3>Recent activity</h3><div class="wrap"><table><thead><tr><th>when</th><th>kind</th><th>summary</th></tr></thead><tbody>';
  DATA.events.slice(0,25).forEach(e=>h+=`<tr><td class="ev mono">${esc(e.ts)}</td><td><span class="chip">${esc(e.kind)}</span></td><td>${esc(e.summary)}</td></tr>`);
  h+='</tbody></table></div>';
  if(!DATA.symbols.length) h='<p class="ev">No symbols recorded yet. Seeded task queue is on the Tasks tab.</p>'+h;
  p.innerHTML=h; p.querySelectorAll('table').forEach(sortable);
})();

// ---- Symbols ----
(function(){
  const p=document.getElementById('p-Symbols');
  const subs=[...new Set(DATA.symbols.map(s=>s.subsystem).filter(Boolean))].sort();
  p.innerHTML=`<div class="controls">
    <input id="sq" placeholder="filter name / summary / file...">
    <select id="ss"><option value="">all subsystems</option>${subs.map(s=>`<option>${esc(s)}</option>`).join('')}</select>
    <select id="sc"><option value="">any confidence</option><option>high</option><option>medium</option><option>low</option></select>
    </div><div class="wrap"><table id="st"><thead><tr>
    <th>address</th><th>name</th><th>kind</th><th>class</th><th>subsystem</th><th>source file</th><th>conf</th><th>status</th><th>summary</th>
    </tr></thead><tbody></tbody></table></div>`;
  const tb=p.querySelector('tbody');
  function render(){
    const q=p.querySelector('#sq').value.toLowerCase(), fs=p.querySelector('#ss').value, fc=p.querySelector('#sc').value;
    tb.innerHTML=DATA.symbols.filter(s=>{
      if(fs&&s.subsystem!==fs)return false;
      if(fc&&s.confidence!==fc)return false;
      if(q){const hay=(s.name+' '+(s.summary||'')+' '+(s.source_file||'')+' '+(s.orig_name||'')).toLowerCase();if(!hay.includes(q))return false;}
      return true;
    }).map(s=>`<tr><td class="mono">${esc(s.address||'')}</td><td class="mono">${esc(s.name)}</td><td>${esc(s.kind)}</td>`+
      `<td>${esc(s.class_name||'')}</td><td>${esc(s.subsystem||'')}</td><td class="mono">${esc(s.source_file||'')}</td>`+
      `<td>${conf(s.confidence)}</td><td>${esc(s.status)}</td><td>${esc(s.summary||'')}</td></tr>`).join('')
      || '<tr><td colspan="9" class="ev">no rows match</td></tr>';
  }
  p.querySelectorAll('input,select').forEach(el=>el.oninput=render);
  render(); sortable(p.querySelector('#st'));
})();

// ---- Hypotheses ----
(function(){
  const p=document.getElementById('p-Hypotheses');
  const evByH={}; DATA.evidence.forEach(e=>{(evByH[e.hypothesis_id]=evByH[e.hypothesis_id]||[]).push(e);});
  let h='<div class="wrap"><table><thead><tr><th>#</th><th>statement</th><th>about</th><th>conf</th><th>status</th><th>evidence</th></tr></thead><tbody>';
  DATA.hypotheses.forEach(x=>{
    const ev=(evByH[x.id]||[]).map(e=>`<details><summary><span class="chip">${esc(e.kind)}</span> ${esc(e.ref||'')}</summary><div class="ev">${esc(e.detail)}</div></details>`).join('')||'<span class="ev">none linked</span>';
    h+=`<tr><td class="mono">${x.id}${x.superseded_by?' <span class="chip">superseded</span>':''}</td>`+
      `<td>${esc(x.statement)}</td><td class="mono">${esc(x.symbol_name||x.subsystem||'')}</td>`+
      `<td>${conf(x.confidence)}</td><td>${esc(x.status)}</td><td>${ev}</td></tr>`;
  });
  h+='</tbody></table></div>'; if(!DATA.hypotheses.length)h='<p class="ev">No hypotheses recorded yet.</p>';
  p.innerHTML=h; p.querySelectorAll('table').forEach(sortable);
})();

// ---- Tasks ----
