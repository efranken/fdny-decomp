3528 = -1` on **every** victim spawn, forcing a fresh `EndMission` tally next frame. `FlushSpawnQueue` completes synchronously during load, so a same-frame script `finalexit` still sees the post-flush count. Residual: a level that spawns victims from a *delayed* script trigger has a window; a genuinely victim-less level wins on frame 1 (by design). |\n| **Over-delivery -> negative `outstanding`** | **ABSENT (softlock)** | `Verb_FinalExit`''s gate is strict `outstanding == 0`. `delivered > total` -> negative -> gate fails permanently. `UpdateZonesAndWin` uses `>=` and would pass, but you still need to touch an exit or call `finalexit`. |\n| **`climb`-verb fly** | **EXISTS, STABLE** (needs verb access) | `Verb_Climb` (0x0044c0b0) sets locomotion state 5 and zeroes velocity; its guard is `state != 5 && +0x3300 == 0` where `+0x3300` is the **carried-object pointer, not a ladder check** - the game has no ladder system. State 5 = gravity 0, wish rotated by the full yaw+pitch basis (look-up + forward = ascend), `vel.Y` driven by the wish, 400 cap, snappy 0.2 blend. `DepenetrateFromWorld` still runs, so you fly through open space (shafts, stairwells, elevator voids) and hard-stop on solids. Nothing exits state 5 except `unclimb`, `reset`, or JUMP (which SETs `vel.Y = 400` and bounces you up ~73u). Persistent, unbounded height. |\n| **Dev mode via `FDNYFirefighter.cfg`** | **EXISTS, STABLE** | `[DEBUG] ImADeveloper = true` (bool cvars take *only* `true`/`false`) writes `g_devMode` @ 0x00502a78 during `Config::Load`, before `GameControls::Construct`. That gates the `DBG_*` **BindKey** block (test @ 0x0043a009): **F7 `DBG_TOGGLE_SPECT`** (poll in `Think` @ 0x004525c7, itself NOT devMode-gated) sets spectator `+0x240 = 1` -> **noclip** (skips `DepenetrateFromWorld`), gravity 0, speed cap 800, fly with pitch, and each frame forces the mission timer up to >= 120 s and pins the smoke overlay clear (timer + damage immunity; exit with JUMP). **F8 `DBG_WIN_LEVEL`** (poll @ 0x0045266d) does `rescued = required - inProgress; UpdateZonesAndWin()` -> instant win on exit-less levels. **F6 `DBG_SKIP_HOTSPOT`** clears a hose-minigame hotspot (`WinLevel` on the last). Also: creates the **dev console** object (`roc_CreateEngineSubsystems` @ 0x00499361 - the console does NOT exist otherwise, so a retail player cannot open it), the F2/F3 FPS overlay, **F12 = instant quit**, engine app-log, and skips the two intro AVIs. It does **NOT** touch spawns, the mission timer, physics, RNG seeding, level unlocks, or menu flow (`SkipMenus` is the separate 0x00502a7a byte). See the `dev-mode` article. |\n| **`DBG_CLOSE_ALL_AREAS`** (F4) | **NOT a trivializer** | poll @ 0x0043dcf2 in `TE_BModel::Think` (undefined fn 0x0043dc60), poll **not** devMode-gated. It calls `TE_BModel::UpdateMapZones(this, 0)` -> `geWorld_OpenModel(world, model, 0)` per zone id, forcing every ticking moving brush-model (area/region dividers) into its **closed** BSP state + refreshing MapZone occupancy. A dev aid to collapse streamed areas - it does **not** extinguish fire, open exits, or satisfy the win check. |\n| **`finalexitloadmap <map>`** out-of-order | **PARTIAL** | blocks a nonexistent `data\\maps\\<map>.bsp` (`FindFirstFileA`), but does **no** campaign-order / identity check - any real map loads. |\n\n**Access note:** `escape`, `finalexit`, `finalexitloadmap`, `climb`, `unclimb`\nall sit in the `PlayerRescueEnt::OnScriptCommand` (0x00451870) `stricmp` chain\nwith no extra gating - reachable from **any level script**, and from the\n**dev console** (`ScriptEngine::ExecLine`) whenever `g_devMode` is on. A pure\nretail install with an unmodified `.cfg` and no cooperating script cannot\nreach them; a one-line `.cfg` edit unlocks the console (and F7/F8 directly).\n\n## Cluster 3 - Movement boosts\n\n**Verdict: no usable boost exists.** The only things that add player velocity\noutside normal locomotion are the `push` script verb and a negligible hose\nterm; fire and explosion damage add nothing.\n\n| Candidate | Verdict | Detail |\n| --- | --- | --- |\n| **Axe-swing recoil** | **ABSENT** | `Tool_Axe`''s vtable +0x34 \"reaction velocity\" returns a zero vec3. The on-hit \"recoil\" (`g_axeHitRegistered` `DAT_00502e04`, set only by `AxeSwing::ResolveHit` on a real breakable hit) just binds an `XFormAnimMover` view animation onto `player+0x34a4` + sets an anim enum - no body velocity/position. Swinging at air sets nothing. |\n| **Extinguisher spray recoil** | **ABSENT** | vtable +0x34 returns zero. The `+0x1e4`/`+0x1f0` tool vectors read by `UpdateLocomotionAndTools` land in `player+0x3488` = the `ViewRhythm` view-sway offset (camera), never velocity. |\n| **Hose spray reaction** | **MARGINAL, STABLE** | `Tool_Hose` vtable +0x34 (`0x004633d0`) returns a **unit** horizontal, aim-steerable vector (built from two adjacent hose-chain node positions, `Vec3_Normalize`, Y forced 0) while `hose+0xc3c` (stream active) is set; `Think` writes it to `player+0xfc` while grounded. **~1 u/s** against 400 run / 800 spectator - ~0.25%, recomputed every frame, no accumulation. Not exploitable. |\n| **Fire damage knockback** | **ABSENT** | `TakeFireDamage` (0x00451640) writes only: 4 directional flinch bool flags (`player+0x353c..0x353f`, via `SetFireFlinchDir` 0x0044bb00), a 1000-2500 ms `RC_Pain` chatter cooldown, the burn accumulator `+0x3538 += dt*1.2*intensity`, and the \"Serious Burns\" stat. **Zero impulse.** |\n| **Explosion / blast knockback** | **ABSENT** | No `Explosion` / `Knockback` / gas / boiler class exists in the binary. `BreakableEnt` hits only play sounds + set latch bytes. |\n| **`quake` verb** | **ABSENT (camera only)** | `ScriptTrigger::Verb_Quake` -> `EntityCam::BeginScreenShake` writes shake state `player+0xc4..+0xd0` only. Landing impact (`fall vel < -200`) is likewise `ViewRhythm`-only. |\n| **`push x y z` verb** (`+0x5b8` / `+0x478`) | **EXISTS but script-only** | `Think` does `vel += (+0x5b8)*dt` then zeroes it; **the sole writer is `Verb_Push`**, whose sole caller is `OnScriptCommand` (the `push` script verb). No damage / collision / hazard / tool code touches it. Confirmed `+0x478` (from `Think`''s `param_1` base) == `entity+0x5b8` - the same field. Same reachability as the cluster-2 verbs (level script / dev console). |\n\nCorrection found this cluster: the `PlayerRescueEnt::Think` plate had `+0x343c`\nlabelled \"mission timer\" - three independent 2026-08-29 analyses put the\nmission timer at **`+0x32fc`** and `+0x343c` (= `+0x357c` from entity base) at\n**`activeToolIndex`**. See `mission-win-lose`.\n\n## Cluster 4 - Timing / routing\n\n**The clock.** `g_gameClock` (0x00502ab8) holds two SubTimers: **[0] \"game\ntime\"** (pausable; feeds the `g_gameTimeMs`-delta cooldowns) and **[1] \"real\"**\n(free-running). `GameClock::Tick` publishes only the *active* one''s dt ->\n`g_frameDeltaTime` and elapsed-ms -> `g_gameTimeMs`. The mission countdown\n(`PlayerRescueEnt+0x32fc`) is decremented by `g_frameDeltaTime` once per\n`Think` frame.\n\n| Event | game-time SubTimer[0] | mission countdown (`+0x32fc`) |\n| --- | --- | --- |\n| In-game ESC menu open | **PAUSED** (`MenuManager::Activate` -> `SetTimeSource(1)`; rebased on close) | **KEEPS RUNNING in real time** - `TickSubsystems` has no pause gate, `Think` decrements it behind the menu |\n| Alt-tab / focus loss | PAUSED (selected SubTimer) + whole frame loop halted | **frozen** (no `Think` runs); no `dt` spike on return |\n| Fullscreen movie | not touched; frozen (no frames run) | **frozen**; <= 0.1 s catch-up on exit |\n| In-game level load (`changelevel`) | runs, but the post-load frame''s `dt` is clamped to 0.1 s | loses **<= 0.1 s**, then the new level re-inits it |\n| Frontend menu + load (Title -> Begin Mission) | PAUSED across menu + load (\"free\") | N/A (no player entity yet) |\n\nSo the in-game menu is **not a true pause** for the mission timer - only alt-tab\nand movies stop it. There is **no global time-scale**: `settimescale` /\n`settime` / `addtimecmd` are `ScriptedBModelEnt::ExecCommand` verbs that touch\nonly *that one entity''s* sequence playhead (`+0x1b4`), rate (`+0x1b8`) and\ntimed-command list (`+0x148`) - zero effect on `g_gameClock`,\n`g_frameDeltaTime`, or the countdown. No console command scales time either.\n\n**Cutscene / movie skip.** `PlayFullscreenMovie` (0x00485650) runs a bare\n`PeekMessage`/`Dispatch` pump; **any keyboard key-down aborts it** (via\n`MainWindow::WndProc` -> `Movie_RequestStop`). **Mouse clicks do NOT skip.**\nThe two intro AVIs (`ActiValue`, `Mekada`) and the campaign-end `End.avi` all\ngo through it and are key-skippable. The intros are gated only by `g_devMode`\n(so `ImADeveloper = true` skips them outright); otherwise it is one key-press\neach. Separately, the **`SkipMenus` cvar** (`[DEBUG] SkipMenus`, byte\n0x00502a7a) IS a real feature: `GameSession::ReturnToFrontend` (0x0042de14)\nauto-fires the default action on the first 3 frontend screen ticks, skipping\nthe attract/title screens on the way back to the main menu. (The byte at\n0x00502a79 is a *different* cvar, `EnableDebugLogging` / `g_logErrorsToFile`,\nwhich only gates `FDNYFirefighter.log` writes - an earlier note had these two\nswapped.)\n\n**Split-relevant RNG.** The global MT19937 is seeded once at\n`WinMain(timeGetTime())` and never reseeded. Beyond the **victim spawn-spot\npick** (one draw, see `victims`):\n- **Fire spread is fully DETERMINISTIC** - `FireRescueEnt::AdvanceSpread`\n  (0x00449340, Ghidra-misnamed `::Spawn`) is `progress += g_frameDeltaTime *\n  speed` along authored `PathPoint`s; child-fire spawn and keyframe times are\n  `__ftol` of deterministic expressions. **No `Rand_*` in the spread path.**\n  Whether/when fire blocks a route or an exit is a pure function of `dt` +\n  authored geometry + authored speed. (The only fire RNG: a 1-of-3 ambient\n  sound pick, and a `> 0.4` gate on a one-shot flare *visual* - both cosmetic.)\n- **RescueBot timing IS RNG** (`ArmRescueAttemptTimer` = `+ Rand_Below(30000\n  |60000)`; `BeginRescue` dropoff = `g_gameTimeMs + 4000 + Rand_Below(4000)`),\n  and a bot rescue removes a required victim + calls the same\n  `UpdateZonesAndWin` gate - so it *can* flip the win/finalexit condition.\n  **But the bot is opt-in**: it only runs after the `runrescuebot` script\n  verb or the dev-only `DBG_ACTIVATE_RESCUEBOT` key; default missions never\n  enable it, and `TryStartRescue` picks victims in list order (deterministic).\n- Everything else drawing from the stream is cosmetic (particles, radio\n  chatter, idle anims, skin/roster variants).\n\n## Summary - the speedrun picture\n\n**Route-level (any% with script/console access, e.g. one-line `.cfg` edit):**\n- `escape` x N (walk over each victim, deliver from anywhere) + one `finalexit`\n  from any position = skip \"rescue all + reach the exit\" on every rescue\n  level.\n- `finalexitloadmap <map>` accepts any real `data\\maps\\*.bsp` with no\n  campaign-order check - direct level warps.\n- `climb` verb = persistent zero-g fly (collision still on) for vertical\n  skips.\n- `ImADeveloper = true`: binds F7 noclip-fly + mission-timer immunity, F8\n  win-check, F6 hose-hotspot skip, and creates the dev console (the console\n  does not exist without it). `SkipMenus = true` is a separate cvar that\n  auto-advances the first 3 frontend screens. See the `dev-mode` article.\n\n**Movement / execution (no external access):**\n- Uncap the 60 FPS `Sleep(1)` (0x0042bf70) for ~9% higher / ~4% longer jumps;\n  otherwise there is **no** bhop / strafe-jump / air-accel / diagonal-speed\n  tech, **no** tool-recoil or damage boost, **no** clean wall clip.\n- The one real out-of-bounds vector is a large-`dt` (low-FPS or hitched)\n  frame overshooting a thin floor over a void - FPS-dependent, not\n  frame-perfect.\n- View rotation is FPS-independent by design, but a 10-event DirectInput\n  buffer drops whole frames of mouse motion on overflow (a hazard on real\n  hardware, a non-issue for a TAS feeding <=1 event/axis/frame).\n\n**Timing:** the in-game menu does not pause the mission countdown; alt-tab and\nmovies do. A level load costs <= 0.1 s of in-game time. No global time-scale.\n\n**Determinism:** the only RNG a runner needs to worry about is the victim\nspawn-spot pick (one MT19937 draw, not repeatable across runs since the seed\nis `timeGetTime()` and never reset) and - only if `runrescuebot` is used -\nthe bot''s rescue timing. Fire spread, the mission timer, jump physics (at a\nfixed FPS), and all the sequence-break verbs are fully deterministic.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"victims","title":"Survivors - the VictimRescueEnt state machine and the carry loop","subsystem":"rescue","body":"## The FSM\n`VictimRescueEnt::Think` (0x0045bea0) switches on `entity+0x120`:\n- **4 - idle / unvalidated / dropped.** Stands playing a random idle anim.\n  Pickable. This is the default; a victim only ever leaves state 4 if a level\n  script issues `roam`.\n- **5 - player-carried.** `Think` returns immediately; the entity is **frozen\n  exactly where it was picked up**, invisible to zone/claim logic. Fires the\n  `\"pickup\"` script event on entry.\n- **6 - bot-claimed OR delivered-to-safety.** `UpdateFadeFlicker` blinks the\n  actor out over ~30 frames then parks it; excluded from every list.\n- **7 - validated / roaming.** `UpdateRoamMovement` - free wander within leash\n  radius `+0x224` of the spawn point, obstacle-aware (`+0x1c4` obstacle list\n  from kind-6 volumes). Not patrol-between-spots.\n\nThere is **no dead / knocked-out / panic state**. Victims have **no fire\nresponse at all** - nothing writes the burn field `+0x128`, and the message\nhandler is a no-op stub. They cannot be hurt or killed by fire in this build.\n\"herodown\" downed-firefighter victims (spawned by `Verb_Reset` on hardest\ndifficulty) run the identical FSM.\n\n## Pickup / carry / deliver\n`VictimRescueEnt::TestPlayerPickupProximity` runs each frame: player AABB vs\nvictim position inflated by the pickup radius (`def+0x1c`, min 60 u). On\noverlap it sends message 0x7532 to the player - **no key press, no facing\ncheck, automatic on contact**. `PlayerRescueEnt::BeginCarrySurvivor` stores\n`player+0x3534`, flips the victim to state 5, notifies the camera-rig and\nexit entities, timestamps `player+0x5c4` for the Rescue Time stat.\n\nThe carry is **abstract** - the victim is not reparented to a bone, and there\nis **no O2 or movement penalty** while carrying.\n\nDeliver = the `escape` verb -> `DeliverCarriedSurvivor`: `+0x352c` (delivered)\n++, `PlayerStats \"Rescues\"` +1, `VictimRescueEnt::WarpToRescuerAndFade`\n(state 6, teleport ~120 u ahead of the rescuer, fire `\"rescue\"`, blink out),\n`UpdateZonesAndWin`. Dying while carrying -> `DropAtPlayer` (state 4, no\ncredit).\n\n## Spawn placement - where a survivor actually appears\nEvery position is **authored**, never generated. The pipeline:\n\n1. Each survivor is an editor-placed `RCS_VictimRescue` entity in the level\n   `.bsp`. Its `origin` key arrives as the Genesis3D `geEntity` user-data\n   struct (0x34 bytes) pointed to by `entity+0x150` (`VictimRescueDef`:\n   `+0x04` origin, `+0x10` name, `+0x14` type-name = `victims.srf` key,\n   `+0x18` angle, `+0x20..+0x30` five script hooks). `Construct` copies that\n   origin to `entity+0x4c` and registers it as **spawn-spot #0** in a flat\n   per-victim `SArray` at `entity+0x200` (count `+0x204`); each record is\n   `{vec3, angle}` (0x10 bytes).\n2. Each `RCS_VictimAltSpot` in the `.bsp` that references a survivor\n   (`VictimAltSpotEnt::Spawn` 0x00459840, resolving the victim ref at\n   `altSpotDef+0x10`) calls `RegisterSpawnSpot` to **append one more spot** =\n   the marker's own origin + angle. One marker feeds exactly one survivor;\n   multiple markers on the same survivor grow the pool.\n3. The entity bring-up (`EntityManager::FlushSpawnQueue` 0x0049c670) is\n   **two-phase**: pass 1 calls `Spawn` (vtbl+0x20) on every new entity, pass 2\n   calls `SpawnAtSpot` (vtbl+0x24) on every new entity. Pass 2 is\n   **unconditional** - it runs even when the pool has only spot #0 (non-victim\n   classes put a no-op stub in that slot).\n4. `SpawnAtSpot` (0x0045d5b0) picks **one spot uniformly at random**:\n   `idx = Ftol(Rand_FloatRange(0, count - 0.01))`, copies `spot[idx]` into\n   `entity+0x4c` / `+0x16c`, `SnapToFloor`, then also random-rolls a\n   **skin/material variant**. A single draw at spawn; never re-rolled. With no\n   alt spots the draw is forced to 0 -> the survivor spawns exactly on its\n   editor origin.\n\nAlso RNG-driven, **never a position**: the skin variant (step 4), the idle\nanimation (`SetIdlePose`), and for **type `0xE`** (\"random civilian\") the\nmodel id itself (`Spawn` rolls `Rand_Below(3) + 0xB` -> model 0xB/0xC/0xD).\n\n`forcespawnspot <n>` (0x0045a4c0) does the same copy for a script-given index\n(no persistent index field - it just writes `+0x4c` and moves on). `roam <n>`\n(`ValidateSpawn` 0x0045c7f0) sets the leash radius `+0x224`, runs 4 diagonal\nreachability probes, and enters state 7 - or logs \"...is stuck when spawned!\"\nand reverts to state 4 **without relocating** the victim. `ValidateSpawn` is\nthe *only* writer of state 7 and runs once (never re-invoked).\n\n## Per-level survivor count\nOne survivor per editor-placed `RCS_VictimRescue`, **plus** any \"herodown\"\nsurvivors minted at runtime by `PlayerRescueEnt::Verb_Reset` (hardest\ndifficulty only, when fewer than 3 firefighters are already down), each\nplaced **deterministically at the player's reset position**, angle 0, no RNG.\nThose are the *only* two runtime survivor creators. There is no \"spawn K of\nN\", no pooling, no count randomization; `EndMission` (0x0044fba0) just counts\nlive `kind==2` entities. `victims.srf` / `VictimRegistry` hold type data\n(model, beckon delays, speech names, rescue anims) - **no positions**.\n\n## Determinism and memory modification\nThe RNG is one global **MT19937** (state `g_mtState[624]` @ 0x00501a28,\nwords-left @ 0x004ff370, next-ptr @ 0x005023ec), seeded **once** by `WinMain`\nvia `Rand_Seed(timeGetTime())` and **never re-seeded** on level change,\nrestart, or spawn (the sole `Rand_Seed` xref is `WinMain`;\n`GameSession::RequestLevelChange` does not touch it). Every `Rand_Below` /\n`Rand_FloatRange` / `Rand_Float01` shares that one stream. So which spot a\ngiven survivor draws depends on the *total* count of RNG calls made by every\nsubsystem beforehand -> **not repeatable run-to-run, and not repeatable\nacross in-run retries**.\n\nBut the placement itself is **fully pinnable by memory modification** - no\npart of it is computed in a way a memory write cannot catch:\n- **STABLE** - patch the spot `SArray` at `victim+0x200` (all records ->\n  desired `{vec3,angle}`) before pass-2; the RNG index then cannot matter.\n- **STABLE** - one-time overwrite `victim+0x4c` after spawn **and** set FSM\n  state `+0x120 = 4` (disables the state-7 roam branch permanently; nothing\n  ever sets state back to 7). Optionally also zero roam speed `+0x228` and\n  set the roam waypoint `+0x1c8 = +0x4c`.\n- **STABLE-ish** - keep state 7 but set leash radius `+0x224 = 0` and anchor\n  `+0x218 = +0x4c`; `CanReachOffset` then rejects every candidate waypoint,\n  so the survivor halts within ~6 units of the pinned point.\n- **FRAGILE / global** - fixing the seed, NOP-ing `Rand_Seed`, or patching\n  `Rand_Below` to a constant all work but perturb every other RNG consumer.\n- The state-7 **roam** is the only self-motion, and it is a *bounded* leash\n  (continuous per-frame toward an RNG/chase-chosen waypoint clamped to\n  `+0x224` around fixed anchor `+0x218`); it never re-runs placement and\n  never snaps back to a spawn spot, so a pinned position holds as long as the\n  FSM is not in state 7. `g_debugVictims` (`DAT_00502aac+0x6a9`) only draws\n  roam-target tubes - it freezes nothing.\n\n## Victim types (`victims.srf`)\nThe victim registry is `victims.srf`, a line/token text file. A \"type\" record\ncarries a `Model:` int - which is *both* the `ROC_MODEL` resource id and the\ntype value - plus a beckon-delay range, a random spoken-name pool\n(`Beckon:`/`SpeechNames:`), and a `Rescue:` animation-name list. **Type `0xE`\nis a \"random civilian\"** - `Spawn` rolls it into one of models 0xB/0xC/0xD.\nSee the *resources* article.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"rescuebot","title":"The AI rescue bot","subsystem":"rescue","body":"There is **no pathfinding and no physical movement**. `RescueBot` is a pure\ntimer abstraction embedded at `GameLevel+0x340C`. No nav mesh, no waypoint\ngraph, no `PathPoint` follow, no bot entity, no position update, no unstick.\n\n`RescueBot::Think` (0x00455580), a no-op unless enabled and the mission is\nrunning:\n- If it holds a `currentVictim` and its `dropoffTimer` has elapsed:\n  `UpdateZonesAndWin`, log \"RESCUEBOT: Victim dropped off\", clear the victim.\n  **That 4-8 s wall-clock wait is the entire \"carry the victim out\".**\n- Else, when the `attemptTimer` elapses and the in-progress count is under the\n  cap: `TryStartRescue`, then re-arm.\n- Chatter: on its own timer, push a random urge line to the subtitle sink.\n\n`RescueBot::TryStartRescue` (0x00455230): iterate the player's child-entity\nlist and take the **first** victim that is state 4 or 7, has `norescuebot`\nunset (`+0x1fd == 0`), has clear line-of-sight, and is **at least 600 units\naway** (near victims are left for the player). Not nearest, not lowest-O2.\n\n`RescueBot::BeginRescue` (0x00454750): set `currentVictim`, bump the\nin-progress count, set `dropoffTimer = now + 4000 + rand(0..4000)`, and call\n`VictimRescueEnt::OnBotRescueBegin` - which flips the victim to state 6, so it\nfades out via the flicker timer and drops from every list. The rescue is\ncredited by omission when the timer expires.\n\nActivated by the `runrescuebot` script verb or (dev builds) the\n`DBG_ACTIVATE_RESCUEBOT` key.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"cameras","title":"The camera rig and the first-person / cinematic view switch","subsystem":"rescue","body":"`RCS_CamRescue` and `RCS_CamHose` are ordinary ROC entities (kind 5),\n**auto-spawned by their owning player entity** - `PlayerRescueEnt::Init` spawns\n`RCS_CamRescue`, `PlayerHose::OnSpawn` spawns `RCS_CamHose`. **There is no\ncamera script verb** (`camon`/`cutto`/`campath` do not exist; checked against\nthe whole verb table).\n\n- **CamHoseEnt** is the on-rails chase camera: each frame it puts the camera\n  at `target.pos` pulled back ~200 u along the look vector with a ~100 u\n  vertical offset, and aims at the target.\n- **CamRescueEnt** has no bespoke motion. Its `FrameUpdate` only runs\n  `Camera::UpdateShake` (procedural noise offset) and `Camera::UpdateTimedMove`\n  (a scripted lerp of the camera position between two points over a duration,\n  animating far-clip and fog alongside). FOV 110.\n\n## The view switch\n`ROCRender::RenderFrame` walks the RenderManager render-instance list. For a\n`Camera`, the cull predicate `Camera::ShouldRender` returns\n`alive(+0x64) && enabled(+0x08)`. First-person = the `EntityCam` at\n`PlayerRescueEnt+0x3460`; cinematic = the `EntityCam` embedded in\n`CamRescueEnt+0x24`. **Whichever camera is `alive && enabled` is what\n`geEngine_RenderWorld` renders from** - normal play has exactly one enabled.\nSo the switch is toggling `Camera+0x08`. `Camera::SetActive` (0x004953f0) sets\na secondary fullscreen byte and is only called by `CamRescueEnt::Init`.\n\nStill not byte-pinned: the exact runtime site that flips `Camera+0x08` on the\ncinematic cam - `CamRescueEnt` has no custom message handler, so it arrives via\nthe generic `tell <camname> <cmd>` / SendMsg path or a mission-sequence step.\nBoth cameras follow `PlayerRescueEnt+0x34a4`, the smoothed view-mount\n(`XFormAnimMover`) that republishes the first-person pose.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"carried-tools","title":"The carried tools (Axe / Extinguisher / Goggles / Hose)","subsystem":"rescue","body":"All four share a **`Tool`** base (ctor 0x0045f7e0, size 0x1fc; `+0x54` wielder\nPawn, `+0x58` attach/muzzle `WorldEntityBinder`, `+0x158` deployed byte,\n`+0x15c` deploy anim). `PlayerRescueEnt::UpdateLocomotionAndTools` drives them:\n`+0x14/+0x18/+0x1c` press/hold/release (edge, active tool only),\n`+0x20/+0x24` tick/post-tick (every tool, every frame), `+0x38` \"busy\" query.\n**active tool index 4 = the water tool** (bumps the \"Gallons Sprayed\" stat).\n\nThe active tool exposes two output vectors, both read by\n`UpdateLocomotionAndTools`:\n- `+0x1e4` / `+0x1f0` -> **`ViewRhythm` view-sway offset** (`player+0x3488`),\n  i.e. weapon/camera sway only - **not** body velocity. (Earlier note\n  \"adds into player locomotion\" was imprecise.)\n- vtable slot `+0x34` \"reaction velocity\" -> `Think` writes it to\n  `player+0xfc` (velocity) while grounded (overwrite if no move key, add if\n  moving). **Axe and Extinguisher return a zero vec here.** Only **Tool_Hose**\n  returns non-zero: a *unit* horizontal, aim-steerable vector while the stream\n  is active - ~1 u/s against the 400 u/s run speed, recomputed each frame, no\n  accumulation. Effectively nothing (see `speedrun-tech` cluster 3).\nThe axe-hit \"recoil\" (`g_axeHitRegistered` / `DAT_00502e04`) only binds an\n`XFormAnimMover` animation onto the first-person view transform - no body\nimpulse, and swinging at air never triggers it.\n\n- **Axe** - a composite of **two `AxeSwing` effectors** (`+0x200`, `+0x648`;\n  each is itself a `Tool` subclass). Press arms a 100 ms wind-up; hold swings -\n  plays `\"AxeSwing\"`, bumps `\"Axe Hits\"`, and at the arc apex proximity/Z-tests\n  a nearby-breakables list and fires `\"AxeHitWood\"`/`\"WoodDoorBreak\"` (or\n  `\"AxeHitOther\"`), clearing the target BModel's latch byte so it releases.\n- **Extinguisher** - a short-range foam **cone** (FSIN/FCOS, 3 emitters) that\n  douses kind-6 fire in range by stamping `[fire+0xa4] = 0x20`. Limited charge\n  `+0x8c8` draining at `+0x8cc`; auto-stops empty; refilled by the `\"refill\"`\n  message. 3-part sound cue.\n- **Goggles** - thermal toggle: scans for nearby fire *and* live victims within\n  ~2000 u, attaches screen-space highlight sprites that track them through\n  smoke for ~8.5 s, plus a full-screen tint overlay.\n- **Tool_Hose** - the *carried* hose (distinct from the on-rails `PlayerHose`):\n  100 ms nozzle spin-up, continuous particle jet each post-tick, tick\n  ray-tests the stream to douse the kind-6 fire it is aimed at, nozzle recoil\n  shoves the player, `+0xc68` = hydrant-connect state.\n\nSound \"events\" like `\"AxeHitWood\"` are **not** a pub/sub - each cue is a\nmember at a fixed offset in the tool object, played directly by\n`SoundCue::Play(this + offset)` from the tool's state machine\n(`MessageSink::Subscribe` at `0x004a12f0` only binds the FMOD sample key).\nThe axe hit sound is chosen by a **collision result**:\n`AxeSwing::ResolveHit` sphere-tests breakable world entities and reads their\nmaterial bit flags. Footsteps run through a `PlayerRescueEnt+0x198` byte\nflag â†’ `DoFootstep`. The tool's `+0x15c` deploy anim is a separate\n`XFormAnimMover` easing the tool xform into place.\n\n## Equip / registry\nTools live in an `SArray` at `PlayerRescueEnt+0x3564` (count `+0x3568`, valid\nindices 1..4; active-tool index at `+0x357c`). `ToolNameToIndex`: `axe`â†’1,\n`extinguisher`â†’2, `goggles`â†’3, `hose`â†’4 (the hose is created on demand by\n`Verb_TouchHose`). All five derive from `ItemAnimSeq`/`Tool` (base vtable\n`0x004e2790`): slot `+0x08` `OnEquip(owner)` builds the tool's HUD/FX \"view\"\n(colour ramps, overlay sprites, particle pools, `SoundCue` subscriptions);\n`+0x0c`/`+0x10` are `MOV EAX,imm32;RET` stubs returning `\"SELECT_AXE\"`/`\"axe\"`\netc.; `+0x24` `Tool::PostTick` advances the deploy anim; `+0x3c`\n`Tool::SetActive(bool)` is what `Verb_Select` / `SetActiveTool` toggle.\n`Verb_Equip` `new`s + `Construct`s the class (sizes: axe 0xa94, extinguisher\n0x8d0, goggles 0x600, hose 0xd54), calls `OnEquip`, then\n`RescueHud::OnEvent(6, index)`.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"hud","title":"The in-game HUD (RescueHud)","subsystem":"rescue","body":"`RescueHud` is a flat widget bag on a 640x480 screen: a per-frame **draw\nlist** (`+0x2880`) of Sprites and an **update list** (`+0x2898`) of\nRichTextLabels and HudAnimQuads. `this[0]` = the screen manager, `this+4` =\n`PlayerRescueEnt`.\n\nWidgets (offset from `this`):\n- `+0x24` - the live **status / objective text line**, `SetText` each frame\n  from `PlayerRescueEnt::BuildStatusText` (objective + mission timer).\n- `+0x6d8` - the transient **mission-briefing banner** (`ShowMissionText`;\n  seeds \"Find and rescue the survivors!\" for 5 s).\n- `+0x28d0` - the **O2 / air bar**, a shared `HudGauge` widget fed a *smoothed*\n  O2 that lerps 25%/frame toward `PlayerRescueEnt+0x3450`; visible only when\n  O2 <= 0.99. `+0x29f0` a low-O2 red flash that pulses under 0.25.\n- `+0x10bc` - the **burn / damage vignette** Panel group, scaled by\n  `PlayerRescueEnt+0x3538`; all forced on when the result is a loss.\n- `+0x964`/`+0xa94` - **compass** backing + needle (needle shown when\n  `+0x3440` set).\n- `+0x1cf0` / `+0x1b6c` - **TriIcon** and off-screen **DirCue** objective\n  markers (tied to `+0x352c`).\n- `+0x22bc..+0x264c` - four edge **damage-hit indicator** sprites.\n- `+0x277c` - the hose **GPM readout** (only when the hose is deployed).\n- `+0x824` - the screen fade/wipe controller (win anim 0x47, lose 0x48).\n\nThere is **no objective-list widget** - the single status line plus the radio\nnarration carry objective state. The `HudGauge` widget (0x00482400 family) is\nshared with the tool charge gauges.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"fire-system","title":"The spreading-fire system (RCS_FireRescue)","subsystem":"rescue","body":"A level fire is a **chain of `FireRescueEnt` nodes** crawling designer\n`PathPoint` splines, each node factory-spawning a child as it advances.\n\n`FireRescueEnt::Think` (0x00449fe0): the front half is the visual - dynamic\nlight colour (orange 0.9/0.3/0.1) and radius from intensity `+0x104`, random\nflicker, floor-proximity flag. Then: mode (`+0x4c`/`+0x70`) 4 ->\n`FireRescueEnt::AdvanceSpread` (0x00449340 - Ghidra mislabels this `::Spawn`);\nmode 5 (extinguished) -> early out. Anims `\"FireBurn1\"` / `\"Burn2\"`.\n\n`AdvanceSpread` steps progress `+0xe8` along the current PathPoint direction at\nspeed `+0xfc`; past the point (dot test) or half-segment it factory-creates a\nchild `RCS_FireRescue`, seeds its 3-5 path keyframes with randomised timing,\nspawns it, and schedules its activation for `now + rand`.\n\nDefault behaviour is **ambient** auto-crawl. It becomes mission-relevant\nthrough PathPoint script lines and the `moveto` / `stopmove` / `setsize` script\ncommands (`FireRescueEnt::HandleScriptCommand`). Modes: 0 idle, 4 spreading,\n5 extinguished.\n\n`FireRescueEnt` broadcasts damage as message 0x7531; only\n`PlayerRescueEnt::HandleMessage` decodes it (accrues burn `+0x3538`).\n`Fire::EmitEmbers` spawns rising spark particles from nearby active fires.\n\nSeparately, `RCS_WindowFire` is the hose mini-game's building-fire object -\nsee the hose article.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"script-verbs","title":"The ScriptTrigger verb catalog","subsystem":"script","body":"Every verb is one `ScriptTrigger::Verb_<Name>` worker, dispatched by\n`ScriptTrigger::HandleVerb` (0x0047a1f0).\n\n## Flow / logic\n`if` / `ifnot` (string equality on a script var), `if<` / `if<=` / `if>` /\n`if>=` (numeric), `iffacing` / `ifnotfacing` (`EntityFacingAngle` of two\nentities vs a tolerance), `ifclear` / `ifnotclear` (a named zone's occupant\ncount), `once \"<cmd>\"` (run at most once per trigger), `ignore N \"<cmd>\"`\n(skip the first N activations), `exec <file>` / `execsetsonly <file>`\n(run another script file; the \"setsonly\" form processes only `set` lines to\npreload defaults), `sendmsg <actor> <event>`, `tell` / `action`, `break`.\n\n## Variables\n`set <var> <val>`, `inc <var>`, `dec <var>`, `print <var>`. `difficulty\neasy|med|hard|show` writes `(session+0x6e4)+0x2c` and the `Difficulty` var.\n\n## World / presentation\n`playsnd` / `playsndat` / `stopsnd` / `loopsnd` / `loopsndat` /\n`loopsndatloc` / `ambientsnd` (+ debug `testloopsnd` / `testambientsnd`);\n`hint <sec> \"<text>\"` (-> the player's on-HUD hint text);\n`fogenable <5 floats>` / `fogdisable` / `quake <intensity> <dur>`\n(all act on the atmosphere entity, kind 5); `setlighttable <1..19>`;\n`loadmap` / `loadhosemap` / `listmaps` / `listvars`; `runrescuebot`;\n`debugvictims`; `quit` - which **shuts the whole game down**, not the level.\n\nThere is **no `spawn`, `camera`, `goto`, or `endlevel` verb** in\n`ScriptTrigger`. Level-ending and bonuses are `Verb_*` methods on\n`PlayerRescueEnt`, reached with `tell player <verb>`.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"script-vm","title":"The level script VM (ScriptActor / ScriptTrigger)","subsystem":"script","body":"Level logic is a **line-oriented string interpreter**, not bytecode. No\nprogram counter, no `goto`/labels, no `else`. `ScriptTrigger` is a subclass of\n`ScriptActor`.\n\n## Per-frame model\n`ScriptActor::Tick` (0x00470740). Fields: `+0x30/+0x34` command queue\n(`SArrayPtr` of strings) + count, `+0x48` wake-time, `+0x4c` waiting flag,\n`+0x08` event-name -> command-list map. Each frame: if waiting, clear once the\nglobal ms clock reaches `+0x48`; else run the subclass \"think\" (vtable slot 0)\nthen `RunQueuedCommand` (pop one front string -> `ExecCommand`).\n\n**`wait N` is the only time primitive** (sets `+0x48` / `+0x4c`; `idle` and\n`flush` clear it). Conditionals execute their quoted `\"<cmd>\"` argument\n**inline, immediately**, via recursive `ExecCommand`. `AddScriptLine`, despite\nits name, does not queue - it calls `ExecCommand` right now.\n\n## Dispatch\n`ScriptActor::HandleBaseVerb` handles `que` / `flush` / `wait` / `idle` /\n`cmd` / `loopinque` / `onmsg` / `onmsgappend` / `printmsgs` first; then\n`ScriptTrigger::HandleVerb` (a hand-written `stricmp` if-chain, ~40 verbs).\n\nCross-actor control: `tell <actor> <cmd>` re-enters `ExecCommand` on another\nactor found by name; `sendmsg <actor> <event>` runs that actor's\n`onmsg`-bound command list (`ScriptActor::FireEvent`).\n\n## Script variables\nGlobal dict `g_scriptVars` (`0x00503044`): ref-counted `String` values,\nauto-created as `\"0\"`, coerced to int on demand. A separate **per-trigger**\ndedup map at `this+0x54` backs the `once` and `ignore` verbs.\n\n## The dev console is a front-end for this\nThe `` ` ``/`~` console (gated on `g_devMode` / `EnableDebugLogging`) has **no\ncommand table of its own**. It is a 300-line scrollback ring plus a line\neditor with Up/Down history; opening it pauses the game. On Enter it just\nfeeds the raw line to `ScriptEngine::ExecLine` - so every \"console command\" is\na script verb (`set`, `tell player equip axe`, `loadmap`, `setlighttable`,\n`difficulty hard`, `runrescuebot`, `debugvictims`, `help`, ...), and typed\n\"cvars\" are script-engine variables (`set <name> <value>` / `listvars`).","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"level-triggers","title":"Level trigger volumes and the MapZone system","subsystem":"sharedents","body":"## RCS_BoundsTrigger - the trigger volume\n`BoundsTriggerEnt` does *not* subclass `ScriptTrigger`; it **embeds** one at\n`entity+0x24`. Keyvalues (`entity+0xfc`): a brush-model index that *is* the\nvolume, a touch mask / entity-class filter, and up to 10 script-line strings.\n`Spawn` binds `touch -> \"tell player escape\"` by default.\n\nFiring is `BoundsTrigger::DispatchTouchEvents` (0x00470840): entered ->\n`FireEvent(\"touch\")`, still inside -> `FireEvent(\"touching\")` every frame,\nleft -> `FireEvent(\"untouch\")` - for **any** entity, non-latching (scripts use\nthe `once` verb for fire-once). The per-entity toucher is bound via\n`ScriptEngine::BindToucherEntity` so `iffacing` / `tell player` act on it.\n\n## MapZone\nA `MapZone` is a **named set of `BoundsTrigger` AABBs**, not a brush or BSP\nleaf. `MapZoneSet` is an arena-backed, case-insensitive, string-keyed balanced\nBST; the manager lives at `PlayerRescueEnt+0x5d8`. Membership is built at load\nby `BoundsTrigger::MakeZone` -> `MapZoneSet::AddTriggerToNamedZone`.\n\nEach zone's occupant list (`zone+0x20`/`+0x24`) is rebuilt **every frame** by\n`MapZoneManager::RebuildZoneOccupants` and contains **victims only** (entities\nwith kind 2, state not 5/6). **Fire entities are never zone members.**\n`MapZone::ContainsPoint` is an OR over the member AABBs;\n`FindZoneContainingPoint` breaks ties by smallest summed volume (innermost\nwins).\n\n`MapZoneTracker` keeps current + previous snapshots of `{zone, entity}` pairs;\n`CommitFrame` flips current -> previous. That diff is the enter/leave signal\nbehind every `touch`/`untouch` callback in the game.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"level-entities","title":"The designer-placed level-entity family","subsystem":"sharedents","body":"All share one registrar (`EntClassRegistrar::SetNameAndPriority(\"RCS_<name>\",\n100)`) and a vtable slot map: 0 dtor, 5 Think (often an adjustor thunk to\n`ScriptActor::Tick`), 6 GetTransform, 8 Spawn, 18 per-frame visit / render.\n\n- **RCS_PathPoint** - a path node that is *also* a proximity trigger. Carries a\n  `name` + up to 10 script lines; `PathPointEnt::Think` runs\n  `DispatchTouchEvents` on its own zone, so the lines fire as a path follower\n  (e.g. `FireRescueEnt::GotoPathPoint`) arrives.\n- **RCS_MiscEmitter** - ambient particles / sound. Keyvalue `type` 1..6 picks\n  one of 4 impl classes at `entity+0x78` (types 5/6 = positional/ambient\n  sound). Distance-squared + PVS culled. Verbs: `turnon` / `turnoff` /\n  `setstrength` / `setsize` / `setrot` / `setpitch`.\n- **RCS_BlinkLight** - a scripted dynamic light. The blink pattern *is the\n  entity's own script* (a `wait`-loop toggling `SetLightParams`); there is no\n  C++ blink code.\n- **RCS_PropModel** - implemented by `ScriptedBModelEnt`. A placed mesh prop\n  with optional rotation, an optional `use` interaction (`+0x1c0 = 2` when a\n  `use` keyvalue exists), and a full touch/use script. Verb `makevalve`\n  (`+0xec = 1`) turns it into a \"turn the valve\" objective object.\n- **TE_BModel** (`RCS_BModel`) - the moving-brush entity (doors / lifts /\n  liftables / throwable debris). `Spawn` derives the open/closed Z limits from\n  the brush's MapZone span; `Think` eases it along a 2-keyframe `gePath` toward\n  a target path param. Verbs `open` / `openaway` / `opentowards` / `close` /\n  `drop`. Activation is script / linked-trigger / `use` - never push.\n- **ScriptedBModelEnt** - a lighter scripted brush entity handling\n  `hide` / `show` / `setscale` plus a timed-command schedule (`loop`,\n  `addtimecmd <t> <cmd>`).","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"radio-chatter","title":"The radio-narration system (RadioChatter)","subsystem":"sound","body":"`RadioChatter` is the game's primary objective/status channel - there is no\nHUD objective text beyond the one status line, so spoken lines carry it.\n\n`RadioChatter::Play(cue, immediate)` (0x004897c0) is the sole entry, ~15 call\nsites. `FindSet` linearly scans for a `TChatterSet` whose name matches the cue;\n`immediate` -> `PlayNext` (sequential), else `PlayRandom` (RNG with\nsingle-step anti-repeat). A cue name maps to a `TChatterSet` whose clips are\nthe sound-bank entries `<cue>0`, `<cue>1`, ... enumerated at load until\n`ROCSoundSystem::SoundExists` fails.\n\n**No priority field, no interrupt arbitration, no global cooldown** - a new\nline just plays over/after the last. Debounce is only the clip-level\nanti-repeat plus `Update` re-checking \"still playing\" ~once per 1000 ticks.\n\nTwo instances: `PlayerRescueEnt+0x3540` and `PlayerHose+0x208`, both built\nfrom the same 13-name roster in `RadioChatter::Init`.\n\nCue -> trigger map: `RC_ResLvlStart` <- level start; `RC_Pain` <- fire damage;\n`RC_ResTimeWarn` <- timer low; `RC_VictPick`/`RC_VictDrop` <- pickup/dropoff;\n`RC_ResLvlWin`/`RC_ResLvlLose` <- `RescueHud::Update`; `RC_OxygenLow` <- low O2;\n`RC_PassOut` <- passout/reset; `RC_HoseLvlStart`/`Win`/`Lose` <- `PlayerHose`.\n\n**Original-game bug found:** the hose warn-timer calls\n`Play(\"RC_HoseTimeWarn\")` at <5 s remaining, but that name is not in\n`RadioChatter::Init`'s roster, so `FindSet` returns null and it silently plays\nnothing.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"sound","title":"The sound system (FMOD 3.x + ROCSoundSystem / SoundCue)","subsystem":"sound","body":"Audio is **FMOD 3.x** (`FSOUND_*`, reached through a GetProcAddress thunk\ntable) behind a wrapper layer in `sound\\SoundSystem.cpp` /\n`sound\\SoundSample.cpp` / `sound\\SoundEngine.cpp`.\n\n## ROCSoundSystem (0x98 bytes, at `*(g_gameCtx+8)` == `session+0x3b0`)\n- `+0x08` a name -> `TSoundSample` ordered dict; `+0x00/+0x04` the active\n  `SoundCue` vector; `+0x18` four category-volume floats (`+0x28` mute\n  backup); `+0x3c` a deferred-play list; `+0x54` a listener/camera-follow\n  helper whose world position lands in `+0x7c..+0x84`.\n- **FMOD init is lazy** - there is no `ROCSoundSystem::Init`. The first\n  `ROCSoundSystem::LoadSound` sees the engine-open flag is 0 and calls\n  `TSoundEngine::Open` -> `FSOUND_SetHWND(GetForegroundWindow())` +\n  `FSOUND_Init(mixrate, 512, 0)`.\n- The sample bank is parsed from `data\\resdefs\\sound.rrf` (and `menu.rrf`)\n  by `ROCResourceParser::ParseSoundBuffer`:\n  `SoundBuffer \"name\" [minDist maxDist] = \"file\"`.\n- **Per frame:** `GameSession::TickSubsystems` -> `ROCSoundSystem::Frame`\n  updates the 3D listener (pos/forward/up from the camera helper; velocity\n  always 0), repositions every 3D cue, then `FSOUND_3D_Update`.\n\n## SoundCue (0x24 bytes; its first dword *is* the SoundWrap = an FMOD channel number)\n`+0x04` per-cue volume, `+0x10` `float*` emitter world position (NULL =>\n2D), `+0x14` category/owner id, `+0x18` play mode (0 one-shot / 1\nloop-or-start-if-idle / 2 loop + 3D listener-relative), `+0x1c` is-3D flag,\n`+0x20` name `String`. `SoundCue::Play(mode)` -> `ROCSoundSystem::Play`:\n`FindSample` by name, start `TSoundSample::Play` **paused**, set volume + 3D\nattrs + optional random seek, then unpause. Final channel volume =\n`perCueVolume x categoryVolume`, scaled x255 into `FSOUND_SetVolume`.\n\n## Category buses (4)\n`GameSession::SetSfxVolume` drives cats 0/1/2 (cat 1 x0.3 when the\ninterior/muffled flag `GameSession+0x6a8` is set). **Cat 3 is never touched\nby the sfx/music setters - the likely voice / `RadioChatter` bus.**\n`MuteCategory` is used for ducking on menu open / level transition.\n\n## Music\nNo separate stream manager - music is an ordinary `TSoundSample` under\n`Data\\snd\\music\\`, streaming only if its filename ends `.mp3` (else a looped\nsample). `GameSession` owns a game-music slot (`+0x690`) and a menu-music\nslot (`+0x698`). `GameSession::SetAudioState(state)` is a **7-state\ncrossfade/mute machine**: 0 enter menu, 1 resume gameplay, 2 start level\n(load + play looped music, flush deferred plays), 3 leave level (stop +\nfree), 4 enter interior (muffled: cat 2 x0.3), 5 exit interior, 6 start menu\nmusic.\n\n## Positional audio\nEmitter cues keep `SoundCue+0x10` pointed at a live world position;\n`Update3DPosition` runs each frame. Mode-2 cues are projected a clamped\ndistance out along the listener forward axis - a \"fixed-bearing\" trick for\ndistant sirens. Attenuation is FMOD standard: per-sample min/max distance\nfrom the `.rrf`, global rolloff 2.0, distance factor 0.5.\n`RCS_MiscEmitter` types 5/6 are the designer-placed positional/ambient\nemitters; `RadioChatter` is the spoken-narration layer on top.\n\n## Note: 0x004a12f0\nThis address is a `/OPT:ICF` **COMDAT fold** of the `SoundCue` \"rebind to a\nnamed cue\" method and `MessageSink::Subscribe(String const&, int, int)` -\nbyte-identical code merged to one address. ~55 callers span both uses\n(sound-cue rebinds, plus `MenuManager::Init` subscribing the `MenuMouse*`\nsinks).","status":"stable","updated_at":"2026-08-29 22:45:21"}],

const esc = s => (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const conf = c => `<span class="c-${esc(c)}">${esc(c||'')}</span>`;
const tabs = ['Overview','Symbols','Hypotheses','Knowledgebase','Tasks','Events'];

document.getElementById('counts').innerHTML = [
  ['symbols',DATA.symbols.length],
  ['high conf', DATA.symbols.filter(s=>s.confidence==='high').length],
  ['hypotheses',DATA.hypotheses.length],
  ['evidence',DATA.evidence.length],
  ['tasks open',DATA.tasks.filter(t=>t.status!=='done').length],
  ['kb articles',(DATA.kb||[]).length],
  ['events',DATA.events.length],
].map(([k,v])=>`<div class="count"><b>${v}</b><span>${k}</span></div>`).join('');

const nav = document.getElementById('nav');
tabs.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;
  b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');document.getElementById('p-'+t).classList.add('active');};
  nav.appendChild(b); if(i===0)b.click();});

function sortable(table){
  table.querySelectorAll('th').forEach((th,idx)=>{th.onclick=()=>{
    const tb=table.tBodies[0], rows=[...tb.rows];
    const asc=!(th.dataset.asc==='1'); th.dataset.asc=asc?'1':'0';
    rows.sort((a,b)=>a.cells[idx].innerText.localeCompare(b.cells[idx].innerText,undefined,{numeric:true})*(asc?1:-1));
    rows.forEach(r=>tb.appendChild(r));
  };});
}

// ---- Overview ----
(function(){
  const p=document.getElementById('p-Overview');
  let h='<h3>Symbols by subsystem</h3><div class="wrap"><table><thead><tr><th>subsystem</th><th>total</th><th>high</th><th>med</th><th>low</th><th>documented</th><th>mix</th></tr></thead><tbody>';
  DATA.bySub.forEach(r=>{const t=r.total||1;
    h+=`<tr><td>${esc(r.subsystem)}</td><td>${r.total}</td><td>${r.high||0}</td><td>${r.medium||0}</td><td>${r.low||0}</td><td>${r.documented||0}</td>`+
    `<td><span class="bar"><i class="h" style="width:${120*(r.high||0)/t}px"></i><i class="m" style="width:${120*(r.medium||0)/t}px"></i><i class="l" style="width:${120*(r.low||0)/t}px"></i></span></td></tr>`;});
  h+='</tbody></table></div><h3>Recent activity</h3><div class="wrap"><table><thead><tr><th>when</th><th>kind</th><th>summary</th></tr></thead><tbody>';
  DATA.events.slice(0,25).forEach(e=>h+=`<tr><td class="ev mono">${esc(e.ts)}</td><td><span class="chip">${esc(e.kind)}</span></td><td>${esc(e.summary)}</td></tr>`);
  h+='</tbody></table></div>';
  if(!DATA.symbols.length) h='<p class="ev">No symbols recorded yet. Seeded task queue is on the Tasks tab.</p>'+h;
  p.innerHTML=h; p.querySelectorAll('table').forEach(sortable);
})();

// ---- Symbols ----
(function(){
  const p=document.getElementById('p-Symbols');
  const subs=[...new Set(DATA.symbols.map(s=>s.subsystem).filter(Boolean))].sort();
  p.innerHTML=`<div class="controls">
    <input id="sq" placeholder="filter name / summary / file...">
    <select id="ss"><option value="">all subsystems</option>${subs.map(s=>`<option>${esc(s)}</option>`).join('')}</select>
    <select id="sc"><option value="">any confidence</option><option>high</option><option>medium</option><option>low</option></select>
    </div><div class="wrap"><table id="st"><thead><tr>
    <th>address</th><th>name</th><th>kind</th><th>class</th><th>subsystem</th><th>source file</th><th>conf</th><th>status</th><th>summary</th>
    </tr></thead><tbody></tbody></table></div>`;
  const tb=p.querySelector('tbody');
  function render(){
    const q=p.querySelector('#sq').value.toLowerCase(), fs=p.querySelector('#ss').value, fc=p.querySelector('#sc').value;
    tb.innerHTML=DATA.symbols.filter(s=>{
      if(fs&&s.subsystem!==fs)return false;
      if(fc&&s.confidence!==fc)return false;
      if(q){const hay=(s.name+' '+(s.summary||'')+' '+(s.source_file||'')+' '+(s.orig_name||'')).toLowerCase();if(!hay.includes(q))return false;}
      return true;
    }).map(s=>`<tr><td class="mono">${esc(s.address||'')}</td><td class="mono">${esc(s.name)}</td><td>${esc(s.kind)}</td>`+
      `<td>${esc(s.class_name||'')}</td><td>${esc(s.subsystem||'')}</td><td class="mono">${esc(s.source_file||'')}</td>`+
      `<td>${conf(s.confidence)}</td><td>${esc(s.status)}</td><td>${esc(s.summary||'')}</td></tr>`).join('')
      || '<tr><td colspan="9" class="ev">no rows match</td></tr>';
  }
  p.querySelectorAll('input,select').forEach(el=>el.oninput=render);
  render(); sortable(p.querySelector('#st'));
})();

// ---- Hypotheses ----
(function(){
  const p=document.getElementById('p-Hypotheses');
  const evByH={}; DATA.evidence.forEach(e=>{(evByH[e.hypothesis_id]=evByH[e.hypothesis_id]||[]).push(e);});
  let h='<div class="wrap"><table><thead><tr><th>#</th><th>statement</th><th>about</th><th>conf</th><th>status</th><th>evidence</th></tr></thead><tbody>';
  DATA.hypotheses.forEach(x=>{
    const ev=(evByH[x.id]||[]).map(e=>`<details><summary><span class="chip">${esc(e.kind)}</span> ${esc(e.ref||'')}</summary><div class="ev">${esc(e.detail)}</div></details>`).join('')||'<span class="ev">none linked</span>';
    h+=`<tr><td class="mono">${x.id}${x.superseded_by?' <span class="chip">superseded</span>':''}</td>`+
      `<td>${esc(x.statement)}</td><td class="mono">${esc(x.symbol_name||x.subsystem||'')}</td>`+
      `<td>${conf(x.confidence)}</td><td>${esc(x.status)}</td><td>${ev}</td></tr>`;
  });
  h+='</tbody></table></div>'; if(!DATA.hypotheses.length)h='<p class="ev">No hypotheses recorded yet.</p>';
  p.innerHTML=h; p.querySelectorAll('table').forEach(sortable);
})();

// ---- Knowledgebase ----
(function(){
  const p=document.getElementById('p-Knowledgebase');
  const arts=(DATA.kb||[]).slice();
  if(!arts.length){p.innerHTML='<p class="ev">No knowledgebase articles yet.</p>';return;}
  // tiny markdown: escape first, then ## headings / - bullets / blank-line paras / **bold** / `code`
  function md(src){
    const lines=String(src).replace(/\r/g,'').split('\n');
    let out='',para=[],list=[];
    const inl=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
    const flushP=()=>{if(para.length){out+='<p>'+inl(para.join(' '))+'</p>';para=[];}};
    const flushL=()=>{if(list.length){out+='<ul>'+list.map(li=>'<li>'+inl(li)+'</li>').join('')+'</ul>';list=[];}};
    for(const raw of lines){
      const line=raw.replace(/\s+$/,'');
      if(/^##\s+/.test(line)){flushP();flushL();out+='<h4>'+inl(line.replace(/^##\s+/,''))+'</h4>';}
      else if(/^[-*]\s+/.test(line)){flushP();list.push(line.replace(/^[-*]\s+/,''));}
      else if(line===''){flushP();flushL();}
      else{flushL();para.push(line);}
    }
    flushP();flushL();return out;
  }
  const subs=[...new Set(arts.map(a=>a.subsystem).filter(Boolean))].sort();
  p.innerHTML=`<div class="controls">
    <input id="kq" placeholder="search titles + article text..." style="min-width:280px">
    <select id="ks"><option value="">all areas</option>${subs.map(s=>`<option>${esc(s)}</option>`).join('')}</select>
    <span class="ev" id="kn"></span></div><div id="klist"></div>`;
  const list=p.querySelector('#klist');
  function render(){
    const q=p.querySelector('#kq').value.toLowerCase(), fs=p.querySelector('#ks').value;
    const shown=arts.filter(a=>{
      if(fs&&a.subsystem!==fs)return false;
      if(q){const hay=(a.title+' '+a.subsystem+' '+a.body).toLowerCase();if(!hay.includes(q))return false;}
      return true;
    });
    p.querySelector('#kn').textContent=`${shown.length} / ${arts.length} articles`;
    let cur='';let h='';
    shown.forEach(a=>{
      if(a.subsystem!==cur){cur=a.subsystem;h+=`<h3 style="margin:18px 0 4px">${esc(cur||'(area)')}</h3>`;}
      const open=(q||fs)?' open':'';
      h+=`<details class="kb-card"${open}><summary>${esc(a.title)}`+
        `<span class="kb-sub">${esc(a.slug)}${a.status!=='stable'?' &middot; '+esc(a.status):''}</span></summary>`+
        `<div class="kb-body">${md(a.body)}</div></details>`;
    });
    list.innerHTML=h||'<p class="ev">no articles match</p>';
  }
  p.querySelectorAll('input,select').forEach(el=>el.oninput=render);
  render();
})();

// ---- Tasks ----
(function(){
  const p=document.getElementById('p-Tasks');
  let h='<div class="wrap"><table><thead><tr><th>status</th><th>pri</th><th>title</th><th>subsystem</th><th>notes</th></tr></thead><tbody>';
  DATA.tasks.forEach(t=>h+=`<tr><td><span class="chip">${esc(t.status)}</span></td><td>${t.priority}</td>`+
    `<td>${esc(t.title)}</td><td>${esc(t.subsystem||'')}</td><td class="ev">${esc(t.notes||'')}</td></tr>`);
  h+='</tbody></table></div>';
  p.innerHTML=h; p.querySelectorAll('table').forEach(sortable);
})();

// ---- Events ----
(function(){
  const p=document.getElementById('p-Events');
  let h='<div class="wrap"><table><thead><tr><th>when</th><th>kind</th><th>summary</th><th>detail</th></tr></thead><tbody>';
  DATA.events.forEach(e=>h+=`<tr><td class="ev mono">${esc(e.ts)}</td><td><span class="chip">${esc(e.kind)}</span></td><td>${esc(e.summary)}</td><td class="ev">${esc(e.detail||'')}</td></tr>`);
  h+='</tbody></table></div>';
  p.innerHTML=h; p.querySelectorAll('table').forEach(sortable);
})();
