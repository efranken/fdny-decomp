{"id":29,"statement":"RichBinary is a block-structured serialization format (player saves saves\\player%i.rb, editor data). File header 0x17 bytes (\"RICHBINARY\" + version 1 + payload-start u32 + total-file-size). Each block = one LE u32 header: bits 0..28 payload size, 29..30 type, 31 has-name; nesting via a runtime offset stack; writer reserves the header and back-patches size in EndContainer. Block names are numeric tag ids via a global registry (FindByTag/FindByName). Strings = [u16 len][bytes], each byte through ScrambleChar. Text variants are std::iostream-based over the same tag stream.","confidence":"high","status":"supported","subsystem":"BluelAPI","superseded_by":null,"symbol_name":null,"symbol_address":null,"created_at":"2026-08-28 02:44:34"},

  "kb": [{"slug":"coverage","title":"Labeling coverage and the stop line","subsystem":"overview","body":"**The labeling pass has reached its natural stop line (loop cycle 22).**\n\n## Where it stands\n- ~2746 real functions in the binary; **~1000 carry a `research.db` row with\n  a summary**, and every one of those is a deliberate identification, not an\n  auto-name.\n- **29 Knowledgebase articles** cover every game system and how they interact.\n- ~97 hypotheses with linked decompile evidence; a full running log of\n  findings and corrections in the events table (nothing is ever deleted).\n\n## What is NOT labeled, and why that is the stop line\nRoughly **1780 functions remain as bare `FUN_`**. Successive\n`get_functions` sweeps (cycles 18 and 22) classify them:\n- **~42% pure MSVC runtime** - two CRT/STL/`<iostream>`/`<locale>` blobs\n  (`0x407000-0x40bfff` and `0x4a2aae-0x4db750`). Not game code.\n- **~35% BluelAPI container / serialization plumbing** - `String` / `SArray` /\n  `RichBinary` / `RBField` / `ByteStream` / `NameTree`-AVL one-liners and\n  per-type template instantiations. Called from everywhere, carry no gameplay\n  semantics.\n- **~23% ctors / destructors / vector-deleting-dtors / `RegisterClass`\n  thunks / small accessors** hanging off classes that are **already named and\n  summarised**.\n\nThe wave-22 sweep spot-checked the handful of remaining game-code stragglers\n(script-var publish, use/hint message subscription, a Vec3 spring-follow\nintegrator) - all are leaf helpers *inside* subsystems that are already\nmapped. **No residual `FUN_` cluster reveals a game system or mechanic an\nagent would be asked about.**\n\n## Confirmed non-existent\nNo water simulation and no standalone atmosphere subsystem. No batched\ndebug-draw API. No `MessageBus` / event pub-sub. No medal/grade/rating\nsystem. No controls-rebind screen. No joystick support.\n\n**Note - things that DO exist (were once wrongly listed as absent):**\n- **`AshSim`** is real: a cosmetic ~100-mote ash/ember emitter attached to\n  the player (`Init`/`Think`/`SetDensity`/`RespawnParticle`/`ParticleSubTick`\n  /`Particle_Construct`/`Destruct`), driven from `PlayerRescueEnt::Think` and\n  the `setashdensity` verb. It is not a general particle/weather system - just\n  the one player-follow effect.\n- **A difficulty mechanism** exists: the `difficulty easy|med|hard` verb\n  writes `(session+0x6e4)+0x2c` and the `\"Difficulty\"` script var that level\n  scripts branch on, and it scales the mission timer / look-pitch clamp /\n  hose-hotspot budget by fixed multipliers. What does *not* exist is\n  per-level difficulty data baked into `TLevelInfo` - the tuning is all in\n  those three code-side multiplier triples, not the level files.\n\n## If you want literal 100% symbol coverage\nIt is mechanical from here: bulk-tag the two CRT blobs as runtime, and\nbulk-name the container/serialization families and the getter/ctor/dtor tail\non named classes. This adds symbol count but no understanding - the \"ask an\nagent about any system\" goal is already met.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"open-questions","title":"Open questions and things still unpinned","subsystem":"overview","body":"Loose ends. None block anything - every game system is mapped; these are\nbyte-level details.\n\n- **The cinematic-camera enable flip.** `Camera+0x08` (enabled) is what\n  switches first-person vs `CamRescueEnt`, but the exact runtime call site that\n  toggles it on the cinematic cam is not byte-pinned. No camera script verb\n  exists; it arrives via `tell <camname> ...` or a mission step.\n- **`TLevelInfo+0x1c`** (default -1) - unidentified. Candidate: a briefing or\n  unlock-requirement id.\n- **`PlayerRescueEnt+0x3530` \"victims lost/dead\"** - inferred from the\n  `outstanding` formula, not directly observed being written.\n- **Manual-GUI `create_function` backlog.** A number of undefined code\n  regions (some tool action slots, `CamHoseEnt::Init/FrameUpdate`, the\n  RichBinary typed `read*`/`write*` primitives, `RenderInstance::\n  PrepareForRender`, `MapZone::Load`, `AxeSwing::ResolveHit`,\n  `PlayerRescueEnt::Think`/`FrameUpdate` 1-byte bodies) carry full plate\n  comments and DB rows but have no Ghidra function object - the VM''s MCP\n  `create_function` and script providers are broken, so these need a manual\n  \"Create Function\" pass in the GUI, after which the recorded names apply.\n- **`0x0049b690`** - named `EntClassRegistrar::SetNameAndPriority` in one pass\n  and read as `NameHashKey::Build` in another; may be the same op (name hashing\n  during class registration), not re-verified.\n\n**Resolved along the way:** the anim-event fire site (cycle 20b - there is no\npub/sub); the sound system (cycle 17b); the BluelAPI foundation library\n(cycle 17a); the first-person/cinematic switch mechanism (cycle 16 - a Camera\nenabled byte); \"no medal/grade system\" and \"no per-level difficulty scaling\"\n(cycles 19 / 14a); the copy-protection routine (cycle 19).","status":"needs-review","updated_at":"2026-08-29 22:45:21"},
{"slug":"overview","title":"What the game is, and how the code is shaped","subsystem":"overview","body":"**F.D.N.Y. Firefighter: American Hero** (2002 PC, dev Mekada, pub Activision Value).\nBuild v2.03, compiled \"Mar 8 2002\". `FDNYFirefighter.exe` is a 1,060,864-byte\nPE x86-32 image, base 0x00400000, ~6094 functions.\n\n## Engine stack\n- **Genesis3D v1.1** (open-source; `GENESIS.DLL`, the `ge*` API) does rendering,\n  BSP world, collision, actors/motions.\n- Internal engine codename **\"Everblaze 2\"** (`G:\\Everblaze2\\Src\\`).\n- **BluelAPI** = the foundation library: ref-counted copy-on-write `String`,\n  `SArray`/`SArrayPtr` containers, `ByteStream`/`Win32File`, `RichBinary`\n  serialization, `NameTree`, `MessageSink` pub/sub.\n- **\"ROC\"** = the runtime layer over Genesis3D: entity model, renderer wrapper,\n  resource parser, message mapping. `GameCtx` (global `g_gameCtx`) hangs the\n  subsystems off one struct.\n- Audio: **FMOD 3.x** (`FSOUND_*`) under a `ROCSoundSystem`/`SoundCue` wrapper.\n- Input: **DirectInput8**, keyboard + mouse only.\n\n## Reading the binary\nIt is an assert-heavy build: `dir\\File.cpp` + `__LINE__` strings survive in\n`.rdata` and pin function clusters to their translation units. That string\ntable is the primary labeling lever. Classes use MSVC vtables; most gameplay\nentities register under an `RCS_<Name>` string with priority 100.\n\nThe two game modes are the **rescue** levels (`PlayerRescueEnt`, carry\nsurvivors out) and the on-rails **hose** mini-game (`PlayerHose`).\n\n## Copy protection\nAt startup a `CheckGameCD` routine loads `texture.dat` - an XOR-obfuscated\n`uint32` blob shipped next to the EXE (400-byte repeating key) -\n`File_LoadObfuscatedU32Blob` / `XorDecryptBuffer` - and checks two payload\nbytes as a disc-presence token. It prints `OutputDebugStringA(\"Don't blame\nMekada\")` on the way through. `texture.dat` is a mis-named protection file,\nnot an asset.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"bluelapi","title":"BluelAPI - the foundation library (String / SArray / IO / RichBinary / NameTree / GenErr)","subsystem":"BluelAPI","body":"## String\nA **1-pointer copy-on-write handle** - no rope, no small-string optimization.\nThe `String` object is just `{ RatStr* rep; }`. The `RatStr` block is\n`+0x00 refCount`, `+0x04 length` (excl NUL), `+0x08 bufSize` (always\n`n | 0x0f`), `+0x0c char data[]`. Empty strings share the singleton\n`g_emptyString` (`0x00501908`). Copy is shallow + `++refCount`; every mutator\ncalls `String::Detach` (fresh malloc, `refCount = 1`) when shared. So every\nnon-empty value is heap-allocated. Scan helpers turn a `String` into a number:\n`ScanInt` (`%i`/`%x`), `ScanUInt`, `ScanFloat` (`%f`/`%g`), `ScanBool`\n(`true`/`1`/`false`/`0`).\n\n## SArray / SArrayPtr\nTwo array flavours. **`SArray`** (~0x1c header: `data, count, capacity, ?,\nelemDtorFn, elemSize`) owns value elements. **`SArrayPtr`** (0xc:\n`data, count, capacity`) is a pointer vector. Grow granularity is usually\n`0x10`. `AssertIndex` is the bounds-check that routes to `GenErr` on failure.\nThere is also a refcounted, inline-storage variant used for RichBinary field\narrays with a copy-on-write detach (`SArrayRB::DetachCOW`).\n\n## ByteStream / Win32File\n`ByteStream` is the serialization stream interface: vtable `+0x04` Write,\n`+0x08` Read, `+0x10` Tell, `+0x1c` GetSize; a flags byte gates\nreadable/writable. Forward `Seek` on a write stream emits padding zeros; on a\nread stream it consumes bytes. `Win32File` wraps a Win32 `HANDLE`\n(`+0x08` path String, `+0x0c` mode bits, `+0x10` HANDLE, `+0x14` size,\n`+0x18` pos). `XorByteStream` is a cipher wrapper.\n\n## RichBinary\nBluelAPI (Everblaze) named-node tree format - `root` -> typed child fields.\nBacks the `.rb` save files and the `.rrf` / `.srf` resource defs. Field-type\nenum: 1 CUSTOM, 2 BOOL, 3 BYTE, 4 UBYTE, 5 SHORT, 6 USHORT, 7 INT, 8 UINT,\n9 FLOAT, 10 DOUBLE, 11 STRING, 12 CONTAINER. An in-memory `RBField` is\n`+0x04` name, `+0x08` typeTag (12/CONTAINER *locks* the tag), `+0x0c` parent,\n`+0x14` children `SArrayPtr` (overlaps the scalar value slot at `+0x18` for\nnon-containers), `+0x24` a refcounted blob for CUSTOM. `RichBinaryReader` /\n`RichBinaryWriter` do the stream side; the \"Expected node named\" assert is the\nreader node-lookup guard.\n\n## NameTree\nA name-string -> value balanced BST (the tree lives at `NameTree+0x08`:\nnode-pool base `+0x04`, root offset `+0x14`, case-fold flag `+0x18`; each\nnode `+0x04` left, `+0x08` right, `+0x0c` value, `+0x10` inline key). Used by\nthe `GameControls` ActionMap and anywhere a name needs to resolve to an\nobject.\n\n## GenErr\nThe assert / fatal-error mechanism (`main\\GenErr-Everblaze.cpp`). **Every\nfailed assert in the binary** - every `dir\\File.cpp:line` check - builds a\n`GenErr` record (severity, message, file, line) and lands in\n`GenErr::Dispatch` (`0x00422060`; Ghidra shows this stuck under the wrong name\n`SArray::OobFail`). A `GenErr` object streams its message through an embedded\n`ostringstream` (`operator<<` for cstr and `String`); `GenErr::Commit` flushes\nup to 0x400 chars into the record. Severity 1 = fatal -> optional log line\n`\"FATAL ERROR <file>: <msg>\"` + `MessageBoxA` + abort/`int3`; severity 2 ->\n`Console::Print`.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"entity-handles-messages","title":"Entity handles and the game message map","subsystem":"ROC","body":"## Handles\nAn entity reference is a `{slot, generation}` pair. `EntityHandleTable`\n(`GameCtx+0x10`) keeps a running generation counter, a record array\n(each 0xc bytes: slot / generation / entity ptr), a freelist, and an SArray\nof weak-refs. **`EntityHandleTable::Deref` (0x0049b7e0)** returns the entity\nptr only if the stored generation still matches - so a stale handle safely\nresolves to null. `roc_ResolveEntityHandle` (0x0049d4a0) wraps it;\n`EntityHandleTable::Free` (0x0049b780) releases a slot and zeroes the entity's\n`+0x08`.\n\n## Message map\n`ROCMessageMapper` (`mmap.cpp`, `GameCtx+0x1c`) is a 0x40-entry table\n(stride 0x14: `msgId / p2 / p3 / handlerCtx / activeByte`) mapping a game\nmessage id to a handler. Script message tables register through\n`ScriptMsgTable::AddHandler` (0x00481a60) with a class base of `0x7530`.\n\nKnown message ids:\n- `0x2711` - the `\"World\"` entity built by `LoadLevel`.\n- `0x3ea` - prop `use` interaction (`PropModelEnt::OnUsed`).\n- `0x7531` - fire-touch damage, broadcast by `FireRescueEnt`; only\n  `PlayerRescueEnt::HandleMessage` decodes it (victims ignore it).\n- `0x7532` - \"player, pick up this victim\", sent by\n  `VictimRescueEnt::TestPlayerPickupProximity`.\n\nNote: `ROCMessageMapper::Construct` at `0x0042b1f0` actually builds a\n*different* object (a deferred-message queue with a FrameThrottle) - likely\nmislabeled by an analysis pass; the real mapper ctor is elsewhere.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"resources","title":"Resource files - .rrf manifests, .bsp levels, victims.srf, light tables","subsystem":"ROC","body":"## `.rrf` - the resource manifest\n`ROCResourceParser::ParseFile` reads a **PRECOMP''d, C-tokenized** file\n(`ROC\\Parsing\\resparse.cpp`). It is *not* the `thegame.lev` line format - a\n`#` anywhere is fatal (\"Try running PRECOMP.\"). It recognises **exactly five\ndirectives**, each keyed by an integer id (sounds by name):\n\n| Directive | Builds |\n|---|---|\n| `ROC_MODEL <id> \"<path>\" ;` | a Genesis3D `geActorDef` |\n| `ROC_BITMAP <id> \"<path>\" ;` | an opaque `geBitmap` |\n| `ROC_ALPHA_TEXTURE <id> \"<color>\" [\"<alpha>\"] ;` | a `geBitmap` + separate alpha-channel image |\n| `ROC_SOUND_BUFFER2D <name> \"<path>\" ;` | a non-positional `TSoundSample` |\n| `ROC_SOUND_BUFFER3D <name> <min> <max> \"<path>\" ;` | a positional `TSoundSample` with min/max attenuation distances |\n\nFiles: `sound.rrf` (session init), `menu.rrf`, per-mission `hose.rrf` /\n`rescue.rrf`, and the per-level `data\\resdefs\\<name>.rrf`. Resources land in\nthe *main* world-resource set or the *hose-map* set per a selector flag.\n\n## `.rrf` vs `.bsp` - who owns what\nThe `.rrf` has **no entities and no lights**. The Genesis3D `.bsp` carries the\nlevel geometry, the light entities (`geWorld_AddLight`), and the entity set\nwith keyvalues. `GameSession::LoadLevel` parses the `.rrf` first (shared\nrender+sound resources), loads the `.bsp` next, then flushes the entity spawn\nqueue - each BSP entity spawns via its `RegisterClass` factory and references\n`.rrf` resources by id (a victim''s `Model: 11` -> `ROC_MODEL 11`).\n\n## `victims.srf` - the victim registry\n`VictimRegistry::Load` parses a line/token text file. A record (\"`Victim:`\" ...)\nis a 0x48-byte `VictimTypeRecord`:\n- **`Model:`** int - this *is* both the `ROC_MODEL` def id and the victim\n  \"type\" value. **Type `0xE` is a \"random civilian\" alias**: `Spawn` replaces\n  it with `Rand_Below(3)+0xB` over models 0xB/0xC/0xD.\n- **`MinBeckonDelay:` / `MaxBeckonDelay:`** (default 2.0 / 4.0 s).\n- **`Beckon:` / `SpeechNames:`** - a comma-list String pool; a random element\n  becomes the victim''s spoken identity (fallback `\"someone\"`).\n- **`Rescue:`** - a comma-list of rescue-animation names.\n\nUnknown type name -> a default type + a `GenErr` warning; unknown model # ->\nthe victim is not created.\n\n## Light tables\n`setlighttable <1..19> \"<string>\"` -> `geWorld_SetLTypeTable`. A \"light table\"\nis a **Genesis3D animated light-style string** - Quake-style, letters\n`a`=black .. `m`=normal .. `z`=2x, cycled over time to make a light type\nflicker / pulse / throb. It is **not** a palette or a colour LUT; light\ncolour/position/radius come from the BSP light entities. The verb honours the\nmain-vs-hose-map world selector.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"roc-entity-model","title":"The ROC entity model - Entity / WorldEntity / ModelEntity","subsystem":"ROC","body":"Every in-game object derives from this three-level chain (MSVC single\ninheritance, one vtable per level).\n\n## Hierarchy\n- **`Entity`** - root, vtable `0x004e4288`, ~0x24 bytes.\n  `+0x04` handle slot, `+0x08` handle generation (0 = unregistered),\n  `+0x0c` owning world ctx, `+0x14` flags (init 0xffeb),\n  **`+0x18` KIND TAG** (1 player / 2 victim / 5 camera / 6 fire / 8 final-exit;\n  set *after* construction, used for filtering everywhere),\n  `+0x1c` dead/unlinked byte. Slots: 10 `InitFromSpawn` (respawn re-init),\n  11 `Unlink`.\n- **`WorldEntity`** - vtable `0x004e4338`. Adds the embedded transform\n  sub-object at `+0x24` (its own secondary vptr `0x004dfc30`, a `geXForm3d`),\n  **world position vec3 at `+0x4c`** (the xform translation), collision-AABB\n  cache `+0x68`, frame displacement `+0x90`, `WorldEntityBinder*` at `+0xd0`\n  (attaches a renderable actor/light into the `geWorld`).\n- **`ModelEntity`** - vtable `0x004e43f0`. Adds the physics working set:\n  `+0xf0` prev velocity, `+0xfc` velocity, `+0x108` ground-plane normal,\n  `+0x114` acceleration, `+0x120` push/slide accum, `+0x12c/+0x12d`\n  grounded now / last. Its last vtable slot is `IntegrateVelocity`\n  (semi-implicit Euler + per-axis damping over `g_frameDeltaTime`).\n\n`ROCWorldEntity` (vtable `0x004e4458`, size 0x30) is a *separate* branch off\n`Entity` - a bare `geWorld` wrapper, not the same as `WorldEntity`.\n\n## Spawning\n`roc_SpawnEntity` (0x0049d4c0) calls the spawn factory at `GameCtx+0x24`.\nClass lookup is `EntClassRegistry::FindClass` (0x00429c00, hash-bucketed by\nname). The per-frame think/draw dispatch is **not** on these vtables - it runs\nfrom `ROCRender::RenderFrame` over the renderable list.\n\n## Corrections logged along the way\n`0x0049dbc0` \"Entity::IntegrateVelocity\" is really `ModelEntity`'s slot;\n`0x0049d790` \"ModelEntity::GetCollisionBlock\" is really `WorldEntity`'s.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"rendering","title":"The renderer (RenderManager / ROCRender / RenderInstance / Path)","subsystem":"ROC","body":"\"ROC\" is a thin runtime layer over Genesis3D. Rendering is one singleton -\n**`RenderManager` / `ROCRender`** at `*(g_gameCtx+4)`.\n\n## The scene lists\nIt holds two `TWorldResources` sets - `staticRes` (`+0x08`, persistent) and\n`levelRes` (`+0xb4`, rebuilt per level); a byte at `+0x160` selects which is\nactive. Each set owns the `geWorld*` (`+0x78`), a few resource tables, and two\nnode lists: **`renderNodeList`** (`+0x7c`, a *heterogeneous* `SArrayPtr` of\n`RenderInstance*` **and** `Camera*` with nullable slots - the per-frame draw\nlist) and **`renderNodeRegistry`** (`+0x94`, every node ever created, for\nenumeration/teardown).\n\n## The renderable interface\nA common `RenderNode` base (`geXForm3d` local transform at `+0x10`, RGBA/scale\nat `+0x40`, id at `+0x50`) with two concrete types:\n- **`RenderInstance`** (0x78) wraps a `geActor` - `+0x60` `geActor*`,\n  `+0x5c` owning `ModelEntity`, `+0x54` a `geWorld` light handle.\n- **`Camera`** (0x7c) wraps a `geCamera` - `+0x5c` `geCamera*`, `+0x08`\n  **enabled** byte, `+0x64` alive byte. `Camera::ShouldRender` = `alive &&\n  enabled`; toggling `+0x08` is the first-person <-> cinematic switch.\n\nVtable slot map (byte offsets): `+0x00` scalar-deleting dtor (`vtbl[0](1)` on\ndead nodes), `+0x04` per-frame prep, `+0x08` ensure engine resources, `+0x0c`\n`IsVisible()->bool` (cull), `+0x10` draw (`geActor_Render` /\n`Camera::Draw -> geEngine_RenderWorld`), `+0x14` destroy actor, `+0x18` apply\npose+scale.\n\n## Per-frame (`ROCRender::RenderFrame`)\nPick `activeRes` -> `ProcessPendingAdds` -> walk `renderNodeList` calling\n`vtbl+0x04` (prep) then `vtbl+0x0c` (cull -> push to a visible list), and\n`vtbl+0x00(1)` on any dead node. Then depth-sort the visible list, read the\nfar-clip from the active `geCamera`, `geEngine_BeginFrame`, call `vtbl+0x10`\n(draw) per visible node, draw the HUD (`FUN_00427f00`) and console,\n`geEngine_EndFrame`. `WorldToScreen` = `geCamera_Transform` +\n`geCamera_Project`; there is no `ScreenToWorld` (the goggles unproject\nthemselves).\n\n## Debug draw\n**No batched `DrawLine`/`DrawSphere`/`DrawBox` API exists.** Just\n`RenderManager::DrawDebugQuad` (one 2D `geEngine_RenderPoly`, used only for the\nsafe-area / letterbox frames), `Gfx_DrawTube3D` (a 4-facet immediate-poly\ntube, used only by the goggles highlight and the hose stream FX), and a\n`Ray::ToString` / `Sphere::ToString` text family for the geometry kit. `DBG_*`\ncvars feed the 2D HUD text layer, not a 3D drawer.\n\n## Collision wrappers\n`roc_SweepWorldBox` / `roc_SegmentClearLOS` (+ its active-world 3-arg form,\nused by the RescueBot/victim reachability probes) / `roc_SegmentInSolid` -\nthin pickers over Genesis3D `geWorld_Collision` / `geWorld_GetContents`.\n\n## Path\n`Path` is a **Catmull-Rom spline** with an arc-length resample table, shared by\n`PlayerHose` (`HosePathPoint`), the `FireRescueEnt` path-crawl, and truck/\ncamera rails. Build it `Begin -> AddPoint(pos, aux, scalar) x N -> Finalize`\n(cubic Hermite, wraps indices when closed). Each control point carries a\n**secondary `aux` vec3 channel** (look-dir / up / speed at that node);\n`Path::EvalAt(t)` returns the interpolated position *and* the arc-length-lerped\n`aux`, plus a \"segment changed since last call\" edge flag.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"animation","title":"Skeletal animation (ActorAnimator) and the transform movers","subsystem":"basic","body":"## Two motion-playback paths - neither is a state->name table\n1. **`AnimSeqPlayer` / `ActorAnimator`** (`basic\\ActorAnimator.cpp`) - a thin\n   **time-derived** wrapper over `geActor_SetPose`, **no per-frame clock, no\n   blending, no event track**. `ApplyPose` (0x00480d50) recomputes\n   `t = ((now - startMs) mod period) * rate * 0.001 + startExtent` each frame.\n   `PlayMotionByIndex` (0x00480ea0, Ghidra-misnamed `PlayRandom`) is the only\n   \"play\" entry and addresses motions **purely by ordinal index** into the\n   model's own `geMotion` list - no names. Fields `+0x34..+0x4c` are a\n   stubbed blend path nothing reads.\n2. **`RenderInstance::SetMotionByName`** (0x004927d0) <- `EntityCam::\n   SetMotionByName` (0x004982c0), resolving via a `geActor_GetMotionByName`\n   wrapper. This is the **by-string** path, and it has only **four call sites\n   in the whole binary**: the hose first-person viewmodel (`\"sprint\"` /\n   `\"spraylr\"`), the `PropModelEnt` `setmotion <name>` verb, and the scripted\n   camera entities.\n\n**The player has no animation-selection layer at all** - no motion-name\ntable, no index table, no state->anim switch. The player is first-person; its\nvisible motion is the FP tool model, driven by hard-coded strings in each\ntool's own code (only the hose does this). `PlayerRescueEnt::Init` instead\nsubscribes an *inbound* event table (`Jump`, `LandingImpact`, `Breathe`,\n`OxyRelease`, `PassOut_O2`, `PassOut_Fire`, `GrabItem`, `ValveHookUp`,\n`ThrowObject`, `ActionFailed`, `FootStep1..4`) that maps anim/game **events ->\nsound/gameplay** responses. `PassOut` plays only a sound + `RC_PassOut`, no\nbody animation. Victim motion is ordinal-only (the \"herodown\" firefighter\nmodel is discriminated by `motionCount == 6`); the victim `playanim` script\nverb is a hard `UNIMPL` stub. **No crossfade/blend code exists anywhere.**\n\n## Keyframed \"events\" - there is no pub/sub (cycle-9 question, closed)\nThere is **no `MessageBus`, no broadcaster, no topic registry**. Every\ngameplay/anim \"notify\" sound is played **directly by pointer** from the\nowning object's own per-frame state machine:\n`SoundCue::Play(this + <fixed cue offset>)`. `MessageSink::Subscribe`\n(`0x004a12f0`, the `/OPT:ICF` fold) only binds a `SoundCue`'s FMOD\nsample-bank key (stored at `cue+0x20`, resolved lazily by\n`ROCSoundSystem::Play`) and parks the cue in the ROCSoundSystem array for\n3D/lifetime housekeeping. The four axe event strings each have exactly one\nxref - the `Subscribe` call in `AxeSwing::OnEquip` - and are never handed to\na dispatcher.\n\nThe axe hit sound is a **collision result**: `AxeSwing::ResolveHit`\n(`0x00460b90`) runs an 8-unit sphere overlap against breakable world\nentities (tag `+0x18 == 4`) and a per-entity material classifier\n(`BreakableEnt::GetMaterialFlags`) whose bit flags pick `\"WoodDoorBreak\"` /\n`\"AxeHitWood\"` / `\"AxeHitOther\"`. Extinguisher/hose spray-start/stop play\ntheir embedded cues by offset, gated on a state flag. Footsteps use a byte\nflag at `PlayerRescueEnt+0x198`, set by the anim update and polled each\nframe in `Think` â†’ `PlayerRescueEnt::DoFootstep` (random `FootStep1..4`,\n100 ms debounce). `XFormAnimMover` has no keyframe-notify table, so an\nanim-time table is ruled out too.\n\n## XFormAnimMover\nA separate class (ctor 0x00483b00) that eases a transform offset toward a\nmotion-sampled pose, with threshold and damped modes (`+0x6c` bits) and\nsnap/overshoot flags. Two uses:\n- **Tool deploy anim** - `Tool+0x15c`; slides a deployed tool smoothly into\n  place.\n- **The view mount** - `PlayerRescueEnt+0x34a4`. `Init` binds its sample source\n  to the first-person `EntityCam` at `+0x3460`, so it republishes a *smoothed*\n  first-person view pose. The carried tools and `CamRescueEnt` both follow\n  `player+0x34a4`.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"particles","title":"The particle / effect system","subsystem":"basic","body":"Three classes, all drawing as engine polys (`geWorld_AddPolyOnce`, BSP-culled\nvia `geWorld_GetLeaf`/`MightSeeLeaf`) rather than a custom rasteriser.\n\n- **`ParticlePool`** (ctor 0x00480260) - an `SArray` of particles + the\n  RenderManager hookup. `+0x28` RenderManager, `+0x2c` prototype node,\n  `+0x30` cap (`-1` = unbounded).\n- **`ParticleSystem`** (ctor 0x004804f0, 0x84 bytes) - a pool plus the emitter\n  param block `+0x34..+0x80`: burst count min/max, interval min/max, initial\n  velocity box, lifetime min/max, size min/max, constant world acceleration,\n  texture id.\n- **`ParticleEmitter`** (ctor 0x0047f850, 0x168 bytes) - the *individual\n  particle*, extending `ParticleNode`. `+0x5c` world pos, `+0x7c` velocity,\n  `+0x88` acceleration, `+0x94` per-axis damping, `+0x30` alive byte,\n  `+0xd8` the `GE_LVertex` quad buffer.\n\n## Emission\n`ParticleSystem::Emit` (0x00480090) is **the engine-wide \"spawn effect\" call**\n(9+ callers). Time-gated unless forced. Samples a count, then per particle\nsamples a velocity in the box, rotates it to world, `AllocParticle`s at the\nowner origin, and sets accel = the constant world vector, damping =\n`(|vx|, 0, |vz|)` (horizontal self-damps, vertical rises -> a spreading\nplume), size/life from the ranges. All particles spawn at a *point* - spread\nis purely velocity.\n\n## Update\nPer frame the RenderManager calls `ParticlePool` vtable slot 1\n(`TickAndRenderParticles`), which both integrates (semi-implicit Euler +\ndamping) and draws each particle. `flags & 8` on a particle makes it one-shot\n(freed when its colour ramp wraps).\n\n## Decals\n**There is no decal pool.** Foam / scorch / wet marks are a *single persistent\n`ParticleNode` per tool* repositioned onto the collision hit surface each frame\nand faded by the same colour/alpha ramp as any particle. Direct spawners that\nbypass `Emit`: `HoseGfx::RebuildGeometry` (water spray on stream collision),\n`Fire::EmitEmbers` (rising sparks).","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"hose-minigame","title":"The on-rails hose mini-game (PlayerHose)","subsystem":"hose","body":"A separate game mode: the player mans a hose on a truck that auto-drives a\nroute, dousing building fires against a timer.\n\nBoot: the `loadhosemap` world verb -> `RequestLevelChange(...,\n\"data\\resdefs\\hose.rrf\")`. `PlayerHose` (`RCS_PlayerHose`, 0x1a88 bytes, base\n`ModelEntity`, embedded `ScriptActor` named \"Player\") - no hose-specific script\nverbs; the level drives it with ordinary `tell player ...`.\n\n## State machine (`this+0x18C`)\n- **3 - Advance.** Truck auto-drives a closed Catmull spline at a constant\n  **500 u/s** (`Think_Advance` / `BuildSplinePath` from a `HosePathPoint`\n  linked list). Z clamped to ground + 32 via a down-ray. On passing a hotspot\n  anchor: snap the spline param, `\"RC_HoseLvlStart\"` (first only), register a\n  `\"Hotspot N\"` PlayerStat, freeze -> state 5.\n- **5 - PrimeStream.** Wait for `HoseGfx` to prime, then activate the hotspot,\n  copy the timer budget -> state 4.\n- **4 - AtHotspot.** The douse fight (see below).\n- **6 - GameOver.** Frozen; only `UpdateAimAndSpray` runs.\n\n## The key mechanic - it is \"survive the timer\"\n`Think_AtHotspot` calls `Hotspot::AdvanceActiveFire` **unconditionally every\nframe** - not gated on aim or on holding fire. It round-robins the hotspot's\nchild `RCS_WindowFire` list, each step -> `WindowFire::BeginDouse` (its only\ncaller); `WindowFire::Think` counts that fire down by `dt / block+0x08` sec;\nwhen the index wraps, the hotspot's passes-remaining (`+0x20`) decrements.\nSo a hotspot **always extinguishes on a fixed schedule** regardless of player\ninput. Aiming (`STEER_PITCH`/`YAW`) and `MOUSE_LB` drive **only** the visible\n`HoseGfx` stream, splash particles, the spray sound, and the \"spraylr\" anim.\n\nThe player's only job is to survive the per-hotspot countdown `+0x1A7C`\n(budget = `HosePathPoint.def+0x28` sec x difficulty mult **1.8 / 1.3 / 1.0**).\nTimer < 0 -> `LoseLevel` (`entity+0x198 = 2`); last hotspot cleared ->\n`WinLevel` (`entity+0x198 = 1`). The result lives on the entity at `+0x198`\n(**not** `session+0x6ec`) and is polled by `RCS_DouseHose` for the win/lose\nbanner + audio. `CamHoseEnt` is the active chase view; the objective HUD is\nthe `\"Hotspot N\"` stats plus per-window splash sprites.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"save-load","title":"Campaign save/load and stats","subsystem":"main","body":"## Profiles\n`PlayerManager` (`session+0x6cc`) has **6 fixed slots** -> `saves\\playerN.rb`\n(BluelAPI RichBinary node tree, root `\"root\"` -> `\"Player\"`).\n`LoadAllProfiles` chdir's to `<cwd>\\Saves\\`; a missing slot spawns a default\nprofile (6 colour-coded default names) and saves it immediately.\n`SelectSlot` copies only the **pointer** into the active-profile slot\n(`session+0x6e4`).\n\n`TPlayerInfo` (0x54): `+0x04` furthest level index reached (serialized as\n`\"LevelIndex\"`), `+0x08` last level played (not serialized), `+0x0c` name,\n`+0x14` `SArrayPtr<TLevelScore*>`, `+0x2c` difficulty byte, `+0x30` the\n**live-run** `PlayerStats` map.\n\n`TLevelScore` (0x34): `+0x08` a `PlayerStats` map of best-for-that-level\nfigures, `+0x2c` level name, `+0x30` dirty flag (only dirty records are\nwritten).\n\n## PlayerStats\n**Not a struct** - a case-insensitive string-keyed **AVL tree** of stat nodes\n(node: `+0x00` balance, `+0x04/+0x08` L/R, payload from `+0x0c`, inline name\nkey at `+0x2c`). The schema is registered in code\n(`TPlayerInfo::ResetRunStatsSchema`, 13 keys:\n`Completion Time`, `Bonus Points`, `Rescues`, `Shortest`/`Longest Rescue\nTime`, `Axe Hits`, `Gallons Sprayed`, `Objects Thrown`, `Air Time`, `Fires\nDoused`, `Serious Burns`, `Jumps`, `Total Steps`). Each node: `+0x10` type\n(0 int / 1 mm:ss time / 2 volume), `+0x14` submit rule\n(overwrite / keep-min / keep-max), `+0x18` merge rule (min / max / overwrite),\n`+0x24` value, `+0x28` secondary counter.\n\n## On mission win\n`TPlayerInfo::RecordLevelComplete`: find/create the level's `TLevelScore`,\n`PlayerStats::MergeFrom` the live-run map into it (per-node min/max/overwrite -\nkeeps **best ever**, not a sum), mark it dirty, advance the unlock index,\nand `Save` immediately.\n\n## The results screen has no medal / grade system\n`MenuScreen_LevelResults` and `PlayerRescueEnt::Verb_PrintStats` both call\n`PlayerStats::BuildStatSheetText`, which walks the AVL tree in `displayIndex`\norder and emits one `\"<label>: <value> [/ <ideal>]\"` row per stat (times via\n`Str_FormatTimeHMS`, integers with comma grouping), with blank lines at the\nseparator thresholds. The `betterIf` field is used **only** as the\n`SubmitStat` keep-min / keep-max rule - never to compute a rating. The\nresults screen animates a count-up tally (`\"MenuCountBeep\"` /\n`\"Explodesmall\"` cues) but the number shown is the raw value.\n\n## The `.rb` file format (confirmed end to end)\nBluelAPI RichBinary is a binary named-node tree. Every field carries a\n1-byte type+flags header; the field *name* is a numeric tag id resolved\nthrough the global `RichBinaryTypeRegistry`. Reading is a cursor -\n`RichBinaryReader_Stream::Open` primes it and `TReader_Stream::IterateNode`\nadvances node by node, maintaining a frame stack (`+0x04` stream position,\n`+0x10` field-type enum, `+0x13` payload seek offset). Typed reads\n(`readString`/`readInt`/`readFloat`/... one per enum value 1..12) each\nassert the current node's type equals their constant, else throw a\n`GenErr`. There is **no `FindChildNamed`** - the \"Expected node named\"\ncheck is an inlined macro: `strcmp` the current node name against a literal\nand throw on mismatch. `RichBinaryReader::ReadObject` descends into a named\ncontainer by calling the child object's `ReadBlock`.\n\nThe save schema:\n```\nroot\n â”” Player\n     â”œ Name            : string\n     â”œ LevelIndex      : int      (furthest level unlocked)\n     â”œ DifficultyLevel : byte\n     â”” Score (0..N, one per level touched)\n         â”œ LevelName : string\n         â”” stats\n             â”” stat (0..M)\n                 â”œ name / internalName\n                 â”œ value / idealValue\n                 â”” updateRule / betterIf / displayIndex\n```\n`TPlayerInfo::LoadFromFile` opens `saves\\playerN.rb`, walks for the\n`\"Player\"` node, and finishes with `RichBinaryVerifier::CheckBalance`;\n`TPlayerInfo::Save` is the mirror. `PlayerStats` is serialized *inside*\nthe save (under `Score/stats`) and is also registered as a reusable\nRichBinary custom-type handler - the same node-walk reads it, there is no\nseparate `.rrf` parser involved here.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"dev-mode","title":"Developer mode - the ImADeveloper cvar / g_devMode","subsystem":"main","body":"`ImADeveloper` is a `[DEBUG]` bool cvar whose target is the single byte\n**`g_devMode` @ 0x00502a78**. It gates a loose bag of developer conveniences\nat **17 read sites**. There is **no in-game, menu, console, command-line,\nregistry or environment path** to it - it is written exactly once, by\n`Config::Load` at startup, and persists (a `Config::Save` round-trips it as\n`true`/`false` but never re-loads it).\n\n## How it is set\n`Config::Load` (0x00426650) walks `g_cvarTable` under the `[DEBUG]` header.\nThe bool store accepts **only the literal strings `true` / `false`**\n(case-sensitive) - `1`, `0`, `yes`, a bare key etc. are skipped with no\nwrite. Absent key -> the `.bss` default **0**. Cfg syntax:\n```\n[DEBUG]\nImADeveloper = true\n```\nSole writer = the byte store at `0x00426c9a` (`MOV byte [EAX],1`) /\n`0x00426cbb` (`MOV byte [ECX],0`). Confirmed by xref + a pointer byte-scan:\n17 reads, 0 other writes, no `set` verb, no key, no registry/env/argv.\n`Rand_Seed(timeGetTime())` runs in `WinMain` *before* `Config::Load`, so\ndevMode has no effect on RNG seeding.\n\n## What it does\n| Feature | Site | Gate type |\n|---|---|---|\n| Skip the 2 intro AVIs (`ActiValue.avi`, `Mekada.avi`) | `WinMain` 0x0042cc5c (`if g_devMode == 0`) | poll (one-shot); **only boot/menu-flow change** |\n| Bind F2-F11 to the `DBG_*` actions | `GameControls::Construct` 0x0043a009 | **the bind** (actions are always *registered*; devMode is the only thing that gives them a key) |\n| Create the **dev console** object (`operator new(0x4A0)` + ctor 0x004277d0 -> `g_devConsole` = `DAT_00502a90` = `MainWindow+0x70`) | `roc_CreateEngineSubsystems` 0x00499361 | poll - without devMode the object is never allocated, so the `` ` ``/`~` toggle, the `ScriptEngine::ExecLine` pipe and `Console::Print`/`WatchPrint` are **all dead**. A retail player cannot open the console by any means. |\n| Route `GenErr` sev-2 messages to the console | `GenErr::Dispatch` 0x004220be / 0x00422121 | poll (also needs `g_devConsole`) |\n| Per-frame FPS/renderstats handler (`Dev_PollStatsToggles` 0x0042a540: polls F2/F3, toggles `geEngine_EnableFrameRateCounter`, prints `%4.2f` FPS top-left) | `GameSession::PumpPendingState` 0x0042aef8 | poll (double-gates F2/F3) |\n| Low-FPS warning sprite (bmp 0x44C) when FPS `< 15` | `RescueHud::Construct` 0x0045792b / `::Update` 0x0045840e | poll |\n| F11 `DBG_CRASH_TEST` (held) -> write `0xDEADBEEF` to `*DAT_00503258` | `ROCRender::RenderFrame` 0x00494688 | poll |\n| **F12 = instant quit** (`PostMessage(WM_CLOSE)`) | `MainWindow::WndProc` 0x00499711 | poll |\n| Engine app-log (`geEngine_EnableAppLog`) | `MainWindow::Init` 0x004999c0 | poll (boot) |\n| Left-Ctrl-at-startup video-mode picker dialog; and the mode-select fallback uses the dialog instead of auto-pick | `MainWindow::Init` 0x00499a1a / 0x00499b2a | poll (boot) |\n| Force the rescue-bot to attempt a rescue now (F6 `DBG_ACTIVATE_RESCUEBOT`) | `RescueBot::Think` 0x00455650 | poll |\n| Skip a hose hotspot (F6 `DBG_SKIP_HOTSPOT`, `WinLevel` on the last) | `PlayerHose::Think_AtHotspot` 0x004674ae | poll |\n\ndevMode does **NOT** change assert severity, the `MessageBoxA` fatal path,\n`int3`, spawns, the mission timer, physics constants, RNG seeding, campaign /\nlevel unlocks, or the title/briefing/slot screens.\n\n## The DBG_* action table\nAll 8 are `RegisterAction`''d unconditionally; the **BindKey** block (F2-F11\nscancodes) is the `if (g_devMode)` at 0x0043a009. No F5/F9/F10.\n\n| Key | Action | Poll site | Poll devMode-gated? | Effect |\n|---|---|---|---|---|\n| F2 | `DBG_TOGGLE_RENDERSTATS` | `Dev_PollStatsToggles` | yes | FPS `%4.2f` text + low-FPS sprite |\n| F3 | `DBG_TOGGLE_FRAMERATE` | `Dev_PollStatsToggles` | yes | `geEngine_EnableFrameRateCounter` toggle |\n| F4 | `DBG_CLOSE_ALL_AREAS` | `TE_BModel::Think` 0x0043dcf2 (undefined fn) | **no** (bind-only) | `TE_BModel::UpdateMapZones(this,0)` -> `geWorld_OpenModel(...,0)` per zone: forces every ticking area/region-divider brush into **closed** BSP state + refreshes MapZone occupancy. Collapses streamed areas. **Not** a fire/exit/win trivializer. |\n| F6 | `DBG_SKIP_HOTSPOT` | `PlayerHose::Think_AtHotspot` 0x004674ae | yes | end current fire hotspot; `WinLevel` if last |\n| F6 | `DBG_ACTIVATE_RESCUEBOT` | `RescueBot::Think` 0x00455659 | yes | arm the bot''s rescue timer to fire immediately |\n| F7 | `DBG_TOGGLE_SPECT` | `PlayerRescueEnt::Think` 0x004525c7 | **no** (bind-only) | `+0x240 = 1` -> noclip (`DepenetrateFromWorld` skipped), gravity 0, speed cap 800, pitch clamp +-45, mission timer pinned >= 120 s + smoke cleared each frame; exit with JUMP |\n| F8 | `DBG_WIN_LEVEL` | `PlayerRescueEnt::Think` 0x0045266d | **no** (bind-only) | `rescued = required - inProgress; UpdateZonesAndWin()` -> instant win on exit-less levels |\n| F11 | `DBG_CRASH_TEST` | `ROCRender::RenderFrame` 0x00494688 | yes | deliberate crash (`0xDEADBEEF` write) |\n\nBecause F4 / F7 / F8 poll unconditionally, a binary **patch** that bound those\nkeys would make them work *without* devMode; F2 / F3 / F6 / F11 would stay\ndead (their polls are inside `if (g_devMode)`).\n\n## The other two `[DEBUG]` bytes (independent of `ImADeveloper`)\n- **`EnableDebugLogging` -> `g_logErrorsToFile` @ 0x00502a79.** `FUN_00421f90`\n  opens `FDNYFirefighter.log`; `GenErr::Dispatch` (0x004220eb / 0x00422177)\n  gates appending each error line. Nothing else.\n- **`SkipMenus` -> @ 0x00502a7a.** `GameSession::ReturnToFrontend` (0x0042de14)\n  auto-fires `frontendScreen->vtbl[+4](0)` on the first 3 frontend ticks\n  (counter `DAT_00502b1c`), skipping the attract/title screens on the way to\n  the main menu. A real, if minor, feature. (An earlier note had these two\n  bytes'' meanings swapped - 0x00502a79 is the *logging* byte, 0x00502a7a is\n  the *menu-skip* byte, confirmed from the `g_cvarTable` records at\n  0x004ff540 / 0x004ff550.)","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"input","title":"Input - GameControls, the action map, DirectInput","subsystem":"main","body":"`GameControls` (`g_gameCtx+0x00`, 0x368 bytes, `main\\IO\\GameControls.cpp`) is\na multiple-inheritance object. Gameplay always talks to the **ActionMap**\nsub-object at `GameControls+0x334` (via `GameCtx_GetActionMap` 0x00499cb0),\nnever to `GameControls` directly.\n\n## Layers\n- `+0x00` vtable - the mouse-look / steering axis source. `GetSteerAxis(idx)`\n  = `-(rawAnalog(idx) * g_mouseLookSensitivity)` (0x004ff480).\n- `+0x08` vtable - the **DirectInputProvider** facade: `IsHeld` / `WasPressed`\n  (edge: cur && !prev) / `WasReleased` / `GetAnalog`, keyed by an integer\n  input code. `Poll` reads keyboard + mouse with buffered `GetDeviceData`.\n- `+0x10` / `+0x328` - two DirectInput8 device wrappers (keyboard = GUID\n  SysKeyboard + `c_dfDIKeyboard`; mouse = SysMouse + `c_dfDIMouse2`, buffer 10).\n  **No joystick/gamepad enumeration anywhere.**\n\nInput codes: `1..0xFF` = DIK scancode; `0x101` ANY_KEY, `0x102`\nANY_MOUSE_BUTTON, `0x103/4/5` mouse L/M/R; analog `0` mouse dX, `1` mouse dY,\n`2` wheel (looks stubbed).\n\n## The action table\nRegistered in `GameControls::Construct`. Digital actions and their defaults:\n`SELECT_AXE` = 1, `SELECT_EXT` = 2, `SELECT_GOGGLES` = 3, `SELECT_HOSE`\n(no key - chosen via the tool's own advertised bind-name);\n`MOVE_FORWARD` = Up/W, `MOVE_BACKWARD` = Down/S, `MOVE_LEFT` = Left/A,\n`MOVE_RIGHT` = Right/D; `ACTION` = mouse LB; `USE` = LShift/RShift/Space;\n`JUMP` = mouse RB; `CROUCH` = C/LCtrl/RCtrl. Analog: `STEER_YAW` / `STEER_PITCH`\n(mouse dX/dY x sensitivity), `MOUSE_X`/`MOUSE_Y`/`MOUSE_WHEEL`. A block of\n`DBG_*` actions on F2-F11 exist only in dev builds (`DBG_TOGGLE_SPECT`,\n`DBG_WIN_LEVEL`, `DBG_SKIP_HOTSPOT`, `DBG_ACTIVATE_RESCUEBOT`, ...).\n\n**There is no rebind path** - all bindings are hard-coded in `Construct`;\nno config/registry/`.cfg` is read (`Construct`'s second arg is dead code).\nThe Options menu has no controls screen, confirming this.\n\n`GameControls::IsHeld/WasPressed/WasReleased(actName)` OR over an action's\nbindings; `GetAxis(actName)` sums the analog contributions.\n\n## Frame-rate behaviour and the buffer-overflow bug\n`GameControls::PollFrame` (0x00439330) drains both device buffers once per\nframe. `DirectInputProvider::DrainMouseBuffer` (0x00437ab0) zeroes the two\ninteger accumulators `GameControls+0x18/+0x1c` (`g_mouseXAccum` /\n`g_mouseYAccum`), then for every buffered `DIMOFS_X/Y` event does\n`accum += dwData` (a **sum** of all relative counts). `Think` then applies\n`yaw += GetAxis(\"STEER_YAW\")` with **no `dt` term**, and\n`GetSteerAxis` = `-MouseSens * (float)accum` (linear). So the total view\nrotation for a given physical mouse motion is **frame-rate independent** -\n*provided every buffered event is delivered*.\n\n**The bug:** the mouse buffer is `DIPROP_BUFFERSIZE = 10` (diagonal motion\nuses 2 slots/report -> ~5 hardware reports). On overflow `GetDeviceData`\nreturns `DI_BUFFEROVERFLOW` (`S_FALSE` = 1); the code only accepts `hr == 0`,\nso overflow takes the error branch (\"Lost sync with mouse\") and **the entire\nframe''s mouse motion is dropped** - the accumulators, just zeroed, are never\nsummed. There is no `GetDeviceState` fallback. A high-poll-rate mouse\n(500-1000 Hz) during a fast flick overflows in 5-10 ms and drops rotation\nframes **even at the 60 FPS cap**; low FPS makes it chronic -> under-rotation,\ntiming-dependent, non-deterministic for a human. Synthetic input injected as\n<=1 event/axis/frame never overflows and is perfectly deterministic.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"gamesession-level-flow","title":"Level loading and the campaign level list","subsystem":"main","body":"## The level list\n`LevelManager` (`session+0x6ac`, a `SArrayPtr<TLevelInfo*>`) is built by\n`LevelManager::LoadLevelDefs` from the **plain-text directive file\n`data\\resdefs\\thegame.lev`** at `GameSession::Init` - *not* a `.rrf`.\nDirectives: `menumusic:`, `level:<id>`, `rrf:<name>`, `title:\"...\"`, `music:`,\n`time:<minutes>` (stored as seconds, default 1200), `mapcoords:<x>,<y>`\n(campaign-map pin). `;` starts a comment.\n\n`TLevelInfo` (0x28 bytes): `+0x00` level id = **the `<id>.bsp` world-file base\nname**; `+0x04` title; `+0x08` `data\\resdefs\\<name>` per-level ROC resource-def;\n`+0x10` par time (sec); `+0x18` sequential index (the `FindByIndex` key);\n`+0x20/+0x24` map-pin coords. There is **no per-level difficulty scaling** - a\nrecurring earlier assumption that turned out unfounded.\n\n## Loading a level\n- **Menu path (synchronous):** `GameSession::LoadLevel` (0x0042ab00,\n  `evergame.cpp` ~245). Sets `session+0x688 = TLevelInfo*`, parses the `.rrf`\n  resource manifest, loads `<id>.bsp` via `World_LoadBSP`, builds the `\"World\"`\n  `EntityCreateStruct` (type 0x2711), flushes the spawn queue. Trace: \"!!--\n  TEverGame: Loading level\".\n\n**`.rrf` vs `.bsp`:** the per-level `data\\resdefs\\<name>.rrf` is a *resource\nmanifest only* - a PRECOMP'd, C-tokenized file declaring exactly five\nresource kinds by integer id: `ROC_MODEL`, `ROC_BITMAP`, `ROC_ALPHA_TEXTURE`,\n`ROC_SOUND_BUFFER2D`, `ROC_SOUND_BUFFER3D`. **No entities, no lights.** The\nGenesis3D **`.bsp` carries the geometry, the light entities, and the full\nentity set with keyvalues**; those entities are enqueued during BSP load and\nspawned through the `EntClassRegistry` / `RegisterClass` factories when\n`LoadLevel` flushes the spawn queue. A BSP entity's `Model: 11` resolves to\nthe `geActorDef` from `ROC_MODEL 11 \"...\"`. See the *resources* article.\n- **In-game deferred path:** `GameSession::RequestLevelChange` (0x0042a260) just\n  sets a pending flag (`session+0x68c`); the main loop performs the load. This\n  is what `tell player finalexitloadmap <map>` uses.\n\n## Campaign flow\nMain menu -> SlotList (pick a profile, `PlayerManager::SelectSlot`) -> Title\nscreen (briefing, level index `+0x2c`) -> **\"Begin Mission\"** ->\n`LevelManager::FindByIndex` -> `MenuManager::TeardownToLoading` -> `LoadLevel`.\nPost-mission: LevelResults -> next Title, or `Data\\Movies\\End.avi` + Credits at\ncampaign end.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"config","title":"Settings persistence (FDNYFirefighter.cfg / cvars)","subsystem":"main","body":"Settings persist to **`FDNYFirefighter.cfg`** - an INI-style text file\n(`[Section]` headers, `;` comments, `key = value` lines, floats as `%4.2f`).\n\nA **cvar registry** (`g_cvarTable` @ `0x004ff4c0`) of 16-byte records\n`{ u32 sectionId, char* name, void* target, u32 typeId }` (typeId 1 = int,\n2 = bool, 3 = float, 5 = string), grouped by four sections\n(`g_cvarSectionTable` @ `0x004ff494`: VIDEO=1, SOUND=2, INPUTSCALE=3,\nDEBUG=4). `Config::Load` (0x00426650) reads the file once at startup, under\nthe matching `[SECTION]` header. A **bool cvar accepts only the literal\nstrings `true` / `false`** (case-sensitive) - `1`, `0`, `yes`, a bare key,\netc. are silently skipped, leaving the target at its `.bss` default (0).\n\n| Section | cvars |\n|---|---|\n| `VIDEO` | `Driver` (Genesis3D display-driver index), `Mode` (resolution/mode index; default 640x480), `Gamma` (the Options \"Brightness\" slider; pushed live to `geEngine_SetGamma`) |\n| `SOUND` | `SfxVolume`, `MusicVolume` (routed through `GameSession::SetSfx/MusicVolume`) |\n| `INPUTSCALE` | `MouseSens` (default 0.1, the only live mouse-look scale - linear, no accel curve), `MouseExc` (default 1) - **a DEAD cvar: config parsing writes `0x004ff484` but zero code reads it; it is NOT wired to `DISCL_EXCLUSIVE` (coop level is hardcoded) and is not a second scale**) |\n| `DEBUG` | Three independent bytes: **`ImADeveloper` -> `g_devMode` @ 0x00502a78** (see the `dev-mode` article - enables the F2-F11 `DBG_*` binds incl. F7 spectator-fly + F8 win-level, creates the dev console object, skips the two intro AVIs; does NOT touch spawns / timer / physics / RNG / menu flow); **`EnableDebugLogging` -> 0x00502a79** (`g_logErrorsToFile` - opens `FDNYFirefighter.log` and gates every error-line append; readers in `GenErr::Dispatch` + `FUN_00421f90`); **`SkipMenus` -> 0x00502a7a** (a REAL feature - `GameSession::ReturnToFrontend` 0x0042de14 auto-fires the default action on the first 3 frontend screen ticks, blowing past the attract/title screens; independent of `ImADeveloper`). |\n\n`Config::Save` (0x004262e0) rewrites the file on leaving the Options menu\nwith OK (and twice from `WinMain`); it never re-reads, so nothing changes a\nlive cvar after startup. **There is no `[CONTROLS]` / key-binding section** -\nkey bindings are hard-coded, no rebind path (see the *input* article). The\nOptions menu''s driver/resolution changes go through a video-reinit confirm\n(`MenuScreen_VideoConfirm`).","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"menus","title":"The menu / UI layer","subsystem":"main","body":"`MenuManager` owns a stack of `MenuScreen` objects; each screen holds a list of\n`MenuWidget`s.\n\n## Widgets\n`MenuWidget` base (ctor 0x004357d0, vtable 0x004e0780): `+0x04` command id,\n`+0x08..+0x14` LTRB bounds, `+0x18` owner screen, `+0x1c` enabled.\n`vtable[0]` Draw, `vtable[4]` `OnClick` -> `owner->OnButtonActivate(commandId)`.\nSubclasses: `ImageButton`, `ImageButtonGlow`, `ListRow`, `Slider`,\n`OptionCycler`. `MenuManager` subscribes mouse-down/click/up sinks that\nhit-test the active screen's widgets.\n\n## Screens\n`MenuScreen` base vtable `0x004e0840`: `[0]` OnActivate(bool), `[1]`\nOnButtonActivate(int), `[2]` OnSliderChanged(int,float), `[3]` Draw.\n- **Title** (idx 2) - the mission briefing / level select; \"Begin Mission\"\n  (id 0) starts the level.\n- **SlotList** - profile picker (`PlayerManager::SelectSlot`); ids 6-11 prompt\n  \"Reset <name>'s career?\".\n- **Options** - sliders write live to cvars: brightness -> `geEngine_SetGamma`,\n  sfx/music -> `GameSession::SetSfx/MusicVolume`; `Config::Save` on leave.\n  Driver/resolution are `OptionCycler`s read on Apply; a change ->\n  `PromptVideoReinit` -> `MenuScreen_VideoConfirm` -> `ReinitVideo`. **No\n  controls-rebind screen.**\n- **LevelResults** (idx 5) - post-mission stat tally (UI/animation only; it\n  reads the just-merged `TLevelScore` map). \"Continue\" -> next Title, or\n  `End.avi` + Credits at campaign end.\n- **List** (idx 4) - a read-only mission-records / stats browser, *not* level\n  select.\n\nThe full campaign entry path is described in the \"Level loading\" article.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"frame-loop","title":"The per-frame loop","subsystem":"main","body":"`MainWindow::RunMessageLoop` (0x00499410) is a `PeekMessage` idle loop. Each idle\nframe it calls the game object's vtable slot `+0x74` then `+0xA0`.\n\nThe world tick + render is reached through `EverGame` (the GUI-tree root) vtable\nslot `+0x60` -> **`GameSession::PumpPendingState`** (0x0042aea0), which every\nframe runs:\n- **`GameSession::TickSubsystems`** (0x00429520) - entity/world simulation.\n- **`ROCRender::RenderFrame`** (0x00494670) - walks the RenderManager\n  render-instance list; per entry calls a *renderable* interface (slot 4 prep,\n  slot 0xc cull predicate, slot 0x10 draw). `geEngine_BeginFrame` /\n  `geEngine_RenderWorld` / `EndFrame` wrap it.\n\nThere is **no separate `TickSubsystems` path for particles** - the particle\npools are registered renderables and get ticked+drawn by the RenderManager\ncalling their vtable slot 1.\n\n`EverGame`'s `+0x7c` child list is UI-only (menu screens, console); there is no\nseparate \"3D view widget\". Physics uses a fixed timestep `g_frameDeltaTime`\n(0x00502b04).\n\n`PumpPendingState` also polls `session+0x6ec` (the rescue level-result flag):\n`1` -> `TPlayerInfo::RecordLevelComplete` + LevelResults screen; `2` -> fail\nscreen.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"mission-win-lose","title":"How a rescue mission is won or lost","subsystem":"rescue","body":"Everything lives on `PlayerRescueEnt`. `+0x3438` = mission result\n(0 active / 1 win / 2 lose). `FrameUpdate` ticks gameplay only while it is 0;\n`RescueHud::Update` consumes it (win -> audio state 3 + `\"RC_ResLvlWin\"` +\nscore handoff `FUN_004295b0`; lose -> `\"RC_ResLvlLose\"` + failure panel).\n\n## Win\nTwo routes:\n1. `tell player finalexit` (`Verb_FinalExit` 0x00450a00) - gated: `outstanding\n   = +0x3528(total rescuable, lazily counted by EndMission) - +0x3530(lost) -\n   +0x352c(delivered)` must be **strictly 0** (`== 0`, not `<= 0`), else it\n   shows \"N survivors remain\" for 7 s and does nothing. `Verb_FinalExit` has\n   **no positional check whatsoever** - it wins from any position (mid-air,\n   inside geometry) the instant the count is satisfied. `+0x3530` (lost) is\n   dead: victims have no death state, nothing writes it, so `outstanding`\n   reduces to `total - delivered`. Over-delivering (`delivered > total`) makes\n   `outstanding` negative -> gate **fails** -> SOFTLOCK, not a skip.\n2. `PlayerRescueEnt::UpdateZonesAndWin` (0x004504c0) - automatic. Its gate is\n   `delivered >= total - lost` (**`>=`**, unlike the script verb''s strict\n   `==`). Only then: if the level has **no** final-exit `BoundsTrigger`\n   volume (kind 8) it wins immediately (`+0x3438 = 1` + `OnLevelWon`);\n   otherwise it credits the victims, opens the exit boxes and shows the\n   \"exit through: ...\" HUD text - no win until an exit volume is touched.\n   It is **victim-gated** and independent of fire (`MapZone`s track victims,\n   never fire).\n\nRescuing all victims does **not** itself win - you must then reach an exit\n(or a script calls `finalexit`).\n\n## The escape-verb delivery skip (speedrun)\n`Verb_Escape` (0x004513a0) tail-calls `DeliverCarriedSurvivor` (0x00451160,\nGhidra-misnamed `TeleportToCheckpoint`) **unconditionally**. That helper''s\nonly gate is `+0x3534 != 0` (\"am I carrying a victim\"); it then does\n`+0x352c += 1`, `PlayerStats \"Rescues\" += 1`, `WarpToRescuerAndFade`, clears\nthe carry, `UpdateZonesAndWin`. **No zone, ground, or distance check.** The\n`onGround && +0x3450 > 0.5` test inside `Verb_Escape` gates only the\ncheckpoint-position *snapshot* (`+0x3434` there is the player yaw being\nsaved, not a gate). Pickup is automatic on AABB overlap. So: walk over each\nvictim, `escape` from anywhere, repeat until `delivered == total`, then one\n`finalexit` from any position = full \"rescue all + walk to exit\" skip.\nReachability: `escape` / `finalexit` / `climb` all sit in the same\n`OnScriptCommand` (0x00451870) `stricmp` chain with no extra gating -\nusable from any level script, and from the dev console when `g_devMode` is\non. `DBG_WIN_LEVEL` (F8, dev builds) does the same counter-force + win\ncheck in one keypress. See `speedrun-tech`.\n\n## Map transition\nOnly `tell player finalexitloadmap <map>` -> `GameSession::RequestLevelChange`\n(with `data\\resdefs\\rescue.rrf`).\n\n## Lose\n`+0x3438 = 2` is set on the timeout / death path, never by a verb. (The live\nmission-timer scalar is **`PlayerRescueEnt+0x32fc`** (float seconds),\ndecremented `-= g_frameDeltaTime` once per `Think` frame; `< 0` sets\n`+0x32f8 = 2` = lose. The old `+0x343c` annotation was wrong - that field is\n`activeToolIndex`. Three 2026-08-29 analyses concur.) The countdown **is not\npaused by the in-game ESC menu** - `TickSubsystems` has no pause gate, so\n`Think` keeps decrementing it in real time behind the menu. It *is* frozen by\nalt-tab and by a fullscreen movie (no frames run), and a level load costs it\nat most 0.1 s (the `dt` clamp). No script verb scales it - `settimescale` /\n`addtimecmd` act only on one `ScriptedBModelEnt`''s own sequence clock.\n- **Mission timer** = `(TLevelInfo par time or 600 s) x difficulty`\n  (idx 0/1 -> 1.5, idx 2 -> 1.0); a `RC_ResTimeWarn` fires at **30 s**\n  remaining; hitting 0 -> `RC_ResLvlLose`. This is the *only* true level loss.\n- **O2** `+0x3450` drains -0.05 per 3000 ms (~60 s empty, difficulty-\n  independent) -> `PassOut(0)`; a boosted refill adds `dt x 0.1` (~10 s); the\n  low-air warning flag trips at O2 `< 0.8`.\n- **Burn** `+0x3538` accrues `dt x 1.2 x severity` from fire message 0x7531\n  (`> 1.0` -> `PassOut(1)`); `RC_Pain` has a `1000..2500 ms` random cooldown\n  and bumps the `Serious Burns` stat.\n- `PassOut` -> ~4 s fade -> `Verb_Reset` respawn at the rolling checkpoint\n  `+0x3400` (**not** a loss). There is no HP scalar.\n`quit` (the script verb) closes the application entirely.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"movement-tech","title":"Movement tech - jump-height determinism and speed-exploit analysis","subsystem":"rescue","body":"A targeted two-analyst pass on \"can the player break the movement model\" -\njump-height variance, the diagonal-speed bug, strafe-jumping, bunnyhopping,\naccidental double-jumps, wall/ramp tricks. See `player-movement` for the\nfull pipeline; this article is just the verdicts and why.\n\n## Is jump height deterministic?\n**Yes for a fixed frame rate, with bounded deviations.** Standing on flat\nground, no equipped-tool constraint, no script push: vy is driven to ~0 by\nthe previous frame''s ground-clip, `Verb_Jump` adds exactly +400, gravity is\nexactly -1000, and the 500 ms cooldown makes cadence identical too. But the\n**apex height is frame-rate dependent** - the integration is\n`disp = v*dt + 0.5*a*dt^2` after `v += a*dt`, i.e. an effective\n`v0*T - 500*T^2 - 1000*T*dt`, so lower FPS = lower, shorter jumps:\n\n| FPS (dt) | apex | air time | horiz. jump dist @ 400 u/s |\n| --- | --- | --- | --- |\n| dt -> 0 (cap patched out) | **80.0 u** | 0.800 s | 320 u |\n| 60 (0.0167, the stock cap) | **73.3 u** | 0.767 s | 307 u |\n| 30 (0.0333) | 66.7 u | 0.733 s | 293 u |\n| 20 (0.0500) | 60.0 u | 0.700 s | 280 u |\n| 10 (0.1000) | **40.0 u** | 0.600 s | 240 u |\n\nTime-to-apex stays ~0.40 s. Horizontal **top speed** is FPS-independent\n(the `t = frac^(27*dt)` blend has a dt-independent fixed point = wishspeed);\nonly jump apex / air time / total jump distance scale with FPS. So removing\nthe `Sleep(1)` 60 FPS cap in `GameClock::ComputeFrameDelta` (0x0042bf70) is\na real, deterministic speedrun lever - it makes jumps ~9% higher and ~4%\nlonger, asymptoting at the dt->0 row. See `speedrun-tech`.\n\nOther inputs that perturb the apex:\n- **Frame time** (above). Alt-tab is excluded - the clock pauses on focus\n  loss. The swept collision trace still prevents tunnelling through a\n  ceiling even on a 0.1 s frame.\n- **Standing on a slope** (up to the 60deg walkable limit) at takeoff. The\n  ground-clip removes only the into-surface velocity component, so the\n  retained tangential velocity has a vertical part: running **uphill** adds\n  to the +400 (higher jump), **downhill** subtracts (lower jump). This is\n  the single largest real source of variance.\n- **`Verb_Push` / script `\"push x y z\"`** on the takeoff frame writes the\n  one-frame external-accel channel `+0x5b8`; `Think` applies\n  `vel += push*dt` right before integration, so `push 0 N 0` tunes jump\n  height. Normally zero - level-script only.\n- **Equipped-tool constraint plane** - the tool loop in `Think` can clip vy\n  the same frame before `Verb_Jump`.\n- **Ladder jump** SETS vy = 400 (not additive) and its first frame(s) run\n  with gravity still 0, so the state 5->3 transition timing shifts it.\n- **Apparent only** (viewpoint, not body): landing camera kick (`-vel/24`),\n  `ViewRhythm` head-sway, eye-height offset.\n\n**Not** perturbing factors, explicitly: moving platforms never add their\nvelocity to the player (positional depenetration only - you ride them by\nposition and jump off with a normal +400); crouch never changes the impulse,\ncooldown, or ground-trace origin (it only shrinks AABB max.Y, and you\ncan''t duck in mid-air); low frame rate never leaks a second jump.\n\n## Speed / momentum exploits\n| Trick | Verdict | Why |\n| --- | --- | --- |\n| **Diagonal-speed bug** | **absent** | `if (mag > 1) normalize` is conditional and applied to the wish vector *before* the speed scale. Forward=1.0, strafe=0.75 -> every forward+strafe combo has `mag >= 1.25` and is normalized back to unit -> diagonal speed == pure-forward speed == 400. Pure strafe (mag 0.75, not > 1) is *not* normalized -> 300 (0.75x), i.e. slower, never faster. |\n| **View-angle (pitch) momentum** | **absent** | The move vector is rotated by a **yaw-only** basis; pitch is routed solely to the camera. And `vel.y` is saved/restored around the blend. Looking up or down cannot change ground speed. |\n| **Strafe-jumping / air-accel by turning** | **absent** | The velocity blend is a convex LERP `wishvel*(1-t) + vel*t` toward a pre-normalized `wishvel <= wishspeed`. There is **no `dot(vel, wishdir)` projection term** (the Quake air-accel primitive). Turning mid-air only rotates the target; `|vel|` stays inside the convex hull of the two vectors, bounded by `max(takeoff speed, wishspeed)`. It can never grow. |\n| **Bunnyhopping (speed build across hops)** | **absent** | Jump adds only vertical velocity. Airborne drag is 0 on all axes, so you *carry* ~400 horizontal between hops (it *feels* like a bhop) - but the mandatory 500 ms cooldown forces ~30 grounded frames, and each ground frame''s `drag = 1000` + `frac = 0.2` blend resets horizontal speed to `<= wishspeed` within 2-3 frames. You can maintain run speed by hopping; you can never exceed it. |\n| **Wall-strafe / air-surf** | **marginal** | `ClipVelocityToPlanes` is a pure projection `v -= dot(v,n)*n` with **no restitution and no friction coefficient** - tangential speed is 100% preserved when sliding a wall, and a steep surface (`normal.Y < 0.5`) keeps you airborne with zero drag, so a fast approach is redirected along the plane with speed intact. But no acceleration is layered on top, and FDNY''s maps (buildings, floors, stairs) contain no >60deg ramp brushes to exploit. |\n| **Down-ramp boost** | **absent** | The ground clamp is the same projection - it *removes* the downward component, it does not rotate it into horizontal speed. Any brief downhill slide is bounded by fall speed and bled off by `drag = 1000` in under half a second. |\n| **Scripted-freeze slide** | **exists, by design, low impact** | The input-move-freeze flag `+0x345c` blanks only the wish vector; gravity, drag, integration and `pos += disp` keep running. A freeze applied while the player is moving preserves the slide/glide momentum (indefinitely while airborne, since airborne drag is 0) until collision or landing. It is non-cancellation of momentum, not a speed gain. |\n\n## The one mechanic that makes it *feel* fast\nAirborne, the per-axis drag vector is `(0,0,0)` - selected by a grounded-flag\ngate. So horizontal speed is perfectly conserved in the air (only gravity\nacts, on Y). Combined with the `frac = 0.95` airborne blend (almost no air\ncontrol) the game has a floaty, momentum-preserving jump arc that reads like\nsource-engine air movement - but with no acceleration primitive anywhere in\nthe path, none of it compounds.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"player-movement","title":"Player locomotion and control","subsystem":"rescue","body":"`PlayerRescueEnt::Think` (0x00452570) runs as the ScriptActor sub-object's\nper-frame think. State field `entity+0x18c`: **3 standing/airborne,\n4 crouched**, 5 climbing, 6 passed-out, 7 throwing an object.\n\n## Look & move\n`GetAxis(\"STEER_YAW\"/\"STEER_PITCH\")` accumulate into yaw `+0x32f4` / pitch\n`+0x32f0` (pitch clamped **+-20 / +-40 / +-70** by difficulty index 0/1/2;\nclimbing or spectator clamps to +-45; both wrap at +-360). Wish vector, gated\nby the input-move-freeze flag `+0x345c`: `MOVE_FORWARD/BACKWARD` -> local\nZ +-1.0, `MOVE_LEFT/RIGHT` -> local X +-0.75; local Y stays 0.\n**`if (mag > 1) normalize`** (conditional, strict `>`), then rotate to world\nby a **yaw-only** basis (`Xform_BuildYawBasis` 0x004968b0 takes only the yaw\nscalar - pitch never enters the move vector; it goes only to\n`EntityCam::PitchBy`). Climbing/spectator use a separate basis at `+0x3320`.\n\nThe rotated unit wish is scaled by the per-state **speed target 400 standing\n/ 260 crouched (state 4) / 800 spectator** to form `wishvel`, then blended\ninto horizontal velocity by `Vec3_DampToward` (0x00482fc0):\n`t = frac^(27*dt)` (a true dt-corrected exponential via `pow`, so\nframe-rate independent) where `t` is the **fraction of current velocity\nretained** and `(1-t)` the fraction of `wishvel` adopted. `frac` (from\n`Damp_RateFromFraction` 0x00482ad0, whose decompiled C is wrong - real\nformula `rate = -ln2 / (27 * ln frac)`): **0.2 grounded / climbing /\nspectator** (snappy - adopts most of wishvel per frame), **0.95 airborne**\n(only ~2-5%/frame - momentum kept, almost no air control). `vel.y` is saved\nbefore the blend and restored after, so **the blend is horizontal-only** in\nnormal play. With no move key held the blend is skipped entirely and\nvelocity is left untouched.\n\n**Per-axis linear drag** (`IntegrateVelocity`, `moveToward(v,0,drag*dt)`):\n`(1000,1000,1000)` climbing/spectator; **`(0,0,0)` airborne** (no drag at\nall - horizontal air speed is fully conserved); `(1000,0,1000)` grounded.\nGravity accel Y = **-1000** (0 climbing/spectator), written every frame.\n\n**Jump** (`Verb_Jump` 0x0044e990): grounded path `vy += 400` (**additive** -\nvy is not zeroed first, though the prior frame's ground-clip drives it to\n~0 on flat ground); ladder path (state 5) `vy = 400` (**set**), skips the\nground check, runs with gravity briefly 0. **500 ms** cooldown = last-jump\nms timestamp `+0x388` vs `g_gameTimeMs`, stamped *after* the gate passes,\n**never cleared on landing**; the handler uses `IsHeld` so holding JUMP\nauto-rejumps at a hard 500 ms floor. No accidental double-jump at low FPS\n(single `Verb_Jump` per frame, stamp precedes return). One \"coyote\" frame:\n`Verb_Jump` reads the *previous* frame's grounded result. Max walkable slope\n**60deg** (`contact normal.Y >= 0.5`).\n\n**Per-frame dt** (`g_frameDeltaTime` 0x00502b04 = `g_gameClock`+0x4c, clock\nstruct at 0x00502ab8) is computed once per render frame in\n`GameClock::ComputeFrameDelta` (0x0042bf70) and **clamped to\n`[1/60 s, 0.1 s]`** - a `Sleep(1)` busy-wait caps at 60 FPS, a hard\n`dt = 0.1` clamps anything below 10 FPS. Integration is one semi-implicit\nEuler step per frame (`disp = v*dt + 0.5*a*dt^2`), no sub-stepping, so the\njump apex drifts a few units across that dt range. Alt-tab does **not**\nspike dt: `WM_ACTIVATEAPP` pauses the clock (`GameClock::Pause` 0x0042bf20).\n\nLanding impact at fall vel `< -200` (camera kick magnitude `-vel / 24`,\n`ViewRhythm` only - does not touch body velocity/position).\n\n## Climb (state 5) - there is no ladder system\n`Verb_Climb` (0x0044c0b0) sets locomotion state 5 and zeroes velocity. Its\nguard is `state != 5 && +0x3300 == 0` where **`+0x3300` is the carried/thrown\nobject pointer, not an \"on-ladder\" flag** - the game has **no ladder\nsubsystem at all** (zero `ladder` strings, no ladder entity, `Verb_Climb` is\nthe only climb code). So `climb` succeeds from open, empty-handed ground.\n\nIn state 5 `Think` treats the player almost like spectator: **gravity 0**;\nthe wish vector is rotated by the **full 3-D basis at `+0x3320` (yaw *and*\npitch)** so look-up + `MOVE_FORWARD` produces a `+Y` wish; `vel.Y` is **not**\nsaved/restored around the blend (unlike states 3/4) so the vertical wish\ndrives `vel.Y`; speed cap stays **400**; blend fraction 0.2 (snappy).\n`DepenetrateFromWorld` **still runs** (only spectator skips it), so you fly\nthrough open space but hard-stop on walls/floors/ceilings. Nothing forces\nstate 5 -> 3/4: no leash, no anchor, no max height, no timeout, no per-frame\nrecheck. Exits: `unclimb` (state -> 3), `reset`, or **JUMP** (ladder-jump\npath: state -> 3, `vel.Y = 400` SET -> launched up ~73u, subject to the\n500 ms cooldown). Net: `climb` is a persistent zero-g fly with full vertical\ncontrol - see `speedrun-tech`. The only limit is that invoking it needs a\nlevel script or the dev console; no retail key binds to it.\n\nStand AABB = `min(-30,-30,-30) max(30, 85, 30)`. **`Crouch` sets max.Y to 85\nafter a headroom trace and puts the state at 3; `UnCrouch` sets it to 25 and\nstate 4** - the two function names are swapped in the binary, so *standing*\nis ~85 tall and *crouched* is ~25.\n\n## Collision\nThe \"player capsule vs world\" test is **the engine, not custom code** -\nGenesis3D `geWorld_Collision` (contents mask 1, collide flags 2), wrapped by\n`World::TraceGroundHeight` for the vertical ground probe (only the impact Y is\nread back). `ModelEntity::DepenetrateFromWorld` and `ROCRender::TraceToFloor`\n(a 7-arg LOS/walk trace) are the other entry points. Then: platform /\nplane-slide vs a contact `SArray`, `IntegrateVelocity`, `pos += displacement`.\nThe `0x00483xxx` geometry kit (sphere/sphere, swept segment/sphere,\nray/sphere, segment/AABB slab, Vec3 helpers) is generic engine math shared\nwith the hose code; the critically-damped `Damp` / `CriticalDampStep` helpers\nthere drive the view mount, tool deploy, and movement blend.\n`PlayerRescueEnt::UpdateCheckpoint` is a decompiler mis-binding - it is a\ntrivial 3-float store that tests nothing.\n\n## The pipeline\n`PlayerRescueEnt::UpdateLocomotionAndTools` (0x0044f340): update the\nfirst-person `EntityCam` (`+0x3460`) - reset, set pos, `EntityCam::PitchBy`,\northonormalize - then tick the smoothed view-mount `XFormAnimMover`\n(`+0x34a4`), then dispatch the `ACTION` axis to the current tool.\n\n## Cheats / spectator\n`DBG_TOGGLE_SPECT` (F7, dev builds) toggles `+0x380` - noclip, gravity 0,\nspeed cap 800; `JUMP` while spectating exits it. `DBG_WIN_LEVEL` (F8)\nforce-wins.","status":"stable","updated_at":"2026-08-29 22:45:21"},
{"slug":"speedrun-tech","title":"Speedrun / TAS tech - framerate, collision, sequence breaks, timing","subsystem":"rescue","body":"Running tally of what a speedrunner / TAS author can and cannot exploit.\nBuilt cluster-by-cluster; see also `movement-tech` (jump / momentum) and\n`victims` (spawn determinism). Verdict tags: **EXISTS / ABSENT / MARGINAL**,\n**STABLE / FRAGILE**.\n\n## Cluster 1 - Framerate\n\nThe game is hard-capped at **60 FPS** by a `Sleep(1)` busy-wait in\n`GameClock::ComputeFrameDelta` (0x0042bf70); per-frame `dt` (`g_frameDeltaTime`\n0x00502b04) is clamped to `[1/60 s, 0.1 s]`. One physics/Euler step per frame,\nno sub-stepping.\n\n| Quantity | FPS-dependent? | Notes |\n| --- | --- | --- |\n| View rotation (mouse look) | **No, by design** | `yaw/pitch += GetAxis(...)` with no `dt`; the DirectInput mouse delta is *summed* over the frame (`DrainMouseBuffer` 0x00437ab0). `GetSteerAxis` = `-MouseSens * accum`, linear, no accel curve. |\n| Ground top speed | **No** | the `t = frac^(27*dt)` blend has a dt-independent fixed point = wishspeed (400 / 260 crouch / 800 spectator). |\n| Jump apex height | **YES** | 80.0 u ideal -> 73.3 u at the 60 cap -> 40.0 u at 10 FPS (`v0*T - 500*T^2 - 1000*T*dt`). |\n| Air time | **YES** | 0.800 s -> 0.767 s (60) -> 0.600 s (10). Time-to-apex ~0.40 s always. |\n| Horizontal jump distance | **YES** (via air time) | 320 -> 307 (60) -> 240 (10) u at 400 u/s. |\n| Coyote window | **YES** | exactly one frame = `dt` s (~17 ms at 60, ~100 ms at 10). |\n| Jump cooldown / mission timer / gravity | No | wall-clock or `dt`-scaled. |\n\n**Levers:**\n- **Uncapping FPS (patch out the `Sleep(1)` at 0x0042bf70): EXISTS, STABLE.**\n  Deterministic mechanical gain - jumps ~9% higher (73.3 -> ~80 u), air time\n  and horizontal jump distance ~4% longer, asymptoting at the `dt -> 0` values.\n  Ground speed and rotation unchanged. This is the *only* real \"FPS matters\"\n  advantage and it favours **more** FPS.\n- **Lowering FPS: no advantage.** Jumps get strictly worse; ground speed\n  unchanged; the only upside (wider coyote window) is marginal.\n- **Mouse buffer overflow bug: FRAGILE hazard, not a tech.** The mouse buffer\n  is `DIPROP_BUFFERSIZE = 10`; on `DI_BUFFEROVERFLOW` the code drops the\n  **entire frame''s** mouse motion (\"Lost sync with mouse\", no `GetDeviceState`\n  fallback). A high-poll mouse overflows even at 60 FPS during fast flicks;\n  low FPS makes it chronic -> under-rotation. A TAS feeding <=1 event/axis\n  per frame never overflows and gets perfectly deterministic, FPS-independent\n  aiming. See `input`.\n- No air-accel / bhop / diagonal-speed tech at any FPS (see `movement-tech`).\n- No low-FPS double jump (one `Verb_Jump` per frame, cooldown stamp precedes\n  return).\n\n## Cluster 1 - Collision / out-of-bounds\n\nThe player''s **only** per-frame world collision is\n`BModelEnt::DepenetrateFromWorld` (0x0043f6d0), called from `Think` on the\n*pre-move* position; then `Think` does a **raw `pos += disp`** (no clamp to\nthe contact point). Depenetration does a swept `geWorld_Collision` box\n(`ROCRender::TraceToFloor` 0x00492ce0 - actually a general swept-box trace,\nnot a ray) from `+0x68` along the displacement `+0x90`. On a hit it calls the\npush-out virtual `[vtbl+0x38]` up to 5x - but that slot is\n**`0x0043f670 = RET 4`, an empty stub in every entity vtable**, so the solver\n**can never move the player**. It falls through to `ClipVelocitySimple`:\n\n| Swept box result | Effect on `disp` | Net |\n| --- | --- | --- |\n| no contact | unchanged | full move applies |\n| contact, `normal.Y >= 0.5` (floor / <=60deg ramp) | **unchanged** | full move applies even if it drives the AABB through/below the surface - no surface clamp |\n| contact, `normal.Y < 0.5` (wall / ceiling / >60deg) | **zeroed** (+ velocity zeroed) | dead stop at the pre-move position, no wall-slide, all momentum lost |\n\n| Route out of bounds | Verdict | Why |\n| --- | --- | --- |\n| Clip a sealed, in-mask wall at speed | **ABSENT** | the swept test is continuous - even a ~40 u (`dt=0.1`, 400 u/s) step through a thin solid registers -> hard stop. Depenetration can''t push you out the far side (stub). |\n| Fall through a thin floor / off a thin ledge | **EXISTS, FPS-dependent** | the walkable-hit branch does not clamp or shorten `disp`; `pos += disp` plants the whole AABB past a thin brush in one large-`dt` frame; next frame''s downward sweep no longer hits the (now overhead) floor -> free-fall below the map. Needs thin floor + void/room beneath + one large-`dt` frame (low FPS or a hitch) + enough velocity. At 60 FPS (~6.7 u/frame) the window is tiny; at `dt=0.1` (~40 u horiz / ~50 u+ in a developed fall) it opens. Repeatable where you can force a hitch at the spot; not frame-perfect-hard. |\n| Start-solid ooze-through | **EXISTS, NON-DETERMINISTIC** | once embedded (from the row above, a scripted teleport into geometry, or a mover trap): if the engine reports the start-solid plane as `normal.Y >= 0.5`, `disp` is not zeroed and the wish-velocity blend drifts you out the far face at <= `400*dt`/frame into whatever is beyond. If it reports `< 0.5`, you are frozen in place instead. Which occurs is the engine''s plane choice. |\n| Moving `TE_BModel` push / crush / carry-through-wall | **ABSENT** | `TE_BModel::Think` (0x0043dc60) never reads or writes player pos/vel and has no damage call. A door closing on you -> frozen in place (not crushed), freed when it retracts. A platform rising into you -> \"swallowed\", then you drop out the underside. No mechanism shoves you into adjacent solid. |\n| `SnapToFloor` miss -> teleport to world origin | **EXISTS, rare** | `ModelEntity::SnapToFloor` (0x0049da00) on a missed down-trace is **non-fatal** (`GenErr` severity 2, silent in retail); the zero-init out-params leave the caller writing `pos = (0, 1, 0)`. Player path = `ResetLocomotionState` (respawn / reset) only, so it needs a floorless stored checkpoint (destructible or moved floor). |\n| No player auto-step | (mechanic note) | the `+0x138 = 16.0` clearance probe lives in `BModelEnt::Think`, which the player never invokes. Walking into a curb -> `normal.Y ~ 0` -> dead stop. Climbable \"stairs\" must be <=60deg ramps. |\n| Coyote-frame drop-through | **ABSENT** | one frame, 500 ms cooldown; a coyote jump carries you *away* from a thin floor. The real drop-through is the horizontal thin-ledge overshoot above (no jump needed). |\n\n**Root cause of the exploitable cases:** `pos += disp` is never clamped to\nthe swept contact point - the swept test only yields a binary hard-stop\n(walls) or do-nothing (floors/ramps), and the do-nothing branch applies the\n*entire* displacement. With `dt` clamped up to 0.1 s, one low-FPS or hitched\nframe can step the whole collision AABB past thin geometry the previous\nframe''s sweep was still clear of. Practical OoB therefore wants a **weak\nmachine or a deliberately induced frame hitch at a known thin-floor spot** -\nthere is no clean, FPS-independent wall clip.\n\n## Cluster 2 - Sequence breaks\n\n| Break | Verdict | Mechanism |\n| --- | --- | --- |\n| **`escape`-verb delivery skip** | **EXISTS, STABLE** (needs verb access) | `Verb_Escape` (0x004513a0) unconditionally tail-calls `DeliverCarriedSurvivor` (0x00451160, Ghidra-misnamed `TeleportToCheckpoint`), whose only gate is \"carrying a victim\" (`+0x3534 != 0`). It does `+0x352c(delivered) += 1` + `WarpToRescuerAndFade` with **no zone / ground / distance check**. The `onGround && +0x3450 > 0.5` test in `Verb_Escape` gates only the checkpoint snapshot; `+0x3434` there is the saved yaw, not a gate. Pickup is automatic on AABB overlap. Route: walk over each victim, `escape` from anywhere, repeat until `delivered == total`, then one `finalexit` (no positional check at all) ends the level from any position. |\n| **Victim-counter race** (`finalexit` before victims tallied) | **ABSENT / DEFENDED** | `VictimRescueEnt::SpawnAtSpot` (0x0045d5b0) writes `PlayerRescueEnt+0x
